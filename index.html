  async function marcarLembrete(id) {
    const x = LB.lista.find(y => y.id === id);
    if (!x) return;
    x.feito = !x.feito;
    renderAtual();
    try { await colecao("lembretes").doc(id).update({ feito: x.feito }); }
    catch (err) { mostrarErro(err.message); }
  }

  async function tratarCliqueLembretes(e) {
    try {
      const el = e.target.closest("[data-acao]");
      if (!el) return;
      const a = el.dataset.acao;
      const r = LB.r;
      if (a === "lb-nav") { const m = LB.mes + Number(el.dataset.d); LB.ano += Math.floor(m / 12); LB.mes = ((m % 12) + 12) % 12; renderLembretes(); }
      else if (a === "lb-modo-mes") { LB.modo = "mes"; renderLembretes(); }
      else if (a === "lb-dia") { LB.dia = el.dataset.iso; LB.modo = "dia"; renderLembretes(); }
      else if (a === "lb-novo") { LB.formAberto = true; LB.r = { titulo: "", dataISO: LB.dia || hojeISO(), hora: "", repete: "nao", diasSemana: [], diaMes: "", vezes: "" }; renderLembretes(); }
      else if (a === "lb-cancelar") { LB.formAberto = false; LB.r = null; renderLembretes(); }
      else if (a === "lb-rep-dia") { const i = Number(el.dataset.i); const l = r.diasSemana || []; r.diasSemana = l.includes(i) ? l.filter(x => x !== i) : l.concat([i]); renderLembretes(); }
      else if (a === "lb-salvar") await salvarLembrete();
      else if (a === "lb-excluir") {
        if (!(await confirmar("Excluir este lembrete?"))) return;
        await colecao("lembretes").doc(el.dataset.id).delete();
        LB.lista = LB.lista.filter(x => x.id !== el.dataset.id);
        renderLembretes();
      }
    } catch (err) { mostrarErro(err.message); }
  }

  function tratarEntradaLembretes(e) {
    const d = e.target.dataset;
    if (d.campo === "lb-busca") { LB.busca = e.target.value; renderListaLembretes(); return; }
    const r = LB.r;
    if (!r) return;
    if (d.campo === "lb-titulo") r.titulo = e.target.value;
    else if (d.campo === "lb-desc") r.desc = e.target.value;
    else if (d.campo === "lb-data") r.dataISO = e.target.value;
    else if (d.campo === "lb-hora") r.hora = e.target.value;
    else if (d.campo === "lb-rep-dia-mes") r.diaMes = e.target.value;
    else if (d.campo === "lb-rep-vezes") r.vezes = e.target.value;
    else if (d.campo === "lb-rep-tipo" && e.type === "change") { r.repete = e.target.value; renderLembretes(); }
  }

  async function salvarLembrete() {
    const r = LB.r;
    const st = document.getElementById("lb-status");
    if (!r.titulo.trim()) { if (st) st.textContent = "Escreva o lembrete."; return; }
    if (!r.dataISO) { if (st) st.textContent = "Escolha a data."; return; }
    const datas = ocorrencias({ dataISO: r.dataISO, repete: r.repete, diasSemana: r.diasSemana, diaMes: r.diaMes, vezes: r.vezes });
    const grupo = datas.length > 1 ? "g" + Date.now() : null;
    try {
      for (const d of datas) {
        const o = { titulo: r.titulo.trim(), dataISO: d, hora: r.hora || null, desc: (r.desc || "").trim() || null };
        if (grupo) o.grupo = grupo;
        const ref = await colecao("lembretes").add(o);
        LB.lista.push({ id: ref.id, ...o });
      }
      LB.formAberto = false;
      LB.r = null;
      renderLembretes();
    } catch (err) { if (st) st.textContent = "Erro ao salvar: " + err.message; }
  }

  // ---------- Financeiro ----------
  const FN = { ano: null, mes: null, lista: [], tipos: [], categorias: [], form: null, delParc: null };
  const TIPOS_LANC = { entrada: "Entrada", variavel: "Gasto variável", conta: "Conta fixa", invest: "Investimento", outro: "Outro gasto" };
  const KIND_GASTO = ["variavel", "conta", "invest", "outro"];

  async function carregarFinanceiro() {
    try {
      const [a, t, c] = await Promise.all([colecao("financas").get(), colecao("tiposFin").get(), colecao("categoriasFin").get()]);
      FN.lista = a.docs.map(d => ({ id: d.id, ...d.data() }));
      FN.tipos = t.docs.map(d => ({ id: d.id, ...d.data() }));
      FN.categorias = c.docs.map(d => ({ id: d.id, ...d.data() }));
    } catch (e) { mostrarErro(e.message); }
  }

  function mesesEntre(a, b) {
    const [ay, am] = a.split("-").map(Number), [by, bm] = b.split("-").map(Number);
    return (by - ay) * 12 + (bm - am);
  }

  function lancamentosDoMes(ano, mes) {
    const ym = ano + "-" + pad(mes + 1);
    const out = [];
    FN.lista.forEach(x => {
      if (!x.recorr) { if (x.dataISO.slice(0, 7) === ym) out.push(x); return; }
      const inicio = x.recorr.inicio.slice(0, 7);
      if (ym < inicio) return;
      if (x.recorr.tipo === "fixo" && x.recorr.ate !== "sempre" && ym > x.recorr.ate) return;
      if (x.recorr.tipo === "parcelas" && mesesEntre(inicio, ym) >= x.recorr.total) return;
      if ((x.excluidas || []).includes(ym)) return;
      out.push({ ...x, dataISO: ym + "-" + x.recorr.inicio.slice(8, 10), ym: ym });
    });
    return out;
  }

  // Saldo cumulativo: soma o saldo de todos os meses desde o primeiro lançamento até o mês visualizado.
  function saldoAcumulado(ano, mes) {
    const alvo = ano + "-" + pad(mes + 1);
    const meses = FN.lista.map(x => x.dataISO.slice(0, 7)).concat(FN.lista.filter(x => x.recorr).map(x => x.recorr.inicio.slice(0, 7)));
    if (!meses.length) return 0;
    const inicio = meses.reduce((a, b) => (b < a ? b : a));
    let y = Number(inicio.slice(0, 4)), m = Number(inicio.slice(5, 7));
    let cur = y + "-" + pad(m);
    let total = 0, guarda = 0;
    while (cur <= alvo && guarda < 1200) {
      const lista = lancamentosDoMes(y, m - 1);
      const soma = t => lista.filter(x => x.tipo === t).reduce((a, x) => a + valorExibido(x), 0);
      total += soma("entrada") - soma("conta") - soma("variavel") - soma("outro") - soma("invest");
      m++; if (m > 12) { m = 1; y++; }
      cur = y + "-" + pad(m);
      guarda++;
    }
    return total;
  }

  function parcelaTexto(x, ym) {
    if (!x.recorr) return "";
    if (x.recorr.tipo === "fixo") return "(fixo)";
    return "(parcela " + (mesesEntre(x.recorr.inicio.slice(0, 7), ym) + 1) + " de " + x.recorr.total + ")";
  }

  function valorExibido(x) {
    const v = Number(x.valor) || 0;
    return x.recorr && x.recorr.tipo === "parcelas" ? v / Math.max(1, x.recorr.total) : v;
  }

  function dataPadraoFN() {
    const h = new Date();
    if (h.getFullYear() === FN.ano && h.getMonth() === FN.mes) return hojeISO();
    return FN.ano + "-" + pad(FN.mes + 1) + "-01";
  }

  function renderFinanceiro() {
    const el = document.getElementById("financeiro");
    if (!el) return;
    if (FN.ano === null) { const h = new Date(); FN.ano = h.getFullYear(); FN.mes = h.getMonth(); }
    const ym = FN.ano + "-" + pad(FN.mes + 1);
    const lista = lancamentosDoMes(FN.ano, FN.mes);
    const soma = t => lista.filter(x => x.tipo === t).reduce((a, x) => a + valorExibido(x), 0);
    const entradas = soma("entrada"), contas = soma("conta"), variaveis = soma("variavel"), invest = soma("invest"), outros = soma("outro");
    const gastos = variaveis + outros + invest;
    const saldo = saldoAcumulado(FN.ano, FN.mes);
    const fmt = v => "R$ " + Number(v).toFixed(2).replace(".", ",");
    const dc = d => d.slice(8, 10) + "/" + d.slice(5, 7);
    const del = x => "<button class='excluir' data-acao='fin-del' data-id='" + x.id + "' data-ym='" + ym + "' aria-label='Excluir'>×</button>";
    const delCard = FN.delParc ? "<div class='ag-form'><h3>Excluir parcela</h3><p class='vazio' style='text-align:left'>Quer apagar só esta parcela ou todas as parcelas deste gasto?</p><div class='centro'><button class='secundario' data-acao='fin-del-cancel'>Cancelar</button><button class='secundario' data-acao='fin-del-so'>Só esta parcela</button><button class='grande' data-acao='fin-del-todas'>Todas as parcelas</button></div></div>" : "";
    const cabs = {
      conta: ["Paga", "Conta", "Categoria", "Valor", "Vencimento", ""],
      variavel: ["Data", "Descrição", "Categoria", "Valor", ""],
      entrada: ["Data", "Descrição", "Categoria", "Valor", ""],
      invest: ["Data", "Descrição", "Categoria", "Valor", ""],
      outro: ["Data", "Descrição", "Categoria", "Valor", ""]
    };

    const secao = (titulo, tipo, total) => {
      const cls = tipo === "conta" ? "fin-cols-conta" : (["variavel", "entrada", "outro", "invest"].includes(tipo) ? "fin-cols-variavel" : "fin-cols-simple");
      const cab = "<div class='fin-linha fin-cab " + cls + "'>" + cabs[tipo].map(t => "<span>" + t + "</span>").join("") + "</div>";
      const linhas = lista.filter(x => x.tipo === tipo).sort((a, b) => a.dataISO.localeCompare(b.dataISO)).map(x => {
        const cat = FN.categorias.find(c => c.id === x.categoria);
        const pago = x.pagos && x.pagos[ym];
        if (tipo === "conta") {
          return "<div class='fin-linha fin-cols-conta'>" +
            "<button class='bolinha" + (pago ? " feita" : "") + "' data-acao='fin-pago' data-id='" + x.id + "' data-ym='" + ym + "' aria-label='Marcar como paga'>" + (pago ? ICONE_CHECK : "") + "</button>" +
            "<span class='fin-desc'>" + esc(x.descricao) + " <small>" + parcelaTexto(x, ym) + "</small></span>" +
            "<span class='fin-cat' style='color:" + (cat ? cat.cor : "#6B6259") + "'>" + (cat ? esc(cat.nome) : "—") + "</span>" +
            "<span>" + fmt(valorExibido(x)) + "</span><span>" + dc(x.dataISO) + "</span>" + del(x) + "</div>";
        }
        if (["variavel", "entrada", "outro", "invest"].includes(tipo)) {
          return "<div class='fin-linha fin-cols-variavel'><span>" + dc(x.dataISO) + "</span>" +
            "<span class='fin-desc'>" + esc(x.descricao) + " <small>" + parcelaTexto(x, ym) + "</small></span>" +
            "<span class='fin-cat' style='color:" + (cat ? cat.cor : "#6B6259") + "'>" + (cat ? esc(cat.nome) : "—") + "</span>" +
            "<span>" + fmt(valorExibido(x)) + "</span>" + del(x) + "</div>";
        }
        return "<div class='fin-linha fin-cols-simple'><span>" + dc(x.dataISO) + "</span>" +
          "<span class='fin-desc'>" + esc(x.descricao) + " <small>" + parcelaTexto(x, ym) + "</small></span>" +
          "<span>" + fmt(valorExibido(x)) + "</span>" + del(x) + "</div>";
      }).join("");
      return "<div class='bloco'><div class='habitos-topo'><h3>" + titulo + "</h3>" +
        "<button class='add-bordo-sm' data-acao='fin-add' data-tipo='" + tipo + "' aria-label='Adicionar'>+</button></div>" +
        cab + (linhas || "<p class='vazio'>Nenhum lançamento.</p>") +
        "<div class='fin-total'><span>Total</span><span>" + fmt(total) + "</span></div></div>";
    };

    const linhaCat = c => {
      const acoesCat = "<button class='excluir' data-acao='fin-cat-edit' data-id='" + c.id + "' aria-label='Editar categoria'>✎</button> <button class='excluir' data-acao='fin-cat-del' data-id='" + c.id + "' aria-label='Excluir categoria'>×</button>";
      const total = lista.filter(x => c.kind === "ganho" ? (x.tipo === "entrada" && x.categoria === c.id) : (KIND_GASTO.includes(x.tipo) && x.categoria === c.id))
        .reduce((a, x) => a + valorExibido(x), 0);
      return "<div class='cat-linha'><span class='swatch' style='background:" + c.cor + "'></span><span>" + esc(c.nome) + "</span><strong>" + fmt(total) + "</strong>" + acoesCat + "</div>";
    };
    const catsEntrada = FN.categorias.filter(c => c.kind === "ganho").map(linhaCat).join("") || "<p class='vazio'>Nenhuma categoria de entrada.</p>";
    const catsGasto = FN.categorias.filter(c => c.kind !== "ganho").map(linhaCat).join("") || "<p class='vazio'>Nenhuma categoria de gasto.</p>";

    const donutDados = FN.categorias.filter(c => c.kind !== "ganho").map(c => ({ c, v: lista.filter(x => KIND_GASTO.includes(x.tipo) && x.categoria === c.id).reduce((a, x) => a + valorExibido(x), 0) })).filter(d => d.v > 0);
    const totalDonut = donutDados.reduce((a, d) => a + d.v, 0);
    let donut = "<p class='vazio'>Sem gastos categorizados.</p>";
    if (totalDonut > 0) {
      const C = 2 * Math.PI * 40;
      let off = 0;
      const arcos = donutDados.map(d => {
        const len = d.v / totalDonut * C;
        const arco = "<circle cx='60' cy='60' r='40' fill='none' stroke='" + d.c.cor + "' stroke-width='18' stroke-dasharray='" + len + " " + C + "' stroke-dashoffset='" + (-off) + "' transform='rotate(-90 60 60)'/>";
        off += len;
        return arco;
      }).join("");
      donut = "<div style='display:flex;flex-direction:column;gap:12px;align-items:center'><svg viewBox='0 0 120 120' width='240' height='240'>" + arcos + "</svg><div style='font-size:0.9rem;text-align:left'>" +
        donutDados.map(d => "<div><span style='color:" + d.c.cor + "'>●</span> " + esc(d.c.nome) + " " + Math.round(d.v / totalDonut * 100) + "%</div>").join("") + "</div></div>";
    }

    let form = "";
    const f = FN.form;
    if (f && f.kind === "lanc") {
      const cats = FN.categorias.filter(c => f.tipo === "entrada" ? c.kind === "ganho" : c.kind !== "ganho");
      form = "<div class='ag-form'><h3>Novo: " + TIPOS_LANC[f.tipo] + "</h3>" +
        "<input placeholder='Descrição' data-campo='f-desc' value='" + esc(f.descricao) + "'>" +
        "<div class='ag-linha'><input type='number' inputmode='decimal' step='0.01' placeholder='Valor' data-campo='f-valor' value='" + f.valor + "'>" +
        "<input type='date' data-campo='f-data' value='" + f.dataISO + "'></div>" +
        ("<label>Categoria</label><select data-campo='f-cat'><option value=''>Sem categoria</option>" + cats.map(c => "<option value='" + c.id + "'" + (f.categoria === c.id ? " selected" : "") + ">" + esc(c.nome) + "</option>").join("") + "</select>") +
        "<label>Repetir</label><select data-campo='f-rep'>" +
          "<option value='nao'" + (f.rep === "nao" ? " selected" : "") + ">Não repete</option>" +
          "<option value='fixo'" + (f.rep === "fixo" ? " selected" : "") + ">Fixo (todo mês)</option>" +
          "<option value='parcelas'" + (f.rep === "parcelas" ? " selected" : "") + ">Parcelado</option></select>" +
        (f.rep === "fixo" ? "<label style='display:flex;gap:6px;align-items:center'><input type='checkbox' data-campo='f-sempre' style='width:auto;margin:0' " + (f.sempre ? "checked" : "") + ">Repetir para sempre</label>" +
          (f.sempre ? "" : "<label>Repetir até</label><input type='month' data-campo='f-ate' value='" + f.ate + "'>") : "") +
        (f.rep === "parcelas" ? "<input type='number' inputmode='numeric' placeholder='Número de parcelas' data-campo='f-parc' value='" + f.parc + "'>" : "") +
        "<div class='centro'><button class='secundario' data-acao='fin-cancelar'>Cancelar</button><button class='grande' data-acao='fin-salvar'>Salvar</button></div></div>";
    } else if (f && f.kind === "cat") {
      form = "<div class='ag-form'><h3>Nova categoria</h3><input placeholder='Nome' data-campo='c-nome' value='" + esc(f.nome) + "'>" +
        "<label>Tipo</label><select data-campo='c-kind'><option value='gasto'" + (f.kindC === "gasto" ? " selected" : "") + ">Categoria de gasto</option><option value='ganho'" + (f.kindC === "ganho" ? " selected" : "") + ">Categoria de entrada</option></select>" +
        "<label>Cor</label>" + htmlSeletorCor("c", f.cor, null) +
        "<div class='centro'><button class='secundario' data-acao='fin-cancelar'>Cancelar</button><button class='grande' data-acao='fin-salvar'>Salvar</button></div></div>";
    }

    el.innerHTML = "<h2>Financeiro do mês</h2>" +
      "<div class='nav'><button class='icone' data-acao='fin-nav' data-d='-1' aria-label='Mês anterior'>‹</button>" +
      "<strong>" + capitalizar(MESES[FN.mes]) + " de " + FN.ano + "</strong>" +
      "<button class='icone' data-acao='fin-nav' data-d='1' aria-label='Próximo mês'>›</button></div>" +
      "<div class='fin-cards'>" +
        "<div class='fin-card'><small>Entradas</small><strong>" + fmt(entradas) + "</strong></div>" +
        "<div class='fin-card'><small>Gastos</small><strong>" + fmt(gastos) + "</strong></div>" +
        "<div class='fin-card'><small>Contas fixas</small><strong>" + fmt(contas) + "</strong></div>" +
        "<div class='fin-card saldo'><small>Saldo acumulado</small><strong>" + fmt(saldo) + "</strong></div></div>" +
      delCard + form +
      "<div class='fin-grade'>" +
        secao("Entradas", "entrada", entradas) +
        secao("Contas e vencimentos", "conta", contas) +
        secao("Gastos variáveis", "variavel", variaveis) +
        secao("Investimentos e reservas", "invest", invest) +
        secao("Outros gastos", "outro", outros) +
        "<div class='bloco'><div class='habitos-topo'><h3>Categorias de entrada</h3><button class='add-bordo-sm' data-acao='fin-add-cat' data-kind='ganho' aria-label='Nova categoria de entrada'>+</button></div>" + catsEntrada + "</div>" +
        "<div class='bloco'><h3>Quais são os meus gastos</h3>" + donut + "</div>" +
        "<div class='bloco'><div class='habitos-topo'><h3>Categorias de gasto</h3><button class='add-bordo-sm' data-acao='fin-add-cat' data-kind='gasto' aria-label='Nova categoria de gasto'>+</button></div>" + catsGasto + "</div>" +
      "</div>";
  }

  function htmlFinForm() { return ""; }

  async function tratarCliqueFin(e) {
    try {
      const el = e.target.closest("[data-acao]");
      if (!el) return;
      const a = el.dataset.acao;
      if (a === "fin-nav") { const m = FN.mes + Number(el.dataset.d); FN.ano += Math.floor(m / 12); FN.mes = ((m % 12) + 12) % 12; FN.form = null; renderFinanceiro(); }
      else if (a === "fin-add") { FN.form = { kind: "lanc", tipo: el.dataset.tipo, descricao: "", valor: "", dataISO: dataPadraoFN(), categoria: "", tipoId: "", rep: "nao", sempre: false, ate: "", parc: "" }; renderFinanceiro(); }
      else if (a === "fin-add-cat") { FN.form = { kind: "cat", nome: "", kindC: el.dataset.kind || "gasto", cor: "#770523" }; renderFinanceiro(); }
      else if (a === "fin-add-tipo") { FN.form = { kind: "tipo", nome: "", kindT: "gasto" }; renderFinanceiro(); }
      else if (a === "fin-cat-edit") { const c = FN.categorias.find(x => x.id === el.dataset.id); if (c) { FN.form = { kind: "cat", id: c.id, nome: c.nome, kindC: c.kind, cor: c.cor }; renderFinanceiro(); } }
      else if (a === "fin-cat-del") {
        if (!(await confirmar("Excluir esta categoria? Os lançamentos que a usam ficam sem categoria."))) return;
        await colecao("categoriasFin").doc(el.dataset.id).delete();
        FN.categorias = FN.categorias.filter(x => x.id !== el.dataset.id);
        renderFinanceiro();
      }
      else if (a === "fin-cancelar") { FN.form = null; renderFinanceiro(); }
      else if (a === "fin-salvar") await salvarFinanceiro();
      else if (a === "fin-pago") {
        const x = FN.lista.find(y => y.id === el.dataset.id);
        if (!x) return;
        x.pagos = x.pagos || {};
        const ym = el.dataset.ym;
        x.pagos[ym] = !x.pagos[ym];
        renderFinanceiro();
        await colecao("financas").doc(x.id).update({ ["pagos." + ym]: x.pagos[ym] });
      }
      else if (a === "fin-del") {
        const x = FN.lista.find(y => y.id === el.dataset.id);
        if (x && x.recorr && x.recorr.tipo === "parcelas") { FN.delParc = { id: x.id, ym: el.dataset.ym }; renderFinanceiro(); return; }
        if (!(await confirmar("Excluir este lançamento? Se ele se repete, todos os meses serão removidos."))) return;
        await colecao("financas").doc(el.dataset.id).delete();
        FN.lista = FN.lista.filter(x => x.id !== el.dataset.id);
        renderFinanceiro();
      }
      else if (a === "fin-del-cancel") { FN.delParc = null; renderFinanceiro(); }
      else if (a === "fin-del-so") {
        const x = FN.lista.find(y => y.id === FN.delParc.id);
        if (x) {
          x.excluidas = (x.excluidas || []).concat([FN.delParc.ym]);
          await colecao("financas").doc(x.id).update({ excluidas: x.excluidas });
        }
        FN.delParc = null;
        renderFinanceiro();
      }
      else if (a === "fin-del-todas") {
        await colecao("financas").doc(FN.delParc.id).delete();
        FN.lista = FN.lista.filter(x => x.id !== FN.delParc.id);
        FN.delParc = null;
        renderFinanceiro();
      }
      else if (a === "fin-tipo-del") {
        if (!(await confirmar("Excluir este tipo?"))) return;
        await colecao("tiposFin").doc(el.dataset.id).delete();
        FN.tipos = FN.tipos.filter(t => t.id !== el.dataset.id);
        renderFinanceiro();
      }
    } catch (err) { mostrarErro(err.message); }
  }

  function tratarEntradaFin(e) {
    const d = e.target.dataset;
    const f = FN.form;
    if (!f || !d.campo) return;
    const mudaForm = e.type === "change";
    if (d.campo === "f-desc") f.descricao = e.target.value;
    else if (d.campo === "f-valor") f.valor = e.target.value;
    else if (d.campo === "f-data") f.dataISO = e.target.value;
    else if (d.campo === "f-cat") f.categoria = e.target.value;
    else if (d.campo === "f-parc") f.parc = e.target.value;
    else if (d.campo === "f-ate") f.ate = e.target.value;
    else if (d.campo === "f-rep" && mudaForm) { f.rep = e.target.value; renderFinanceiro(); }
    else if (d.campo === "f-sempre" && mudaForm) { f.sempre = e.target.checked; renderFinanceiro(); }
    else if (d.campo === "c-nome") f.nome = e.target.value;
    else if (d.campo === "c-kind" && mudaForm) f.kindC = e.target.value;
    else if (d.campo === "c-cor") f.cor = e.target.value;
    else if (d.campo === "c-hex") {
      const v = e.target.value.trim();
      if (/^#[0-9a-fA-F]{6}$/.test(v)) {
        f.cor = v.toLowerCase();
        const linha = e.target.closest(".cor-linha");
        if (linha) linha.querySelectorAll("input").forEach(x => { if (x !== e.target) x.value = f.cor; });
      }
    }
  }

  async function salvarFinanceiro() {
    const f = FN.form;
    try {
      if (f.kind === "lanc") {
        const valor = Number(String(f.valor).replace(",", "."));
        if (!valor || valor <= 0) { mostrarErro("Digite um valor maior que zero."); return; }
        if (!f.dataISO) { mostrarErro("Escolha a data."); return; }
        const obj = { tipo: f.tipo, descricao: (f.descricao || "").trim(), valor: valor, dataISO: f.dataISO, categoria: f.categoria || null, tipoId: null, pagos: {} };
        if (f.rep === "fixo") obj.recorr = { tipo: "fixo", inicio: f.dataISO, ate: f.sempre ? "sempre" : (f.ate || "sempre") };
        if (f.rep === "parcelas") obj.recorr = { tipo: "parcelas", inicio: f.dataISO, total: Math.max(1, Number(f.parc) || 1) };
        const ref = await colecao("financas").add(obj);
        FN.lista.push({ id: ref.id, ...obj });
      } else if (f.kind === "cat") {
        if (!f.nome.trim()) { mostrarErro("Dê um nome à categoria."); return; }
        const obj = { nome: f.nome.trim(), kind: f.kindC, cor: f.cor };
        if (f.id) {
          await colecao("categoriasFin").doc(f.id).update(obj);
          const c = FN.categorias.find(x => x.id === f.id);
          if (c) Object.assign(c, obj);
        } else {
          const ref = await colecao("categoriasFin").add(obj);
          FN.categorias.push({ id: ref.id, ...obj });
        }
      } else if (f.kind === "tipo") {
        if (!f.nome.trim()) { mostrarErro("Dê um nome ao tipo."); return; }
        const obj = { nome: f.nome.trim(), kind: f.kindT };
        const ref = await colecao("tiposFin").add(obj);
        FN.tipos.push({ id: ref.id, ...obj });
      }
      FN.form = null;
      renderFinanceiro();
    } catch (err) { mostrarErro(err.message); }
  }

  // ---------- Estudos: planejamento acadêmico (fase 1) ----------
  const E = { dataTeste: null, testeTmp: "", view: null, tab: "cal", ano: null, mes: null, dia: null, sem: {}, materias: [], aulas: [], provas: [], form: null, novaMat: { nome: "", cor: "#770523" } };
  const PERIODOS = [["manha", "Manhã"], ["tarde", "Tarde"], ["noite", "Noite"]];
  const TIPOS_PROVA = ["Prova", "Prática", "Seminário", "Outro"];

  async function carregarEstudos() {
    try {
      const [cfg, mat, au, pr, rv, tst, pos] = await Promise.all([
        colecao("estudosConfig").doc("semestre").get(), colecao("materias").get(), colecao("aulas").get(), colecao("provas").get(), colecao("revisoes").get(), colecao("estudosConfig").doc("teste").get(), colecao("posProva").get()
      ]);
      E.sem = cfg.exists ? cfg.data() : {};
      E.materias = mat.docs.map(d => ({ id: d.id, ...d.data() }));
      E.aulas = au.docs.map(d => ({ id: d.id, ...d.data() }));
      E.provas = pr.docs.map(d => ({ id: d.id, ...d.data() }));
      RV.lista = rv.docs.map(d => ({ id: d.id, ...d.data() }));
      E.dataTeste = tst.exists ? tst.data().dataISO : null;
      RV.pos = pos.docs.map(d => ({ id: d.id, ...d.data() }));
      await gerarRevisoes();
      await carregarSessoes();
    } catch (e) { mostrarErro(e.message); }
  }

  function corMateria(id) { const m = E.materias.find(x => x.id === id); return m ? m.cor : "#6B6259"; }
  function nomeMateria(id) { const m = E.materias.find(x => x.id === id); return m ? m.nome : "Sem matéria"; }
  function nomePeriodo(v) { const p = PERIODOS.find(x => x[0] === v); return p ? p[1] : ""; }

  function conteudosDaProva(p) {
    let ids = [];
    if (p.abrangencia === "cumulativa") {
      const ate = p.ateData || p.dataISO;
      ids = E.aulas.filter(a => a.materiaId === p.materiaId && a.dataISO <= ate && a.dataISO >= (p.deData || "0000-00-00")).map(a => a.id).filter(id => !(p.excluidos || []).includes(id));
    }
    return ids.concat((p.aulaIds || []).filter(id => !ids.includes(id)));
  }

  function renderEstudos() {
    const el = document.getElementById("estudos");
    if (!el) return;
    if (E.ano === null) { const h = new Date(); E.ano = h.getFullYear(); E.mes = h.getMonth(); E.dia = hojeISO(); }
    const abas = [["cal", "Calendário"], ["revisoes", "Revisões"], ["materias", "Matérias"], ["config", "Semestre"]].map(([v, n]) =>
      "<button class='aba" + (E.tab === v ? " ativo" : "") + "' data-acao='es-tab' data-v='" + v + "'>" + n + "</button>").join("");
    const corpo = E.tab === "config" ? htmlConfigSemestre() : (E.tab === "materias" ? htmlMaterias() : (E.tab === "revisoes" ? htmlRevisoes() : htmlCalEstudos()));
    el.innerHTML = (E.dataTeste ? "<div class='banner-teste'>Modo de teste · o app age como se hoje fosse " + dataCurta(E.dataTeste) + "</div>" : "") + "<div class='abas'>" + abas + "</div>" + corpo;
  }

  function htmlModoTeste() {
    return "<div class='bloco'><h3>Modo de teste</h3>" +
      (E.dataTeste
        ? "<p class='vazio' style='text-align:left'>Ligado: o app age como se hoje fosse <strong>" + dataCurta(E.dataTeste) + "</strong>. Só afeta as revisões e o calendário de estudos.</p>"
        : "<p class='vazio' style='text-align:left'>Desligado: o app usa a data de hoje.</p>") +
      "<label>Data de teste</label><input type='date' data-campo='es-teste-data' value='" + (E.testeTmp || E.dataTeste || "") + "'>" +
      "<div class='centro'>" + (E.dataTeste ? "<button class='secundario' data-acao='es-teste-sair'>Sair do teste</button>" : "") +
      "<button class='grande' data-acao='es-teste-usar'>Usar essa data</button></div></div>";
  }

  function htmlConfigSemestre() {
    const s = E.sem;
    const diasChips = campo => NOMES.map((n, i) =>
      "<button class='chip" + ((s[campo] || []).includes(i) ? " ativo" : "") + "' data-acao='es-dia' data-campo='" + campo + "' data-i='" + i + "'>" + n + "</button>").join("");
    const periodos = PERIODOS.map(([v, n]) =>
      "<button class='chip" + ((s.periodos || []).includes(v) ? " ativo" : "") + "' data-acao='es-periodo' data-v='" + v + "'>" + n + "</button>").join("");
    const mats = E.materias.map(m =>
      "<div class='tipo-chip'><span class='swatch' style='background:" + m.cor + "'></span>" + esc(m.nome) + "<button data-acao='es-mat-del' data-id='" + m.id + "' aria-label='Excluir'>×</button></div>").join("") || "<p class='vazio'>Nenhuma matéria cadastrada.</p>";
    return htmlModoTeste() + "<div class='bloco'><h3>Semestre</h3>" +
      "<label>Início</label><input type='date' data-campo='es-inicio' value='" + (s.inicio || "") + "'>" +
      "<label>Término</label><input type='date' data-campo='es-fim' value='" + (s.fim || "") + "'>" +
      "<label>Dias com aula</label><div class='chips'>" + diasChips("diasAula") + "</div>" +
      "<label>Períodos disponíveis para estudo</label><div class='chips'>" + periodos + "</div>" +
      "<label>Dias preferidos para estudar</label><div class='chips'>" + diasChips("diasPreferidos") + "</div>" +
      "<label>Dias de carga leve</label><div class='chips'>" + diasChips("diasLeves") + "</div>" +
      "<div class='centro'><button class='grande' data-acao='es-salvar-sem'>Salvar semestre</button></div></div>" +
      "<div class='bloco'><h3>Matérias</h3>" + mats +
      "<div class='ag-linha' style='margin-top:10px'><input placeholder='Nova matéria' data-campo='es-mat-nome' value='" + esc(E.novaMat.nome) + "'>" +
      htmlSeletorCor("es-mat", E.novaMat.cor, null) + "</div>" +
      "<div class='centro'><button class='secundario' data-acao='es-mat-add'>Adicionar matéria</button></div></div>";
  }

  function formAulaDe(x) {
    return { kind: "aula", id: x.id, materiaId: x.materiaId, conteudo: x.conteudo, dataISO: x.dataISO, periodo: x.periodo, professor: x.professor || "", obs: x.obs || "" };
  }

  function formProvaDe(p) {
    return { kind: "prova", id: p.id, nome: p.nome, materiaId: p.materiaId, dataISO: p.dataISO, horario: p.horario || "", tipo: p.tipo || "Prova", abrangencia: p.abrangencia || "especifica", ateData: p.ateData || "", deData: p.deData || "", aulaIds: (p.aulaIds || []).slice(), excluidos: (p.excluidos || []).slice(), textos: (p.textos || []).slice(), textoNovo: "", obs: p.obs || "" };
  }

  function htmlEstudoInicialChips(a) {
    const st = a.estudoInicial;
    return "<button class='chip-acao" + (st === "feito" ? " ok" : "") + "' data-acao='ei-feito' data-id='" + a.id + "'>Estudo inicial feito</button>" +
      "<button class='chip-acao" + (st === "nao" ? " ruim" : "") + "' data-acao='ei-nao' data-id='" + a.id + "'>Não foi satisfatório</button>" +
      (st ? "<button class='chip-acao' data-acao='ei-desfazer' data-id='" + a.id + "'>Desfazer</button>" : "");
  }

  function htmlInfoAula(a) {
    return "<div class='bloco'><div class='habitos-topo'><h3>Conteúdo</h3><button class='secundario' data-acao='es-voltar'>Voltar ao dia</button></div>" +
      "<div class='es-linha es-info'><i class='es-marca' style='background:" + corMateria(a.materiaId) + "'></i><span class='es-texto'>" +
      "<strong>" + esc(a.conteudo) + "</strong>" +
      "<small>Matéria: " + esc(nomeMateria(a.materiaId)) + "</small>" +
      "<small>Data: " + dataCurta(a.dataISO) + " · " + nomePeriodo(a.periodo) + "</small>" +
      (a.professor ? "<small>Professor: " + esc(a.professor) + "</small>" : "") +
      (a.obs ? "<small>Observações: " + esc(a.obs) + "</small>" : "") +
      "<div class='es-chips'>" + htmlEstudoInicialChips(a) + "</div></span></div>" +
      "<div class='es-acoes'><button class='grande' data-acao='es-alterar' data-id='" + a.id + "'>Alterar conteúdo</button>" +
      "<button class='secundario' data-acao='es-aula-del' data-id='" + a.id + "'>Excluir</button></div></div>";
  }

  function htmlInfoProva(p) {
    const nomes = conteudosDaProva(p).map(id => { const x = E.aulas.find(y => y.id === id); return x ? x.conteudo : null; }).filter(Boolean);
    const abrangencia = p.abrangencia === "cumulativa" ? "Cumulativa" + (p.deData ? " de " + dataCurta(p.deData) : "") + " até " + dataCurta(p.ateData || p.dataISO) : "Conteúdo específico";
    return "<div class='bloco'><div class='habitos-topo'><h3>Prova</h3><button class='secundario' data-acao='es-voltar'>Voltar ao dia</button></div>" +
      "<div class='es-linha es-info es-info-prova'><b class='es-prova-marca'>⚑</b><span class='es-texto'>" +
      "<strong>" + esc(p.nome) + "</strong>" +
      "<small>Matéria: " + esc(nomeMateria(p.materiaId)) + "</small>" +
      "<small>Data: " + dataCurta(p.dataISO) + (p.horario ? " · " + esc(p.horario) : "") + " · " + esc(p.tipo || "Prova") + "</small>" +
      "<small>" + abrangencia + "</small>" +
      "<small>" + (nomes.length ? "Conteúdos: " + nomes.map(esc).join(" · ") : "Sem conteúdos selecionados") + "</small>" +
      ((p.textos && p.textos.length) ? "<small>Outros: " + p.textos.map(esc).join(" · ") + "</small>" : "") +
      (p.obs ? "<small>Observações: " + esc(p.obs) + "</small>" : "") + "</span></div>" +
      "<div class='es-acoes'><button class='grande' data-acao='es-alterar-prova' data-id='" + p.id + "'>Alterar prova</button>" +
      "<button class='secundario' data-acao='es-prova-del' data-id='" + p.id + "'>Excluir</button></div></div>";
  }

  function htmlCalEstudos() {
    const primeiro = new Date(E.ano, E.mes, 1).getDay();
    const dias = new Date(E.ano, E.mes + 1, 0).getDate();
    const hoje = hojeEstudo();
    let grade = NOMES.map(n => "<div class='cal-cab'>" + n.charAt(0) + "</div>").join("");
    for (let k = 0; k < primeiro; k++) grade += "<div></div>";
    const blocoAula = a => {
      const cor = corMateria(a.materiaId);
      return "<div class='es-bloco-aula' data-acao='es-edit-aula' data-id='" + a.id + "' style='background:" + cor + "26;border-left:3px solid " + cor + "'>" +
        "<strong>" + esc(nomeMateria(a.materiaId)) + "</strong><span>" + esc(a.conteudo) + "</span></div>";
    };
    const blocoProva = p => "<div class='es-bloco-prova-cal' data-acao='es-edit-prova' data-id='" + p.id + "'>" +
      "<strong>⚑ " + esc(p.nome) + "</strong><span>" + esc(nomeMateria(p.materiaId)) + " · " + esc(p.tipo || "Prova") + "</span></div>";
    for (let d = 1; d <= dias; d++) {
      const iso = isoDe(new Date(E.ano, E.mes, d));
      const aulasDia = E.aulas.filter(a => a.dataISO === iso);
      const provasDia = E.provas.filter(p => p.dataISO === iso);
      const periodo = (v, nome) => {
        const lista = aulasDia.filter(a => a.periodo === v);
        return lista.length ? "<div class='es-periodo'><small>" + nome + "</small>" + lista.map(blocoAula).join("") + "</div>" : "";
      };
      const conteudo = provasDia.map(blocoProva).join("") + periodo("manha", "Manhã") + periodo("tarde", "Tarde") + periodo("noite", "Noite");
      const tDia = msDoDia(iso);
      grade += "<div class='es-dia" + (iso === hoje ? " hoje" : "") + (iso === E.dia ? " sel" : "") + "' data-acao='es-dia-cal' data-iso='" + iso + "'>" +
        "<span class='es-numero'>" + d + "</span>" + (tDia ? "<small class='es-tempo'>" + tmHumano(tDia) + "</small>" : "") + conteudo + "</div>";
    }
    const rm = resumoMes(E.ano, E.mes);
    const calendario = "<div class='bloco'><div class='nav'>" +
      "<button class='icone' data-acao='es-nav' data-d='-1' aria-label='Mês anterior'>‹</button>" +
      "<strong>" + capitalizar(MESES[E.mes]) + " de " + E.ano + "</strong>" +
      "<button class='icone' data-acao='es-nav' data-d='1' aria-label='Próximo mês'>›</button></div>" +
      "<p class='ses-total'>" + tmHumano(rm.total) + " estudados no mês · média de " + tmHumano(rm.media) + " por dia útil</p>" +
      "<div class='calendario'>" + grade + "</div></div>";

    if (E.view && E.view.tipo === "aula") {
      const a = E.aulas.find(x => x.id === E.view.id);
      if (a) return calendario + htmlInfoAula(a) + (E.form && E.form.kind === "aula" ? htmlFormEstudos() : "");
    }
    if (E.view && E.view.tipo === "prova") {
      const p = E.provas.find(x => x.id === E.view.id);
      if (p) return calendario + htmlInfoProva(p) + (E.form && E.form.kind === "prova" ? htmlFormEstudos() : "");
    }

    const aulas = E.aulas.filter(a => a.dataISO === E.dia).sort((a, b) => PERIODOS.findIndex(p => p[0] === a.periodo) - PERIODOS.findIndex(p => p[0] === b.periodo));
    const provas = E.provas.filter(p => p.dataISO === E.dia);
    const linhaAula = a => "<div class='es-linha es-info'><i class='es-marca' style='background:" + corMateria(a.materiaId) + "'></i>" +
      "<span class='es-texto'><strong>" + esc(a.conteudo) + "</strong>" +
      "<small>" + esc(nomeMateria(a.materiaId)) + " · " + nomePeriodo(a.periodo) + (a.professor ? " · Prof. " + esc(a.professor) : "") + "</small>" +
      (a.obs ? "<small>" + esc(a.obs) + "</small>" : "") +
      "<div class='es-chips'>" + htmlEstudoInicialChips(a) + "</div></span>" +
      "<button class='excluir' data-acao='es-edit-aula' data-id='" + a.id + "' aria-label='Ver e editar'>✎</button>" +
      "<button class='excluir' data-acao='es-aula-del' data-id='" + a.id + "' aria-label='Excluir'>×</button></div>";
    const linhaProva = p => {
      const nomes = conteudosDaProva(p).map(id => { const x = E.aulas.find(y => y.id === id); return x ? x.conteudo : null; }).filter(Boolean);
      return "<div class='es-linha es-info es-info-prova'><b class='es-prova-marca'>⚑</b><span class='es-texto'><strong>" + esc(p.nome) + "</strong>" +
        "<small>" + esc(nomeMateria(p.materiaId)) + " · " + esc(p.tipo || "Prova") + (p.horario ? " · " + esc(p.horario) : "") + "</small>" +
        "<small>" + (nomes.length ? nomes.length + " conteúdos cobrados" : "Sem conteúdos selecionados") + "</small></span>" +
        "<button class='excluir' data-acao='es-edit-prova' data-id='" + p.id + "' aria-label='Ver e editar'>✎</button>" +
        "<button class='excluir' data-acao='es-prova-del' data-id='" + p.id + "' aria-label='Excluir'>×</button></div>";
    };
    return calendario +
      "<div class='bloco'><h3>" + tituloDia(E.dia) + "</h3>" +
      (aulas.map(linhaAula).join("") + provas.map(linhaProva).join("") || "<p class='vazio'>Nada previsto para este dia.</p>") +
      "<div class='es-acoes'><button class='secundario' data-acao='es-add-aula'>+ Conteúdo</button><button class='secundario' data-acao='es-add-prova'>+ Prova</button></div></div>" +
      (E.form ? htmlFormEstudos() : "");
  }

  function htmlMaterias() {
    if (!E.materias.length) return "<div class='bloco'><p class='vazio'>Cadastre as matérias na aba Semestre.</p></div>";
    return E.materias.map(m => {
      const aulas = E.aulas.filter(a => a.materiaId === m.id).sort((a, b) => a.dataISO.localeCompare(b.dataISO));
      const provas = E.provas.filter(p => p.materiaId === m.id).sort((a, b) => a.dataISO.localeCompare(b.dataISO));
      return "<div class='bloco'><div class='habitos-topo'><h3><span class='swatch' style='background:" + m.cor + "'></span> " + esc(m.nome) + "</h3>" +
        "<small class='vazio'>" + aulas.length + " conteúdos · " + provas.length + " provas</small></div>" +
        "<p class='es-sub'>Provas</p>" +
        (provas.map(p => "<div class='es-linha'><b class='es-prova-marca'>⚑</b><span class='es-texto'><strong>" + esc(p.nome) + "</strong> <small>" + dataCurta(p.dataISO) + " · " + esc(p.tipo || "") + (p.horario ? " · " + esc(p.horario) : "") + "</small></span></div>").join("") || "<p class='vazio'>Nenhuma prova.</p>") +
        "<p class='es-sub'>Conteúdos</p>" +
        (aulas.map(a => "<div class='es-linha'><span class='es-texto'><strong>" + esc(a.conteudo) + "</strong> <small>" + dataCurta(a.dataISO) + " · " + nomePeriodo(a.periodo) + (a.professor ? " · " + esc(a.professor) : "") + "</small></span></div>").join("") || "<p class='vazio'>Nenhum conteúdo.</p>") +
        "</div>";
    }).join("");
  }

  function htmlListaProvas() {
    const lista = E.provas.slice().sort((a, b) => a.dataISO.localeCompare(b.dataISO));
    return "<div class='bloco'><div class='habitos-topo'><h3>Provas</h3><button class='add-bordo-sm' data-acao='es-add-prova' aria-label='Nova prova'>⚑</button></div>" +
      (lista.map(p => {
        const nomes = conteudosDaProva(p).map(id => { const a = E.aulas.find(x => x.id === id); return a ? a.conteudo : null; }).filter(Boolean);
        return "<div class='es-bloco-prova'><div class='es-linha'><b class='es-prova-marca'>⚑</b><span class='es-texto'><strong>" + esc(p.nome) + "</strong> · " + esc(nomeMateria(p.materiaId)) +
          " <small>" + dataCurta(p.dataISO) + (p.horario ? " · " + esc(p.horario) : "") + " · " + (p.abrangencia === "cumulativa" ? "cumulativa até " + dataCurta(p.ateData || p.dataISO) : "conteúdo específico") + "</small></span>" +
          "<button class='excluir' data-acao='es-edit-prova' data-id='" + p.id + "' aria-label='Editar'>✎</button>" +
          "<button class='excluir' data-acao='es-prova-del' data-id='" + p.id + "' aria-label='Excluir'>×</button></div>" +
          "<small class='vazio' style='text-align:left'>" + (nomes.length ? nomes.map(esc).join(" · ") : "Sem conteúdos selecionados") + "</small>" +
          (p.textos && p.textos.length ? "<small style='display:block'>Outros: " + p.textos.map(esc).join(" · ") + "</small>" : "") + "</div>";
      }).join("") || "<p class='vazio'>Nenhuma prova cadastrada.</p>") + "</div>";
  }

  function htmlFormEstudos() {
    const f = E.form;
    const mats = E.materias.map(m => "<option value='" + m.id + "'" + (f.materiaId === m.id ? " selected" : "") + ">" + esc(m.nome) + "</option>").join("");
    if (f.kind === "aula") {
      return "<div class='ag-form'><h3>" + (f.id ? "Editar aula" : "Nova aula") + "</h3>" +
        "<label>Matéria</label><select data-campo='ef-materia'><option value=''>Escolha</option>" + mats + "</select>" +
        "<input placeholder='Conteúdo ou tema da aula' data-campo='ef-conteudo' value='" + esc(f.conteudo) + "'>" +
        "<div class='ag-linha'><input type='date' data-campo='ef-data' value='" + f.dataISO + "'>" +
        "<select data-campo='ef-periodo'>" + PERIODOS.map(([v, n]) => "<option value='" + v + "'" + (f.periodo === v ? " selected" : "") + ">" + n + "</option>").join("") + "</select></div>" +
        "<input placeholder='Professor (opcional)' data-campo='ef-prof' value='" + esc(f.professor) + "'>" +
        "<input placeholder='Observações (opcional)' data-campo='ef-obs' value='" + esc(f.obs) + "'>" +
        "<div class='centro'><button class='secundario' data-acao='es-cancelar'>Cancelar</button><button class='grande' data-acao='es-salvar-form'>Salvar</button></div></div>";
    }
    const aulasMat = E.aulas.filter(a => a.materiaId === f.materiaId).sort((a, b) => a.dataISO.localeCompare(b.dataISO));
    const cumul = f.abrangencia === "cumulativa";
    const autoIds = cumul ? aulasMat.filter(a => a.dataISO <= (f.ateData || f.dataISO) && a.dataISO >= (f.deData || "0000-00-00")).map(a => a.id) : [];
    const listaAulas = cumul
      ? aulasMat.filter(a => autoIds.includes(a.id)).map(a => "<label class='es-check'><input type='checkbox' data-acao='es-prova-excl' data-id='" + a.id + "' " + (f.excluidos.includes(a.id) ? "" : "checked") + "> " + dataCurta(a.dataISO) + " · " + esc(a.conteudo) + "</label>").join("")
      : aulasMat.map(a => "<label class='es-check'><input type='checkbox' data-acao='es-prova-aula' data-id='" + a.id + "' " + (f.aulaIds.includes(a.id) ? "checked" : "") + "> " + dataCurta(a.dataISO) + " · " + esc(a.conteudo) + "</label>").join("");
    return "<div class='ag-form'><h3>" + (f.id ? "Editar prova" : "Nova prova") + "</h3>" +
      "<input placeholder='Nome da prova' data-campo='ef-nome' value='" + esc(f.nome) + "'>" +
      "<label>Matéria</label><select data-campo='ef-materia'><option value=''>Escolha</option>" + mats + "</select>" +

      (cumul ? "<label>Cobra de / até</label><div class='ag-linha'><input type='date' data-campo='ef-de' value='" + (f.deData || "") + "'><input type='date' data-campo='ef-ate' value='" + (f.ateData || "") + "'></div><label>Conteúdos (desmarque os que não entram)</label>" : "<label>Conteúdos cobrados</label>") +
      (f.materiaId ? "<div class='es-lista-checks'>" + (listaAulas || "<p class='vazio'>Nenhuma aula desta matéria cadastrada.</p>") + "</div>" : "<p class='vazio'>Escolha a matéria para ver as aulas.</p>") +
      "<label>Conteúdos fora do cronograma</label>" + (f.textos || []).map((t, i) => "<div class='tipo-chip'>" + esc(t) + "<button data-acao='es-texto-del' data-i='" + i + "'>×</button></div>").join("") +
      "<div class='ag-linha'><input placeholder='Adicionar conteúdo manual' data-campo='ef-texto' value='" + esc(f.textoNovo || "") + "'><button class='secundario' data-acao='es-texto-add'>Adicionar</button></div>" +
