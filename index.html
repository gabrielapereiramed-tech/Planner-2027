  async function tratarCliqueEstudos(e) {
    try {
      const el = e.target.closest("[data-acao]");
      if (!el) return;
      const a = el.dataset.acao;
      const f = E.form;
      if (a === "es-tab") { E.tab = el.dataset.v; renderEstudos(); }
      else if (a === "es-nav") { const m = E.mes + Number(el.dataset.d); E.ano += Math.floor(m / 12); E.mes = ((m % 12) + 12) % 12; renderEstudos(); }
      else if (a === "es-dia-cal") { E.dia = el.dataset.iso; E.view = null; E.form = null; renderEstudos(); }
      else if (a === "es-voltar") { E.view = null; E.form = null; renderEstudos(); }
      else if (a === "es-teste-usar") {
        const v = E.testeTmp || "";
        if (!v) { mostrarErro("Escolha uma data de teste."); return; }
        await colecao("estudosConfig").doc("teste").set({ dataISO: v });
        E.dataTeste = v; RV.revDia = null;
        renderEstudos(); renderRevHoje();
      }
      else if (a === "es-teste-sair") {
        await colecao("estudosConfig").doc("teste").delete();
        E.dataTeste = null; E.testeTmp = ""; RV.revDia = null;
        renderEstudos(); renderRevHoje();
      }
      else if (a === "es-alterar") { const x = E.aulas.find(y => y.id === el.dataset.id); if (x) { E.form = formAulaDe(x); renderEstudos(); } }
      else if (a === "es-alterar-prova") { const p = E.provas.find(y => y.id === el.dataset.id); if (p) { E.form = formProvaDe(p); renderEstudos(); } }
      else if (a === "es-dia") { const c = el.dataset.campo, i = Number(el.dataset.i); E.sem[c] = (E.sem[c] || []).includes(i) ? E.sem[c].filter(x => x !== i) : (E.sem[c] || []).concat([i]); renderEstudos(); }
      else if (a === "es-periodo") { const v = el.dataset.v; const l = E.sem.periodos || []; E.sem.periodos = l.includes(v) ? l.filter(x => x !== v) : l.concat([v]); renderEstudos(); }
      else if (a === "es-salvar-sem") { await colecao("estudosConfig").doc("semestre").set(E.sem); mostrarAviso("Semestre salvo."); }
      else if (a === "es-mat-add") {
        const nome = (E.novaMat.nome || "").trim();
        if (!nome) { mostrarErro("Dê um nome à matéria."); return; }
        const obj = { nome: nome, cor: E.novaMat.cor };
        const ref = await colecao("materias").add(obj);
        E.materias.push({ id: ref.id, ...obj });
        E.novaMat = { nome: "", cor: "#770523" };
        renderEstudos();
      }
      else if (a === "es-mat-del") {
        if (!(await confirmar("Excluir esta matéria? As revisões dela também serão removidas."))) return;
        const idsRev = RV.lista.filter(r => r.materiaId === el.dataset.id).map(r => r.id);
        await Promise.all(idsRev.map(id => colecao("revisoes").doc(id).delete()));
        RV.lista = RV.lista.filter(r => r.materiaId !== el.dataset.id);
        await colecao("materias").doc(el.dataset.id).delete();
        E.materias = E.materias.filter(m => m.id !== el.dataset.id);
        renderEstudos();
      }
      else if (a === "es-add-aula") { E.form = { kind: "aula", id: null, materiaId: "", conteudo: "", dataISO: E.dia, periodo: "manha", professor: "", obs: "" }; renderEstudos(); }
      else if (a === "es-edit-aula") { E.view = { tipo: "aula", id: el.dataset.id }; E.form = null; renderEstudos(); }
      else if (a === "es-aula-del") {
        if (!(await confirmar("Excluir esta aula?"))) return;
        await colecao("aulas").doc(el.dataset.id).delete();
        const idsAula = RV.lista.filter(r => r.aulaId === el.dataset.id).map(r => r.id);
        await Promise.all(idsAula.map(x => colecao("revisoes").doc(x).delete()));
        RV.lista = RV.lista.filter(r => r.aulaId !== el.dataset.id);
        E.aulas = E.aulas.filter(x => x.id !== el.dataset.id);
        E.view = null; E.form = null;
        renderEstudos();
      }
      else if (a === "es-add-prova") { E.form = { kind: "prova", id: null, nome: "", materiaId: "", dataISO: E.dia, horario: "", tipo: "Prova", abrangencia: "especifica", ateData: "", aulaIds: [], excluidos: [], textos: [], textoNovo: "", obs: "" }; renderEstudos(); }
      else if (a === "es-edit-prova") { E.view = { tipo: "prova", id: el.dataset.id }; E.form = null; renderEstudos(); }
      else if (a === "es-prova-del") {
        if (!(await confirmar("Excluir esta prova?"))) return;
        await colecao("provas").doc(el.dataset.id).delete();
        const idsProva = RV.lista.filter(r => r.provaId === el.dataset.id).map(r => r.id);
        await Promise.all(idsProva.map(x => colecao("revisoes").doc(x).delete()));
        RV.lista = RV.lista.filter(r => r.provaId !== el.dataset.id);
        E.provas = E.provas.filter(x => x.id !== el.dataset.id);
        E.view = null; E.form = null;
        renderEstudos();
      }
      else if (a === "es-prova-aula" && f) { const id = el.dataset.id; f.aulaIds = f.aulaIds.includes(id) ? f.aulaIds.filter(x => x !== id) : f.aulaIds.concat([id]); }
      else if (a === "es-prova-excl" && f) { const id = el.dataset.id; f.excluidos = f.excluidos.includes(id) ? f.excluidos.filter(x => x !== id) : f.excluidos.concat([id]); }
      else if (a === "es-texto-add" && f) { const t = (f.textoNovo || "").trim(); if (t) { f.textos.push(t); f.textoNovo = ""; renderEstudos(); } }
      else if (a === "es-texto-del" && f) { f.textos.splice(Number(el.dataset.i), 1); renderEstudos(); }
      else if (a === "es-cancelar") { E.form = null; renderEstudos(); }
      else if (a === "rev-nav") { RV.revDia = addDiasISO(RV.revDia || hojeEstudo(), Number(el.dataset.d)); renderEstudos(); }
      else if (a === "rev-feito") await revFeito(el.dataset.id);
      else if (a === "pos-decidir") await decidirPosProva(el.dataset.prova, el.dataset.aula, el.dataset.v, RV.revDia);
      else if (a === "rev-nao") await revNao(el.dataset.id);
      else if (a === "ei-feito") await marcarEstudoInicial(el.dataset.id, "feito");
      else if (a === "ei-nao") await marcarEstudoInicial(el.dataset.id, "nao");
      else if (a === "ei-desfazer") await marcarEstudoInicial(el.dataset.id, null);
      else if (a === "es-salvar-form") await salvarFormEstudos();
    } catch (err) { mostrarErro(err.message); }
  }

  function tratarEntradaEstudos(e) {
    const d = e.target.dataset;
    const c = d.campo;
    if (!c) return;
    const mudaForm = e.type === "change";
    if (c === "es-inicio") { E.sem.inicio = e.target.value; return; }
    if (c === "es-fim") { E.sem.fim = e.target.value; return; }
    if (c === "es-teste-data") { E.testeTmp = e.target.value; return; }
    if (c === "es-mat-nome") { E.novaMat.nome = e.target.value; return; }
    if (c === "es-mat-cor") { E.novaMat.cor = e.target.value; return; }
    if (c === "es-mat-hex") { const v = e.target.value.trim(); if (/^#[0-9a-fA-F]{6}$/.test(v)) { E.novaMat.cor = v.toLowerCase(); const l = e.target.closest(".cor-linha"); if (l) l.querySelectorAll("input").forEach(x => { if (x !== e.target) x.value = E.novaMat.cor; }); } return; }
    const f = E.form;
    if (!f) return;
    if (c === "ef-materia") { f.materiaId = e.target.value; if (mudaForm) renderEstudos(); return; }
    if (c === "ef-abr") { f.abrangencia = e.target.value; if (mudaForm) renderEstudos(); return; }
    if (c === "ef-ate") { f.ateData = e.target.value; if (mudaForm) renderEstudos(); return; }
    if (c === "ef-de") { f.deData = e.target.value; if (mudaForm) renderEstudos(); return; }
    if (c === "ef-nome") f.nome = e.target.value;
    else if (c === "ef-conteudo") f.conteudo = e.target.value;
    else if (c === "ef-data") f.dataISO = e.target.value;
    else if (c === "ef-periodo") f.periodo = e.target.value;
    else if (c === "ef-prof") f.professor = e.target.value;
    else if (c === "ef-horario") f.horario = e.target.value;
    else if (c === "ef-tipo") f.tipo = e.target.value;
    else if (c === "ef-obs") f.obs = e.target.value;
    else if (c === "ef-texto") f.textoNovo = e.target.value;
  }

  async function salvarFormEstudos() {
    const f = E.form;
    try {
      if (f.kind === "aula") {
        if (!f.materiaId) { mostrarErro("Escolha a matéria."); return; }
        if (!f.conteudo.trim()) { mostrarErro("Escreva o conteúdo da aula."); return; }
        if (!f.dataISO) { mostrarErro("Escolha a data."); return; }
        const obj = { materiaId: f.materiaId, conteudo: f.conteudo.trim(), dataISO: f.dataISO, periodo: f.periodo, professor: (f.professor || "").trim() || null, obs: (f.obs || "").trim() || null };
        if (f.id) { await colecao("aulas").doc(f.id).update(obj); const i = E.aulas.findIndex(x => x.id === f.id); if (i >= 0) E.aulas[i] = { id: f.id, ...obj }; }
        else { const ref = await colecao("aulas").add(obj); E.aulas.push({ id: ref.id, ...obj }); }
      } else {
        if (!f.nome.trim()) { mostrarErro("Dê um nome à prova."); return; }
        if (!f.materiaId) { mostrarErro("Escolha a matéria."); return; }
        if (!f.dataISO) { mostrarErro("Escolha a data."); return; }
        if (f.abrangencia === "cumulativa" && !f.ateData) { f.ateData = f.dataISO; }
        const obj = { nome: f.nome.trim(), materiaId: f.materiaId, dataISO: f.dataISO, horario: (f.horario || "").trim() || null, tipo: f.tipo, abrangencia: f.abrangencia, ateData: f.abrangencia === "cumulativa" ? f.ateData : null, deData: f.abrangencia === "cumulativa" ? (f.deData || null) : null, aulaIds: f.abrangencia === "especifica" ? f.aulaIds : [], excluidos: f.abrangencia === "cumulativa" ? f.excluidos : [], textos: f.textos || [], obs: (f.obs || "").trim() || null };
        if (f.id) { await colecao("provas").doc(f.id).update(obj); const i = E.provas.findIndex(x => x.id === f.id); if (i >= 0) E.provas[i] = { id: f.id, ...obj }; }
        else { const ref = await colecao("provas").add(obj); E.provas.push({ id: ref.id, ...obj }); }
      }
      E.form = null;
      renderEstudos();
    } catch (err) { mostrarErro(err.message); }
  }

  // ---------- Estudos: revisões espaçadas (fase 2) ----------
  const RV = { revDia: null, lista: [], pos: [] };
  const REV_TIPOS = {
    D1: { nome: "Revisão D+1", dias: 1, min: 10, metodo: "Feche o material e escreva ou fale tudo o que lembrar. Depois, confira e corrija as lacunas." },
    D3: { nome: "Revisão D+3", dias: 3, min: 15, metodo: "Responda flashcards e explique os conceitos sem consultar. Consulte o material só depois da tentativa." },
    D7: { nome: "Revisão D+7", dias: 7, min: 25, metodo: "Resolva questões e casos clínicos, e analise cada erro." },
    D14: { nome: "Revisão D+14", dias: 14, min: 20, metodo: "Explique sem consultar, faça mapas mentais e revise as questões que errou." },
    D30: { nome: "Revisão D+30", dias: 30, min: 25, metodo: "Faça um teste de conhecimento e recupere o conteúdo de forma global." },
    P14: { nome: "Pré-prova · faltam 14 dias", dias: 14, min: 20, metodo: "Revisão geral dos conteúdos da prova e identificação das lacunas." },
    P7: { nome: "Pré-prova · faltam 7 dias", dias: 7, min: 25, metodo: "Revisão geral com questões e recuperação ativa." },
    P3: { nome: "Pré-prova · faltam 3 dias", dias: 3, min: 30, metodo: "Reforce o que ainda não está consolidado: erros e pontos mais difíceis." },
    P1: { nome: "Pré-prova · falta 1 dia", dias: 1, min: 15, metodo: "Revisão leve: flashcards e conceitos essenciais, sem sessão exaustiva." }
  };
  const PRE_DIAS = [14, 7, 3, 1];

  // Pré-prova só faz sentido antes da prova e enquanto o conteúdo não foi marcado como "não preciso mais".
  function revPreAtiva(r, dia) {
    const p = E.provas.find(x => x.id === r.provaId);
    if (!p) return false;
    return dia < p.dataISO;
  }

  function preRevisaoValida(r) {
    const p = E.provas.find(x => x.id === r.provaId);
    return !!p && r.dataPrevista < p.dataISO;
  }

  // "Não preciso mais" (pós-prova) vale para as revisões de dia a dia desse conteúdo.
  function naoPrecisaMais(aulaId) {
    return RV.pos.some(x => x.aulaId === aulaId && x.decisao === "nao");
  }

  function addDiasISO(iso, n) {
    const [y, m, d] = iso.split("-").map(Number);
    return isoDe(new Date(y, m - 1, d + n));
  }

  // Cria as revisões de cada estudo inicial válido. Ids únicos (aula + tipo), para não duplicar ao recalcular.
  function dataEstudoDe(a) { return a.dataEstudo || a.reestudoEm || a.dataISO; }

  // Data usada pelas revisões: a data de teste, se estiver ligada, ou a data de hoje.
  function hojeEstudo() { return E.dataTeste || hojeISO(); }

  // Revisões só existem depois de um estudo inicial feito. D0 é o dia em que o estudo foi feito.
  // Revisões D+ só existem depois de um estudo inicial feito. D0 é o dia em que o estudo foi feito.
  // Revisões pré-prova existem para cada conteúdo cobrado, 14, 7, 3 e 1 dia antes da prova.
  async function gerarRevisoes() {
    const ops = [];
    const tiposD = Object.keys(REV_TIPOS).filter(t => t.startsWith("D"));
    const removerPendentes = aulaId => {
      RV.lista.filter(r => r.aulaId === aulaId && !r.provaId && r.status === "pendente").forEach(r => ops.push(colecao("revisoes").doc(r.id).delete()));
      RV.lista = RV.lista.filter(r => !(r.aulaId === aulaId && !r.provaId && r.status === "pendente"));
    };
    E.aulas.forEach(a => {
      const materiaExiste = E.materias.some(m => m.id === a.materiaId);
      if (!materiaExiste || a.estudoInicial !== "feito" || naoPrecisaMais(a.id)) { removerPendentes(a.id); return; }
      const base = a.dataEstudo || a.dataISO;
      tiposD.forEach(t => {
        const id = a.id + "_" + t;
        const existente = RV.lista.find(r => r.id === id);
        if (existente) {
          if (existente.status === "pendente" && existente.dataBase !== base) {
            const novaData = addDiasISO(base, REV_TIPOS[t].dias);
            existente.dataBase = base;
            existente.dataPrevista = novaData;
            ops.push(colecao("revisoes").doc(id).update({ dataBase: base, dataPrevista: novaData }));
          }
          return;
        }
        const obj = { aulaId: a.id, materiaId: a.materiaId, tipo: t, dataBase: base, dataPrevista: addDiasISO(base, REV_TIPOS[t].dias), status: "pendente", reprog: 0 };
        ops.push(colecao("revisoes").doc(id).set(obj).then(() => { RV.lista.push({ id: id, ...obj }); }));
      });
    });

    // Remove revisões de conteúdos que não existem mais (ex.: excluídos antes da correção)
    const idsAulas = E.aulas.map(a => a.id);
    RV.lista.filter(r => !idsAulas.includes(r.aulaId)).forEach(r => ops.push(colecao("revisoes").doc(r.id).delete()));
    RV.lista = RV.lista.filter(r => idsAulas.includes(r.aulaId));

    RV.lista.filter(r => r.provaId && r.status === "pendente" && !preRevisaoValida(r)).forEach(r => ops.push(colecao("revisoes").doc(r.id).delete()));
    RV.lista = RV.lista.filter(r => !(r.provaId && r.status === "pendente" && !preRevisaoValida(r)));

    // Remove revisões pré-prova de provas que já foram excluídas
    const idsProvas = E.provas.map(p => p.id);
    RV.lista.filter(r => r.provaId && !idsProvas.includes(r.provaId) && r.status === "pendente").forEach(r => ops.push(colecao("revisoes").doc(r.id).delete()));
    RV.lista = RV.lista.filter(r => !(r.provaId && !idsProvas.includes(r.provaId) && r.status === "pendente"));

    E.provas.forEach(p => {
      conteudosDaProva(p).forEach(aulaId => {
        const aula = E.aulas.find(x => x.id === aulaId);
        if (!aula) return;
        PRE_DIAS.forEach(d => {
          const t = "P" + d;
          const id = "pre_" + p.id + "_" + aulaId + "_" + d;
          const existente = RV.lista.find(r => r.id === id);
          const dataPrevista = addDiasISO(p.dataISO, -d);
          if (existente) {
            if (existente.status === "pendente" && existente.dataBase !== p.dataISO) {
              existente.dataBase = p.dataISO;
              existente.dataPrevista = dataPrevista;
              ops.push(colecao("revisoes").doc(id).update({ dataBase: p.dataISO, dataPrevista: dataPrevista }));
            }
            return;
          }
          const obj = { aulaId: aulaId, materiaId: aula.materiaId, provaId: p.id, provaNome: p.nome, tipo: t, dataBase: p.dataISO, dataPrevista: dataPrevista, status: "pendente", reprog: 0 };
          ops.push(colecao("revisoes").doc(id).set(obj).then(() => { RV.lista.push({ id: id, ...obj }); }));
        });
      });
    });

    try { await Promise.all(ops); } catch (e) { mostrarErro(e.message); }
  }

  function htmlRevisoes() {
    if (!RV.revDia) RV.revDia = hojeEstudo();
    const dia = RV.revDia;
    const hoje = hojeEstudo();
    const doDia = RV.lista.filter(r => (r.status === "pendente" ? (r.dataPrevista === dia || (dia === hoje && r.dataPrevista < hoje)) : ((r.dataFeito || r.dataPrevista) === dia)) && (!r.provaId || revPreAtiva(r, dia)));
    const doDiaNormal = doDia.filter(r => !r.provaId);
    const doDiaPre = doDia.filter(r => !!r.provaId);
    const pend = doDia.filter(r => r.status === "pendente");
    const feitas = doDia.filter(r => r.status === "feito").length;
    const atrasadas = pend.filter(r => r.dataPrevista < dia).length;
    const minutos = pend.reduce((a, r) => a + REV_TIPOS[r.tipo].min, 0);
    const aulasDia = E.aulas.filter(a => dataEstudoDe(a) === dia);
    const nomeAula = id => { const a = E.aulas.find(x => x.id === id); return a ? a.conteudo : "Conteúdo removido"; };

    const estudo = aulasDia.map(a =>
      "<div class='es-linha es-info'><i class='es-marca' style='background:" + corMateria(a.materiaId) + "'></i>" +
      "<span class='es-texto'><strong>" + esc(a.conteudo) + "</strong><small>" + esc(nomeMateria(a.materiaId)) + " · Estudo inicial desta aula</small>" +
      "<div class='es-chips'>" + htmlEstudoInicialChips(a) + "</div></span></div>").join("");

    const grupos = [...new Set(doDiaNormal.map(r => r.materiaId))].map(mid => {
      const itens = doDiaNormal.filter(r => r.materiaId === mid);
      const cor = corMateria(mid);
      const feitasM = itens.filter(r => r.status === "feito").length;
      const minM = itens.filter(r => r.status === "pendente").reduce((a, r) => a + REV_TIPOS[r.tipo].min, 0);
      return "<div class='rev-bloco'><div class='rev-topo' style='background:" + cor + "26;border-left:4px solid " + cor + "'>" +
        "<strong>Revisões · " + esc(nomeMateria(mid)) + "</strong><small>" + feitasM + " de " + itens.length + " feitas · " + minM + " min restantes</small></div>" +
        itens.map(r => {
          const feito = r.status === "feito";
          return "<div class='rev-item" + (feito ? " rev-feito" : "") + "'><div class='rev-texto'><strong>" + esc(nomeAula(r.aulaId)) + "</strong>" +
            "<small>" + REV_TIPOS[r.tipo].nome + (r.provaNome ? " · " + esc(r.provaNome) : "") + " · " + REV_TIPOS[r.tipo].min + " min" + (!feito && r.dataPrevista < hoje ? " · <b class='rev-atrasada'>atrasada</b>" : "") + "</small>" +
            "<small class='rev-metodo'>" + REV_TIPOS[r.tipo].metodo + "</small></div>" +
            "<div class='es-chips'><button class='chip-acao" + (feito ? " ok" : "") + "' data-acao='rev-feito' data-id='" + r.id + "'>" + (feito ? "Feito ✓" : "Feito") + "</button>" +
            "<button class='chip-acao" + (!feito && r.reprog ? "" : "") + "' data-acao='rev-nao' data-id='" + r.id + "'>Não consegui</button></div></div>";
        }).join("") +
        "</div>";
    }).join("");

    const posHtml = E.provas.filter(p => dia >= p.dataISO).map(p => {
      const linhas = conteudosDaProva(p).map(id => {
        const a = E.aulas.find(x => x.id === id);
        if (!a) return "";
        const decObj = RV.pos.find(x => x.id === p.id + "_" + a.id) || {};
        const dec = decObj.decisao;
        // Depois de responder, o conteúdo some no dia seguinte; no dia em que respondeu, continua visível.
        if (dec && decObj.dataISO !== dia) return "";
        return "<div class='es-linha es-info'><span class='es-texto'><strong>" + esc(a.conteudo) + "</strong><small>" + esc(nomeMateria(a.materiaId)) + "</small></span><div class='es-chips'>" +
          "<button class='chip-acao" + (dec === "sim" ? " ok" : "") + "' data-acao='pos-decidir' data-prova='" + p.id + "' data-aula='" + a.id + "' data-v='sim'>Continuar revisando</button>" +
          "<button class='chip-acao" + (dec === "nao" ? " ruim" : "") + "' data-acao='pos-decidir' data-prova='" + p.id + "' data-aula='" + a.id + "' data-v='nao'>Não preciso mais</button></div></div>";
      }).join("");
      if (!linhas) return "";
      return "<div class='bloco'><h3>Pós-prova · " + esc(p.nome) + "</h3><p class='vazio' style='text-align:left'>Esse conteúdo ainda precisa de revisão? Responda para cada um.</p>" + linhas + "</div>";
    }).join("");

    const provasPreHtml = [...new Set(doDiaPre.map(r => r.provaId))].map(pid => {
      const prova = E.provas.find(p => p.id === pid);
      if (!prova) return "";
      const itens = doDiaPre.filter(r => r.provaId === pid);
      const feitasP = itens.filter(r => r.status === "feito").length;
      let faltam = 0, cur = dia;
      while (cur < prova.dataISO && faltam < 366) { cur = addDiasISO(cur, 1); faltam++; }
      return "<div class='rev-bloco rev-pre'><div class='rev-topo rev-topo-pre'>" +
        "<strong><b class='es-prova-marca'>⚑</b> Pré-prova · " + esc(prova.nome) + "</strong>" +
        "<small>" + esc(nomeMateria(prova.materiaId)) + " · prova em " + dataCurta(prova.dataISO) + " · faltam " + faltam + (faltam === 1 ? " dia" : " dias") + " · " + feitasP + " de " + itens.length + " feitas</small></div>" +
        itens.map(r => {
          const feito = r.status === "feito";
          return "<div class='rev-item" + (feito ? " rev-feito" : "") + "'><div class='rev-texto'><strong>" + esc(nomeAula(r.aulaId)) + "</strong>" +
            "<small>" + REV_TIPOS[r.tipo].nome + " · " + REV_TIPOS[r.tipo].min + " min</small>" +
            "<small class='rev-metodo'>" + REV_TIPOS[r.tipo].metodo + "</small></div>" +
            "<div class='es-chips'><button class='chip-acao" + (feito ? " ok" : "") + "' data-acao='rev-feito' data-id='" + r.id + "'>" + (feito ? "Feito ✓" : "Feito") + "</button>" +
            "<button class='chip-acao' data-acao='rev-nao' data-id='" + r.id + "'>Não consegui</button></div></div>";
        }).join("") + "</div>";
    }).join("");

    return htmlResumoSemana(dia) + "<div class='rev-topo'><div class='bloco'><h3>Temporizador de estudo</h3><div class='tm-box'>" + htmlTmInner() + "</div></div>" + htmlSessoesDia(dia) + "</div>" +
      "<div class='rev-esq'><div class='bloco'><div class='nav'>" +
      "<button class='icone' data-acao='rev-nav' data-d='-1' aria-label='Dia anterior'>‹</button>" +
      "<strong>" + (dia === hoje ? "Hoje · " : "") + tituloDia(dia) + "</strong>" +
      "<button class='icone' data-acao='rev-nav' data-d='1' aria-label='Próximo dia'>›</button></div>" +
      "<div class='rev-resumo'><div><strong>" + feitas + " de " + doDia.length + "</strong><small>feitas</small></div>" +
      "<div><strong>" + minutos + " min</strong><small>restantes</small></div>" +
      "<div><strong class='" + (atrasadas ? "rev-atrasada" : "") + "'>" + atrasadas + "</strong><small>atrasadas</small></div></div></div>" +
      posHtml +
      (estudo ? "<div class='bloco'><h3>Estudo inicial das aulas</h3>" + estudo + "</div>" : "") +
      provasPreHtml + (grupos || (provasPreHtml ? "" : "<div class='bloco'><p class='vazio'>Nenhuma revisão para este dia.</p></div>")) +
      "</div></div>";
  }

  // Marca, troca ou desmarca a resposta pós-prova. A escolha fica no dia em que foi feita (não no dia de hoje).
  async function decidirPosProva(provaId, aulaId, v, diaVisto) {
    const dia = diaVisto || hojeEstudo();
    const id = provaId + "_" + aulaId;
    const atual = RV.pos.find(x => x.id === id);
    if (atual && atual.decisao === v) {
      await colecao("posProva").doc(id).delete();
      RV.pos = RV.pos.filter(x => x.id !== id);
    } else {
      const obj = { provaId: provaId, aulaId: aulaId, decisao: v, dataISO: dia };
      await colecao("posProva").doc(id).set(obj);
      RV.pos = RV.pos.filter(x => x.id !== id).concat([{ id: id, ...obj }]);
    }
    // Recalcula as revisões: "não preciso mais" remove as de dia a dia pendentes, e desmarcar devolve.
    await gerarRevisoes();
    renderEstudos();
    renderRevHoje();
  }


  async function revFeito(id) {
    const r = RV.lista.find(x => x.id === id);
    if (!r) return;
    if (r.status === "feito") {
      r.status = "pendente";
      r.dataFeito = null;
      await colecao("revisoes").doc(id).update({ status: "pendente", dataFeito: null });
    } else {
      r.status = "feito";
      r.dataFeito = hojeEstudo();
      await colecao("revisoes").doc(id).update({ status: "feito", dataFeito: r.dataFeito });
    }
    renderEstudos();
    renderRevHoje();
  }

  // "Não consegui": não é esquecimento. A revisão vai para o próximo dia, sem acumular no mesmo dia.
  async function revNao(id) {
    const r = RV.lista.find(x => x.id === id);
    if (!r) return;
    const base = r.dataPrevista < hojeEstudo() ? hojeEstudo() : r.dataPrevista;
    r.dataPrevista = addDiasISO(base, 1);
    r.reprog = (r.reprog || 0) + 1;
    await colecao("revisoes").doc(id).update({ dataPrevista: r.dataPrevista, reprog: r.reprog });
    renderEstudos();
  }

  async function marcarEstudoInicial(aulaId, valor) {
    const a = E.aulas.find(x => x.id === aulaId);
    if (!a) return;
    const agendado = dataEstudoDe(a);
    if (valor === "feito") {
      a.estudoInicial = "feito";
      a.dataEstudo = agendado;
      a.reestudoEm = null;
    } else if (valor === "nao") {
      const base = agendado < hojeEstudo() ? hojeEstudo() : agendado;
      a.estudoInicial = null;
      a.dataEstudo = null;
      a.reestudoEm = addDiasISO(base, 1);
    } else {
      a.estudoInicial = null;
      a.dataEstudo = null;
      a.reestudoEm = null;
    }
    await colecao("aulas").doc(aulaId).update({ estudoInicial: a.estudoInicial, dataEstudo: a.dataEstudo, reestudoEm: a.reestudoEm });
    await gerarRevisoes();
    renderEstudos();
    renderRevHoje();
  }

  // ---------- It's Crochet (antiga aba Trabalho) ----------
  const CR = { aba: "encomendas", produtos: [], clientes: [], encomendas: [], form: null, cliSel: null, encSel: null, busca: "" };

  async function carregarCrochet() {
    try {
      const [p, c, e] = await Promise.all([colecao("crochetProdutos").get(), colecao("crochetClientes").get(), colecao("crochetEncomendas").get()]);
      CR.produtos = p.docs.map(d => ({ id: d.id, ...d.data() }));
      CR.clientes = c.docs.map(d => ({ id: d.id, ...d.data() }));
      CR.encomendas = e.docs.map(d => ({ id: d.id, ...d.data() }));
    } catch (err) { mostrarErro(err.message); }
  }

  const crFmt = v => "R$ " + Number(v || 0).toFixed(2).replace(".", ",");
  const crNum = v => Number(String(v || "0").replace(",", ".")) || 0;
  const crProduto = id => CR.produtos.find(x => x.id === id);
  const crCliente = id => CR.clientes.find(x => x.id === id);

  function renderCrochet() {
    const el = document.getElementById("crochet");
    if (!el) return;
    const abas = [["encomendas", "Encomendas"], ["produtos", "Produtos"], ["clientes", "Clientes"]].map(([v, n]) =>
      "<button class='aba" + (CR.aba === v ? " ativo" : "") + "' data-acao='cr-aba' data-v='" + v + "'>" + n + "</button>").join("");
    const acaoAdd = CR.aba === "clientes" ? "cr-novo-cli" : (CR.aba === "produtos" ? "cr-novo-prod" : "cr-novo-enc");
    el.innerHTML = "<h2>It's Crochet</h2><div class='cr-linha-abas'><div class='abas'>" + abas + "</div>" +
      "<button class='add-bordo-sm cr-add' data-acao='" + acaoAdd + "' aria-label='Adicionar'>+</button></div>" +
      "<input class='cr-busca' placeholder='Buscar por código, nome, número ou cidade' data-campo='cr-busca' value='" + esc(CR.busca || "") + "'>" +
      (CR.aba === "clientes" ? htmlCrClientes() : (CR.aba === "produtos" ? htmlCrProdutosTab() : htmlCrEncomendas()));
  }

  function crItens(e) {
    if (Array.isArray(e.itens) && e.itens.length) return e.itens;
    return e.produtoId ? [{ produtoId: e.produtoId, qtd: Number(e.qtd) || 1 }] : [];
  }
  function crNomeItens(e) {
    const its = crItens(e);
    if (!its.length) return e.descricao || "Encomenda";
    return its.map(i => { const p = crProduto(i.produtoId); return (p ? p.nome : "Produto removido") + (i.qtd > 1 ? " × " + i.qtd : ""); }).join(" + ");
  }
  function crValorItens(itens) { return itens.reduce((a, i) => { const p = crProduto(i.produtoId); return a + (p ? (Number(p.preco) || 0) * (Number(i.qtd) || 1) : 0); }, 0); }
  function crCustoItens(itens) { return itens.reduce((a, i) => { const p = crProduto(i.produtoId); return a + (p ? (Number(p.custo) || 0) * (Number(i.qtd) || 1) : 0); }, 0); }
  function formDeEncomenda(e) {
    return { kind: "encomenda", id: e.id, itens: crItens(e).map(i => ({ produtoId: i.produtoId, qtd: i.qtd })), clienteId: e.clienteId || "", dataEntrega: e.dataEntrega || hojeISO(),
      frete: !!e.frete, valorFrete: e.valorFrete || "", endereco: e.endereco || "", extras: (e.extras || []).map(x => ({ nome: x.nome, valor: x.valor })),
      custo: e.custo != null ? e.custo : "", sinalPago: !!e.sinalPago, valorSinal: e.valorSinal || "", obs: e.obs || "" };
  }

  function crDiasAte(iso) {
    const [y, m, d] = String(iso).split("-").map(Number);
    const [hy, hm, hd] = hojeEstudo().split("-").map(Number);
    return Math.round((new Date(y, m - 1, d) - new Date(hy, hm - 1, hd)) / 86400000);
  }

  function crCustoTotal(e) { return crNum(e.custo) + (e.extras || []).reduce((a, x) => a + crNum(x.valor), 0); }
  function crPago(e) { return e.paga ? crNum(e.valor) : (e.sinalPago ? crNum(e.valorSinal) : 0); }

  function htmlCrEncomendas() {
    const numOf = e => (e.numero ? "#" + String(e.numero).padStart(3, "0") + " · " : "");
    const andamento = CR.encomendas.filter(e => !e.entregue && crBuscaOk(crTextoEnc(e))).sort((a, b) => {
      if (!a.dataEntrega && !b.dataEntrega) return 0;
      if (!a.dataEntrega) return 1;
      if (!b.dataEntrega) return -1;
      return String(a.dataEntrega).localeCompare(String(b.dataEntrega));
    });
    const finalizados = CR.encomendas.filter(e => e.entregue && crBuscaOk(crTextoEnc(e))).sort((a, b) => String(b.dataEntrega || "").localeCompare(String(a.dataEntrega || "")));
    const lucro = CR.encomendas.reduce((a, e) => a + (crNum(e.valor) - crCustoTotal(e)), 0);
    const aReceber = CR.encomendas.reduce((a, e) => a + (crNum(e.valor) - crPago(e)), 0);
    const proxima = andamento.find(e => e.dataEntrega);
    const txtProxima = () => {
      if (!proxima) return "—";
      const d = crDiasAte(proxima.dataEntrega);
      const quando = d === 0 ? "hoje" : (d < 0 ? "atrasada" : "faltam " + d + (d === 1 ? " dia" : " dias"));
      return numOf(proxima) + esc(crNomeItens(proxima)) + " · " + quando;
    };
    const linha = e => {
      const cli = crCliente(e.clienteId);
      const pagar = crNum(e.valor) - crPago(e);
      const tags = (e.paga ? "<span class='cr-tag pago'>Total pago " + crFmt(e.valor) + "</span>" : "") +
        (!e.paga && e.sinalPago ? "<span class='cr-tag sinal'>Sinal pago " + crFmt(e.valorSinal) + "</span>" : "") +
        (!e.paga && pagar > 0 ? "<span class='cr-tag pagar'>A pagar " + crFmt(pagar) + "</span>" : "");
      return "<div class='es-linha es-info'><span class='es-texto'>" + tags +
        "<strong>" + numOf(e) + esc(crNomeItens(e)) + "</strong>" +
        "<small>" + (cli ? esc(cli.nome) : "") + (e.dataEntrega ? " · entrega " + dataCurta(e.dataEntrega) : "") + (e.frete ? " · com frete" : "") + "</small>" +
        "<small>valor " + crFmt(e.valor) + " · custo " + crFmt(crCustoTotal(e)) + " · lucro " + crFmt(crNum(e.valor) - crCustoTotal(e)) + "</small>" +
        "<div class='es-chips'><button class='chip-acao" + (e.entregue ? " ok" : "") + "' data-acao='cr-entregue' data-id='" + e.id + "'>" + (e.entregue ? "Entregue ✓" : "Entregue") + "</button>" +
        "<button class='chip-acao" + (e.paga ? " ok" : "") + "' data-acao='cr-paga' data-id='" + e.id + "'>" + (e.paga ? "Paga ✓" : "Paga") + "</button></div></span>" +
        "<button class='excluir' data-acao='cr-enc-edit' data-id='" + e.id + "' aria-label='Editar encomenda'>✎</button>" +
        "<button class='excluir' data-acao='cr-del-enc' data-id='" + e.id + "' aria-label='Excluir encomenda'>×</button></div>";
    };
    const f = CR.form && CR.form.kind === "encomenda" ? CR.form : null;
    return "<div class='fin-cards'>" +
      "<div class='fin-card'><small>Lucro das encomendas</small><strong>" + crFmt(lucro) + "</strong></div>" +
      "<div class='fin-card'><small>A receber</small><strong>" + crFmt(aReceber) + "</strong></div>" +
      "<div class='fin-card'><small>Em andamento</small><strong>" + andamento.length + "</strong></div>" +
      "<div class='fin-card'><small>Próxima entrega</small><strong>" + txtProxima() + "</strong></div></div>" +
      (f ? formCrEncomenda(f) : "") +
      "<div class='bloco'><h3>Em andamento</h3>" + (andamento.map(linha).join("") || "<p class='vazio'>Nenhuma encomenda em andamento.</p>") + "</div>" +
      "<div class='bloco'><h3>Finalizados</h3>" + (finalizados.map(linha).join("") || "<p class='vazio'>Nenhuma encomenda finalizada ainda.</p>") + "</div>";
  }

  function formCrEncomenda(f) {
    const valor = crValorItens(f.itens) + (f.frete ? crNum(f.valorFrete) : 0);
    const itensHtml = f.itens.map((it, i) =>
      "<div class='ag-linha'><select data-campo='cr-item-prod' data-i='" + i + "'><option value=''>Escolha o produto</option>" +
        CR.produtos.map(p => "<option value='" + p.id + "'" + (it.produtoId === p.id ? " selected" : "") + ">" + esc(p.nome) + (p.codigo ? " (" + esc(p.codigo) + ")" : "") + "</option>").join("") + "</select>" +
      "<input type='number' inputmode='numeric' placeholder='Qtd' data-campo='cr-item-qtd' data-i='" + i + "' value='" + it.qtd + "'>" +
      "<button class='excluir' data-acao='cr-item-del' data-i='" + i + "' aria-label='Remover produto'>×</button></div>").join("");
    const extras = (f.extras || []).map((x, i) =>
      "<div class='ag-linha'><input placeholder='Ex.: embalagem' data-campo='cr-extra-nome' data-i='" + i + "' value='" + esc(x.nome) + "'>" +
      "<input type='number' inputmode='decimal' step='0.01' placeholder='Valor' data-campo='cr-extra-valor' data-i='" + i + "' value='" + x.valor + "'>" +
      "<button class='excluir' data-acao='cr-extra-del' data-i='" + i + "' aria-label='Remover'>×</button></div>").join("");
    return "<div class='ag-form'><h3>" + (f.id ? "Editar encomenda" : "Nova encomenda") + "</h3>" +
      "<label>Produtos</label>" + itensHtml +
      "<div class='centro'><button class='secundario' data-acao='cr-item-add'>+ Produto</button></div>" +
      "<label>Cliente</label><select data-campo='cr-cliente'><option value=''>Sem cliente</option>" +
        CR.clientes.map(c => "<option value='" + c.id + "'" + (f.clienteId === c.id ? " selected" : "") + ">" + esc(c.nome) + "</option>").join("") + "</select>" +
      "<label>Data de entrega</label><input type='date' data-campo='cr-data' value='" + f.dataEntrega + "'>" +
      "<label style='display:flex;gap:6px;align-items:center'><input type='checkbox' data-campo='cr-frete' style='width:auto;margin:0' " + (f.frete ? "checked" : "") + "> Tem frete</label>" +
      (f.frete ? "<div class='ag-linha'><input type='number' inputmode='decimal' step='0.01' placeholder='Valor do frete' data-campo='cr-valor-frete' value='" + f.valorFrete + "'>" +
        "<input placeholder='Endereço' data-campo='cr-endereco' value='" + esc(f.endereco) + "'></div>" : "") +
      "<label>Custos extras (embalagens, deslocamento...)</label>" + extras +
      "<div class='centro'><button class='secundario' data-acao='cr-extra-add'>+ Custo extra</button></div>" +
      "<label>Custo de produção (pode ser alterado)</label><input type='number' inputmode='decimal' step='0.01' data-campo='cr-custo' value='" + f.custo + "'>" +
      "<label style='display:flex;gap:6px;align-items:center'><input type='checkbox' data-campo='cr-sinal' style='width:auto;margin:0' " + (f.sinalPago ? "checked" : "") + "> Sinal pago</label>" +
      (f.sinalPago ? "<input type='number' inputmode='decimal' step='0.01' placeholder='Valor do sinal' data-campo='cr-valor-sinal' value='" + f.valorSinal + "'>" : "") +
      "<p class='vazio' style='text-align:left'>Valor da encomenda (automático): <strong>" + crFmt(valor) + "</strong></p>" +
      "<input placeholder='Observações (opcional)' data-campo='cr-obs' value='" + esc(f.obs) + "'>" +
      "<div class='centro'><button class='secundario' data-acao='cr-cancelar'>Cancelar</button><button class='grande' data-acao='cr-salvar'>Salvar</button></div></div>";
  }

  function formCrProduto(f) {
    return "<div class='ag-form'><h3>" + (f.id ? "Editar produto" : "Novo produto") + "</h3>" +
      "<input placeholder='Nome do produto' data-campo='cr-prod-nome' value='" + esc(f.nome) + "'>" +
      "<div class='ag-linha'><input type='number' inputmode='decimal' step='0.01' placeholder='Valor' data-campo='cr-prod-preco' value='" + f.preco + "'>" +
      "<input type='number' inputmode='decimal' step='0.01' placeholder='Custo para produzir' data-campo='cr-prod-custo' value='" + f.custo + "'></div>" +
      "<div class='ag-linha'><input type='number' inputmode='numeric' placeholder='Tempo (minutos)' data-campo='cr-prod-tempo' value='" + f.tempo + "'>" +
      "<input placeholder='Código: gerado automaticamente' value='" + esc(gerarCodigoProduto(f.nome)) + "' disabled></div>" +
      "<input placeholder='Itens para produzir (separe por vírgula)' data-campo='cr-prod-itens' value='" + esc(f.itens) + "'>" +
      "<div class='centro'><button class='secundario' data-acao='cr-cancelar'>Cancelar</button><button class='grande' data-acao='cr-salvar'>Salvar</button></div></div>";
  }

  // Código automático: duas letras do nome + número sequencial (ex.: AM001).
  function gerarCodigoProduto(nome) {
    const letras = String(nome || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z]/g, "").toUpperCase().slice(0, 2).padEnd(2, "X");
    const usados = CR.produtos.filter(p => String(p.codigo || "").startsWith(letras)).map(p => Number(String(p.codigo).slice(2)) || 0);
    const prox = (usados.length ? Math.max(...usados) : 0) + 1;
    return letras + String(prox).padStart(3, "0");
  }

  function htmlCrProdutosTab() {
    const f = CR.form && CR.form.kind === "produto" ? CR.form : null;
