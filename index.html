<body>
<div class="wrap">
  <div id="conteudo"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
  function mostrarErro(msg) {
    let b = document.getElementById("erro-banner");
    if (!b) {
      b = document.createElement("div");
      b.id = "erro-banner";
      b.style.cssText = "position:fixed;left:8px;right:8px;bottom:8px;background:#D81A67;color:#fff;padding:8px 12px;border-radius:10px;font-size:12px;z-index:99;";
      b.onclick = () => b.remove();
      document.body.appendChild(b);
    }
    b.textContent = "Erro: " + msg + " (toque para fechar)";
  }
  window.addEventListener("error", e => mostrarErro(e.message));
  window.addEventListener("unhandledrejection", e => mostrarErro(e.reason && e.reason.message ? e.reason.message : String(e.reason)));

  const firebaseConfig = {
    apiKey: "AIzaSyCThzs67EiYA7EFZTcmyrzQf0zlrf-Pwus",
    authDomain: "planner-2026-2cf70.firebaseapp.com",
    projectId: "planner-2026-2cf70",
    storageBucket: "planner-2026-2cf70.firebasestorage.app",
    messagingSenderId: "69295479170",
    appId: "1:69295479170:web:d356cff56f3e1e74f8d79b"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  const conteudo = document.getElementById("conteudo");
  const telaGrande = window.matchMedia("(min-width: 720px)");

  // ---------- ícones ----------
  const svg = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  const ICONES = {
    estrela: svg('<path d="M12 2 C12.8 8.5 15.5 11.2 22 12 C15.5 12.8 12.8 15.5 12 22 C11.2 15.5 8.5 12.8 2 12 C8.5 11.2 11.2 8.5 12 2 Z"/>'),
    coracao: svg('<path d="M12 21 C12 21 4 15.5 4 9.5 C4 6.5 6.2 4.5 8.5 4.5 C10 4.5 11.3 5.3 12 6.5 C12.7 5.3 14 4.5 15.5 4.5 C17.8 4.5 20 6.5 20 9.5 C20 15.5 12 21 12 21 Z"/>'),
    livro: svg('<path d="M4 5 C7 4 10 4.5 12 6 C14 4.5 17 4 20 5 V19 C17 18 14 18.5 12 20 C10 18.5 7 18 4 19 Z"/><path d="M12 6 V20"/>'),
    halter: svg('<path d="M6 7 V17 M18 7 V17 M3 9 V15 M21 9 V15 M6 12 H18"/>'),
    dinheiro: svg('<circle cx="12" cy="12" r="9"/><path d="M14.5 9.5 C14 8.5 13 8 12 8 C10.5 8 9.5 8.8 9.5 10 C9.5 13.5 14.5 11.5 14.5 15 C14.5 16.2 13.5 17 12 17 C10.8 17 9.8 16.5 9.3 15.5 M12 6.5 V8 M12 16 V17.5"/>'),
    notebook: svg('<rect x="4" y="5" width="16" height="11" rx="2"/><path d="M2 19 H22"/>'),
    alvo: svg('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/>'),
    lapis: svg('<path d="M4 20 L8.5 19 L19 8.5 L15.5 5 L5 15.5 Z"/><path d="M13.5 7 L17 10.5"/>')
  };
  const ICONE_CHECK = svg('<path d="M5 12 L10 17 L19 7"/>');

  ICONES.grade = svg('<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>');

  ICONES.lixeira = svg('<path d="M4 7 H20 M9 7 V4 H15 V7 M6 7 L7 20 H17 L18 7"/>');

  ICONES.sino = svg('<path d="M6 16 V11 a6 6 0 0 1 12 0 V16 L19.5 18 H4.5 Z"/><path d="M10 20.5 a2 2 0 0 0 4 0"/>');

  const SECOES = [
    { id: "geral", nome: "Geral", icone: ICONES.grade },
    { id: "bora", nome: "Meu Dia", icone: ICONES.estrela },
    { id: "pessoal", nome: "Habit Tracker", icone: ICONES.coracao },
    { id: "estudos", nome: "Estudos", icone: ICONES.livro },
    { id: "treinos", nome: "Treinos", icone: ICONES.halter },
    { id: "financeiro", nome: "Financeiro", icone: ICONES.dinheiro },
    { id: "trabalho", nome: "Trabalho", icone: ICONES.notebook }
  ];

  // ---------- estado ----------
  let usuario = null;
  let secaoAtual = null;
  let pararEscuta = null;
  let wakeLock = null;

  const T = {
    aba: "geral", hist: "mes", offsetSemana: 0, offsetMes: 0, offsetAno: 0,
    selecionado: null, centralizar: true,
    treinos: [], sessoes: [], ultimas: {}, trocas: {}, metas: {},
    treinoHoje: null, sessao: null, feitos: {}, cargas: {}, series: {}, numSeries: {}, descanso: null,
    trocando: false, registrando: false, descricao: "",
    editorTipo: null, editor: null, metaRascunho: {}
  };

  // ---------- datas ----------
  const NOMES = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
  const NOMES_LONGOS = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];
  const MESES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
  const pad = n => String(n).padStart(2, "0");
  const isoDe = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const dePara = iso => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); };
  const somar = (iso, n) => { const d = dePara(iso); d.setDate(d.getDate() + n); return isoDe(d); };
  const hojeISO = () => isoDe(new Date());
  const diaSemana = iso => dePara(iso).getDay();
  const inicioSemana = iso => somar(iso, -((diaSemana(iso) + 6) % 7));
  const tituloDia = iso => NOMES_LONGOS[diaSemana(iso)] + ", " + dePara(iso).getDate() + " de " + MESES[dePara(iso).getMonth()];
  const dataCurta = iso => dePara(iso).getDate() + "/" + pad(dePara(iso).getMonth() + 1);
  const capitalizar = t => t.replace(/^./, c => c.toUpperCase());

  // ---------- utilitários ----------
  function esc(t) {
    return String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function slug(t) {
    return String(t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  }
  function formatar(seg) {
    seg = Math.max(0, Math.floor(seg));
    return pad(Math.floor(seg / 60)) + ":" + pad(seg % 60);
  }
  function colecao(nome) {
    return db.collection("users").doc(usuario.uid).collection(nome);
  }
  function vibrar() {
    if (navigator.vibrate) navigator.vibrate([400, 200, 400, 200, 400]);
  }
  async function manterTela() {
    try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) { wakeLock = null; }
  }
  function soltarTela() {
    if (wakeLock) { wakeLock.release(); wakeLock = null; }
  }

  // ---------- consultas ----------
  function treinoDoDia(iso) {
    if (T.trocas[iso]) return T.treinos.find(t => t.id === T.trocas[iso]) || null;
    return T.treinos.find(t => (t.diasSugeridos || []).includes(diaSemana(iso))) || null;
  }
  const sessoesDoDia = iso => T.sessoes.filter(s => s.dataISO === iso);
  const contarEntre = (ini, fim) => T.sessoes.filter(s => s.dataISO >= ini && s.dataISO <= fim).length;

  async function carregarTudo() {
    try {
      const [tr, ul, ss, tc, ms] = await Promise.all([
        colecao("treinos").get(),
        colecao("ultimas").get(),
        colecao("sessoes").get(),
        colecao("trocas").get(),
        colecao("config").doc("metas").get()
      ]);
      T.treinos = tr.docs.map(d => {
        const dados = d.data();
        const dias = Array.isArray(dados.diasSugeridos) ? dados.diasSugeridos.map(Number)
          : (dados.diaSugerido !== null && dados.diaSugerido !== undefined ? [Number(dados.diaSugerido)] : []);
        return { id: d.id, ...dados, diasSugeridos: dias, exercicios: (dados.exercicios || []).map(ex => ({ ...ex, tipo: "total" })) };
      });
      T.ultimas = {};
      ul.forEach(d => { T.ultimas[d.id] = d.data(); });
      T.sessoes = ss.docs.map(d => ({ id: d.id, ...d.data() }));
      T.trocas = {};
      tc.forEach(d => { T.trocas[d.id] = d.data().treinoId; });
      T.metas = ms.exists ? ms.data() : {};
    } catch (e) {
      const st = document.getElementById("treino-status");
      if (st) st.textContent = "Erro ao carregar: " + e.message;
    }
  }

  // ---------- login ----------
  function mostrarFormulario() {
    document.body.style.background = "#FBF8EC";
    if (pararEscuta) { pararEscuta(); pararEscuta = null; }
    usuario = null;
    conteudo.innerHTML =
      "<div class='painel-login'>" +
        "<div class='ilustra'><img src='ilustracao.png' alt='Ilustração'></div>" +
        "<div class='formulario'>" +
          "<h1>Oiê!</h1>" +
          "<p class='sub'>Vamos planejar hoje, um passo de cada vez. O resto a gente acrescenta depois.</p>" +
          "<input id='email' type='email' placeholder='E-mail' autocomplete='username'>" +
          "<input id='senha' type='password' placeholder='Senha' autocomplete='current-password'>" +
          "<button id='entrar'>Entrar</button>" +
          "<div id='status'></div>" +
        "</div>" +
      "</div>";

    document.getElementById("entrar").onclick = async () => {
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value;
      document.getElementById("status").textContent = "Entrando...";
      try {
        await auth.signInWithEmailAndPassword(email, senha);
      } catch (e) {
        document.getElementById("status").textContent = "Não foi possível entrar: " + e.message;
      }
    };
  }

  async function mostrarApp(user) {
    usuario = user;
    document.body.style.background = "#FFFFFF";
    conteudo.innerHTML = "<div class='app' id='app'><nav class='menu' id='menu'></nav><main class='conteudo' id='main'></main></div>";
    secaoAtual = "geral";
    T.selecionado = hojeISO();
    T.centralizar = true;
    desenharMenu();
    desenharMain();
    await carregarTudo();
    if (secaoAtual === "treinos") renderTreinos();
  }

  function irPara(id) {
    if (id === "bora") {
      if (MD.vindoDaAgenda) MD.vindoDaAgenda = false;
      else MD.dia = hojeISO();
    }
    secaoAtual = id;
    desenharMenu();
    desenharMain();
  }

  function desenharMenu() {
    const app = document.getElementById("app");
    const menu = document.getElementById("menu");
    app.className = "app";
    menu.innerHTML =
      "<div class='menu-topo'>Planner 2027</div>" +
      SECOES.map(s =>
        "<button class='item" + (s.id === secaoAtual ? " ativo" : "") + "' data-id='" + s.id + "'>" +
          s.icone + "<span>" + s.nome + "</span>" +
        "</button>"
      ).join("") +
      "<button class='item sair' id='sair'>Sair</button>";
    menu.querySelectorAll("button[data-id]").forEach(b => b.onclick = () => irPara(b.dataset.id));
    document.getElementById("sair").onclick = () => { soltarTela(); auth.signOut(); };
  }

  function desenharMain() {
    if (pararEscuta) { pararEscuta(); pararEscuta = null; }
    const main = document.getElementById("main");
    const secao = SECOES.find(s => s.id === secaoAtual);
    if (!secao) { main.innerHTML = ""; return; }

    const voltar = "<button class='voltar' id='voltar'>← Voltar</button>";
    if (secao.id === "geral") {
      main.innerHTML = voltar + "<h2>Geral</h2><div id='geral'></div>";
      const g = document.getElementById("geral");
      g.onclick = tratarCliqueGeral;
      g.oninput = tratarEntradaGeral;
      g.onchange = tratarEntradaGeral;
      G.offset = 0;
      G.formAberto = false;
      renderGeral();
      carregarCompromissos().then(() => renderGeral());
    } else if (secao.id === "bora") {
      main.innerHTML = voltar + "<h2>Meu Dia</h2><div id='meu-dia'></div>";
      const md = document.getElementById("meu-dia");
      md.onclick = tratarCliqueGeral;
      md.oninput = tratarEntradaGeral;
      md.onchange = tratarEntradaGeral;
      renderMeuDia();
      Promise.all([carregarNaoEsquecer(), carregarCaixa()]).then(() => renderMeuDia());
    } else if (secao.id === "nao") {
      main.innerHTML = voltar + "<h2>Não esquecer</h2><div id='nao'></div>";
      const el = document.getElementById("nao");
      el.onclick = tratarCliqueSecoes;
      el.oninput = tratarEntradaSecoes;
      el.onchange = tratarEntradaSecoes;
      renderNaoEsquecer();
      carregarNaoEsquecer().then(renderNaoEsquecer);
    } else if (secao.id === "caixa") {
      main.innerHTML = voltar + "<h2>Caixa do dia</h2><div id='caixa'></div>";
      const el = document.getElementById("caixa");
      el.onclick = tratarCliqueSecoes;
      el.oninput = tratarEntradaSecoes;
      el.onchange = tratarEntradaSecoes;
      CX.dia = hojeISO();
      renderCaixa();
      carregarCaixa().then(renderCaixa);
    } else if (secao.id === "treinos") {
      main.innerHTML = voltar + "<div id='treinos'></div>";
      const el = document.getElementById("treinos");
      el.onclick = tratarClique;
      el.oninput = tratarEntrada;
      el.onchange = tratarEntrada;
      T.centralizar = true;
      renderTreinos();
      carregarTudo().then(() => renderTreinos());
    } else {
      main.innerHTML = voltar + "<h2>" + secao.nome + "</h2><p class='sub'>Em breve.</p>";
    }
    const b = document.getElementById("voltar");
    if (b) b.onclick = () => irPara(null);
  }

  function ligarTeste() {
    const itens = colecao("itens");

    async function adicionar() {
      const campo = document.getElementById("novo");
      const texto = campo.value.trim();
      if (!texto) return;
      campo.value = "";
      try {
        await itens.add({ texto: texto, criadoEm: firebase.firestore.FieldValue.serverTimestamp() });
      } catch (e) {
        document.getElementById("status").textContent = "Erro ao salvar: " + e.message;
      }
    }
    document.getElementById("adicionar").onclick = adicionar;
    document.getElementById("novo").addEventListener("keydown", e => { if (e.key === "Enter") adicionar(); });

    pararEscuta = itens.orderBy("criadoEm").onSnapshot(snap => {
      const ul = document.getElementById("lista");
      if (!ul) return;
      if (snap.empty) {
        ul.outerHTML = "<p class='vazio' id='lista'>Nenhum item ainda.</p>";
        return;
      }
      ul.innerHTML = snap.docs.map(doc =>
        "<li><span>" + esc(doc.data().texto) + "</span><button data-id='" + doc.id + "'>Excluir</button></li>"
      ).join("");
      ul.querySelectorAll("button[data-id]").forEach(b => {
        b.onclick = () => itens.doc(b.dataset.id).delete();
      });
    }, e => {
      const st = document.getElementById("status");
      if (st) st.textContent = "Erro ao carregar: " + e.message;
    });
  }

  // ---------- aba Geral (agenda semanal) e Meu Dia (agenda diária) ----------
  const G = { offset: 0, compromissos: [], legenda: [], formAberto: false, rascunho: null, novaLegenda: { nome: "", cor: "#D81A67" }, editandoLegenda: false, novaCorAberta: false };
  const MD = { dia: null, vindoDaAgenda: false };
  const LEGENDA_PADRAO = [
    { id: "rosa", nome: "Rosa", cor: "#FAD2E1" },
    { id: "bordo", nome: "Bordô", cor: "#770523" },
    { id: "verde", nome: "Verde", cor: "#D0D996" },
    { id: "fucsia", nome: "Fúcsia", cor: "#D81A67" }
  ];
  const INICIO_MIN = 270, FIM_MIN = 1440;

  function minutos(hhmm) {
    const [h, m] = hhmm.split(":").map(Number);
    return h * 60 + m;
  }
  function minutosFim(hhmm) {
    return hhmm === "00:00" ? 1440 : minutos(hhmm);
  }
  function corDoCompromisso(c) {
    if (typeof c.cor === "string" && c.cor.charAt(0) === "#") return c.cor;
    return (LEGENDA_PADRAO[Number(c.cor)] || LEGENDA_PADRAO[0]).cor;
  }
  function textoSobre(hex) {
    const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return (r * 299 + g * 587 + b * 114) / 1000 > 160 ? "#2B2420" : "#FFFFFF";
  }
  function pxParaTopo(el, reservado) {
    const topo = el.getBoundingClientRect().top;
    const disponivel = window.innerHeight - topo - reservado;
    return Math.max(24, Math.min(56, Math.floor(disponivel / ((FIM_MIN - INICIO_MIN) / 60))));
  }

  const H = { lista: [], dias: {}, novoNome: "", adicionando: false, novaCor: "#D81A67" };

  async function carregarCompromissos() {
    try {
      const [snap, leg, hab, habDia] = await Promise.all([
        colecao("compromissos").get(),
        colecao("legenda").get(),
        colecao("habitos").get(),
        colecao("habitosDia").get()
      ]);
      G.compromissos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if (leg.empty) {
        for (const p of LEGENDA_PADRAO) await colecao("legenda").doc(p.id).set({ nome: p.nome, cor: p.cor });
        G.legenda = LEGENDA_PADRAO.slice();
      } else {
        G.legenda = leg.docs.map(d => ({ id: d.id, ...d.data() }));
      }
      H.lista = hab.docs.map(d => ({ id: d.id, ...d.data() }));
      H.dias = {};
      habDia.forEach(d => { H.dias[d.id] = d.data().feitos || []; });
    } catch (e) {
      mostrarErro(e.message);
    }
  }

  function corDoCompromisso(c) {
    if (typeof c.cor === "string" && c.cor.charAt(0) === "#") return c.cor;
    return (LEGENDA_PADRAO[Number(c.cor)] || LEGENDA_PADRAO[0]).cor;
  }
  function textoSobre(hex) {
    const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    return (r * 299 + g * 587 + b * 114) / 1000 > 160 ? "#2B2420" : "#FFFFFF";
  }
  function pxParaTopo(el, reservado) {
    const topo = el.getBoundingClientRect().top;
    const disponivel = window.innerHeight - topo - reservado;
    return Math.max(24, Math.min(56, Math.floor(disponivel / ((FIM_MIN - INICIO_MIN) / 60))));
  }

  async function carregarCompromissos() {
    try {
      const [snap, leg] = await Promise.all([colecao("compromissos").get(), colecao("legenda").get()]);
      G.compromissos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if (leg.empty) {
        for (const p of LEGENDA_PADRAO) await colecao("legenda").doc(p.id).set({ nome: p.nome, cor: p.cor });
        G.legenda = LEGENDA_PADRAO.slice();
      } else {
        G.legenda = leg.docs.map(d => ({ id: d.id, ...d.data() }));
      }
    } catch (e) {
      mostrarErro(e.message);
    }
  }

  function gradeHoras(PX) {
    let h = "<div class='ag-horas' style='height:" + ((FIM_MIN - INICIO_MIN) / 60 * PX) + "px'>";
    for (let m = INICIO_MIN; m < FIM_MIN; m += 60) {
      const meia = m + 60 > FIM_MIN;
      h += "<div style='height:" + (meia ? PX / 2 : PX) + "px'>" + Math.floor(m / 60) + "h" + (m % 60 ? "30" : "00") + "</div>";
    }
    return h + "</div>";
  }

  function eventosHTML(evs, PX) {
    return evs.map(c => {
      const top = (minutos(c.inicio) - INICIO_MIN) * PX / 60;
      const alt = Math.max(24, (minutosFim(c.fim) - minutos(c.inicio)) * PX / 60);
      const cor = corDoCompromisso(c);
      return "<button class='ag-evento' data-acao='agenda-evento' data-id='" + c.id + "' style='top:" + top + "px;height:" + alt + "px;background:" + cor + ";color:" + textoSobre(cor) + "'>" +
        "<span>" + esc(c.titulo) + "</span><small>" + c.inicio + "–" + c.fim + "</small></button>";
    }).join("");
  }

  function renderAtual() {
    if (secaoAtual === "bora") renderMeuDia();
    else renderGeral();
  }

  function renderGeral() {
    const el = document.getElementById("geral");
    if (!el) return;
    const ini = inicioSemana(somar(hojeISO(), G.offset * 7));
    const dias = [0, 1, 2, 3, 4, 5, 6].map(k => somar(ini, k));
    const fim = somar(ini, 6);
    const hoje = hojeISO();
    const atual = G.offset === 0;
    const PX = pxParaTopo(el, 150);
    const altura = (FIM_MIN - INICIO_MIN) / 60 * PX;

    let h = "<div id='agenda'>" +
      "<div class='agenda-topo'><h3>Agenda semanal</h3><button class='icone' data-acao='agenda-novo' aria-label='Novo compromisso'>+</button></div>" +
      "<div class='nav'><button class='icone' data-acao='agenda-nav' data-d='-1' aria-label='Semana anterior'>‹</button>" +
        "<strong class='intervalo" + (atual ? " semana" : "") + "'>" + dataCurta(ini) + " a " + dataCurta(fim) + "</strong>" +
        "<button class='icone' data-acao='agenda-nav' data-d='1' aria-label='Próxima semana'>›</button></div>";
    if (G.formAberto && G.rascunho) h += htmlFormCompromisso(false);
    h += "<div class='agenda-grade'><div></div>";
    dias.forEach(d => {
      h += "<div class='ag-dia-cab" + (d === hoje ? " hoje" : "") + "' data-acao='agenda-dia' data-iso='" + d + "'><small>" + NOMES[diaSemana(d)] + "</small><b>" + dePara(d).getDate() + "</b></div>";
    });
    h += gradeHoras(PX);
    dias.forEach(d => {
      const evs = G.compromissos.filter(c => c.dataISO === d);
      h += "<div class='ag-coluna' style='height:" + altura + "px'>" + eventosHTML(evs, PX) + "</div>";
    });
    h += "</div></div>";
    el.innerHTML = h;
  }

  function linhasTarefas(n) {
    return n >= 2 ? Math.ceil(n / 2) : n;
  }

  function pxDoDia(evs, PX) {
    const base = evs.length ? PX : 28;
    let px = base;
    evs.forEach(c => {
      const dur = minutosFim(c.fim) - minutos(c.inicio);
      const necessario = 52 + linhasTarefas((c.tarefas || []).length) * 20;
      px = Math.max(px, Math.ceil(necessario * 60 / dur));
    });
    return px;
  }

  function renderMeuDia() {
    const el = document.getElementById("meu-dia");
    if (!el) return;
    if (!MD.dia) MD.dia = hojeISO();
    const PXbase = pxParaTopo(el, 170);
    const evs = G.compromissos.filter(c => c.dataISO === MD.dia);
    const PX = pxDoDia(evs, PXbase);
    const altura = (FIM_MIN - INICIO_MIN) / 60 * PX;

    let agenda = "<div class='nav'><button class='icone' data-acao='md-nav' data-d='-1' aria-label='Dia anterior'>‹</button>" +
      "<strong>" + tituloDia(MD.dia) + "</strong>" +
      "<button class='icone' data-acao='md-nav' data-d='1' aria-label='Próximo dia'>›</button></div>" +
      "<div class='agenda-topo'><span></span><button class='icone' data-acao='md-novo' aria-label='Novo compromisso'>+</button></div>";
    if (G.formAberto && G.rascunho) agenda += htmlFormCompromisso(true);
    agenda += "<div class='md-grade'>" + gradeHoras(PX) +
      "<div class='ag-coluna' style='height:" + altura + "px'>" + eventosMeuDia(evs, PX) + "</div></div>";

    const naoEsqueco = "<div class='bloco'><div class='habitos-topo'><h3>Não esquecer</h3><button class='btn-lapis' data-acao='ne-editar' aria-label='Editar lista'>" + ICONES.lapis + "</button></div><div id='nao'></div></div>";

    const habitos = "<div class='bloco md-habitos'>" +
      "<div class='habitos-topo'><h3>Hábitos de hoje</h3>" +
        "<button class='btn-lapis' data-acao='habito-editar' aria-label='Editar hábitos'>" + ICONES.lapis + "</button></div>" +
      (H.lista.length ? H.lista.map(hb => {
        const feito = (H.dias[MD.dia] || []).includes(hb.id);
        const cor = hb.cor || "#D81A67";
        return "<div class='habito'><button class='bolinha" + (feito ? " feita" : "") + "' data-acao='habito-marcar' data-id='" + hb.id + "' style='" +
          (feito ? "background:" + cor + ";border-color:" + cor + ";color:" + textoSobre(cor) : "border-color:" + cor) +
          "' aria-label='Marcar hábito'>" + (feito ? ICONE_CHECK : "") + "</button>" +
          "<span class='" + (feito ? "riscado" : "") + "'>" + esc(hb.nome) + "</span>" +
          (H.adicionando ? "<button class='excluir' data-acao='habito-del' data-id='" + hb.id + "' aria-label='Excluir hábito'>×</button>" : "") +
        "</div>";
      }).join("") : "<p class='vazio'>Nenhum hábito cadastrado ainda.</p>") +
      (H.adicionando ? htmlNovoHabito() : "") +
    "</div>";

    const caixa = "<div class='bloco'><h3>Caixa do dia</h3><div id='caixa'></div></div>";

    el.innerHTML = "<div class='md-layout'><div class='md-agenda'>" + agenda + "</div>" +
      "<div class='md-col'>" + naoEsqueco + habitos + caixa + "</div></div>";
    renderNaoEsquecer();
    renderCaixa();
  }

  function tintar(hex, p) {
    const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    const m = c => Math.round(c + (255 - c) * p).toString(16).padStart(2, "0");
    return "#" + m(r) + m(g) + m(b);
  }

  function corTextoLegivel(hex) {
    const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    const yiq = (r * 299 + g * 587 + b * 114) / 1000;
    if (yiq <= 160) return hex;
    const f = 0.45;
    const h2 = v => Math.round(v * f).toString(16).padStart(2, "0");
    return "#" + h2(r) + h2(g) + h2(b);
  }

  function eventosMeuDia(evs, PX) {
    return evs.map(c => {
      const top = (minutos(c.inicio) - INICIO_MIN) * PX / 60;
      const alt = (minutosFim(c.fim) - minutos(c.inicio)) * PX / 60;
      const cor = corDoCompromisso(c);
      const n = (c.tarefas || []).length;
      const linhas = linhasTarefas(n);
      const espaco = Math.max(0, alt - 52);
      const alvo = linhas > 0 ? espaco / linhas : 0;
      const fontePx = Math.max(9, Math.min(13, Math.floor((alvo - 4) / 1.8)));
      const bolinha = Math.min(22, Math.round(fontePx * 1.7));
      const curto = alt < 64;
      const tarefas = (c.tarefas || []).map((t, i) =>
        "<div class='tarefa-linha'><button class='bolinha" + (t.feita ? " feita" : "") + "' data-acao='tarefa-marcar' data-cid='" + c.id + "' data-i='" + i + "' style='" +
          "--b:" + bolinha + "px;" +
          (t.feita ? "background:" + cor + ";border-color:" + cor + ";color:" + textoSobre(cor) : "border-color:" + cor) +
          "' aria-label='Marcar tarefa'>" + (t.feita ? ICONE_CHECK : "") + "</button>" +
          "<span class='" + (t.feita ? "riscado" : "") + "'>" + esc(t.texto) + "</span></div>"
      ).join("");
      return "<div class='md-evento' data-acao='agenda-evento' data-id='" + c.id + "' style='top:" + top + "px;height:" + alt + "px;border-color:" + cor + ";background:" + tintar(cor, 0.85) + "'>" +
        "<div class='md-evento-topo" + (curto ? " curto" : "") + "'><strong style='color:" + corTextoLegivel(cor) + "'>" + esc(c.titulo) + "</strong><small>" + c.inicio + "–" + c.fim + "</small></div>" +
        "<div class='md-tarefas" + (n >= 2 ? " duas" : "") + "' style='font-size:" + fontePx + "px'>" + tarefas + "</div></div>";
    }).join("");
  }

  function htmlSeletorCor(campo, valor, i) {
    const idx = i === null || i === undefined ? "" : " data-i='" + i + "'";
    return "<div class='cor-linha'>" +
      "<input type='color' data-campo='" + campo + "-cor'" + idx + " value='" + valor + "' aria-label='Escolher cor'>" +
      "<input class='hex' data-campo='" + campo + "-hex'" + idx + " value='" + valor + "' maxlength='7' placeholder='#RRGGBB' aria-label='Código da cor'>" +
    "</div>";
  }

  function htmlNovoHabito() {
    const cores = G.legenda.length ? G.legenda : LEGENDA_PADRAO;
    return "<div class='novo-habito'>" +
      "<input placeholder='Novo hábito' data-campo='habito-nome' value='" + esc(H.novoNome) + "'>" +
      "<div class='legenda'>" + cores.map(l =>
        "<button class='legenda-item" + (H.novaCor === l.cor ? " ativo" : "") + "' data-acao='habito-cor' data-cor='" + l.cor + "' aria-label='" + esc(l.nome) + "'><span class='swatch' style='background:" + l.cor + "'></span></button>"
      ).join("") + "</div>" +
      htmlSeletorCor("habito", H.novaCor, null) +
      "<button class='secundario' data-acao='habito-add'>Adicionar hábito</button></div>";
  }

  function htmlTarefasDia(evs) {
    const comTarefas = evs.filter(c => (c.tarefas || []).length);
    if (!comTarefas.length) return "";
    return "<div class='bloco md-tarefas'><h3>Tarefas do dia</h3>" + comTarefas.map(c =>
      "<div class='tarefas-bloco'><small>" + esc(c.titulo) + "</small>" +
      c.tarefas.map((t, i) =>
        "<div class='tarefa-linha'><button class='bolinha" + (t.feita ? " feita" : "") + "' data-acao='tarefa-marcar' data-cid='" + c.id + "' data-i='" + i + "' aria-label='Marcar tarefa'>" + (t.feita ? ICONE_CHECK : "") + "</button>" +
        "<span class='" + (t.feita ? "riscado" : "") + "'>" + esc(t.texto) + "</span></div>"
      ).join("") + "</div>"
    ).join("") + "</div>";
  }

  function htmlFormCompromisso(comTarefas) {
    const r = G.rascunho;
    const nova = G.novaLegenda;
    const legenda = G.editandoLegenda
      ? G.legenda.map(l => "<div class='leg-edit'><span class='swatch' style='background:" + l.cor + "'></span>" +
          "<input data-campo='leg-renomear' data-id='" + l.id + "' value='" + esc(l.nome) + "'>" +
          "<button class='excluir' data-acao='leg-excluir' data-id='" + l.id + "' aria-label='Excluir cor'>×</button></div>").join("")
      : "<div class='legenda'>" + G.legenda.map(l =>
          "<button class='legenda-item" + (r.cor === l.cor ? " ativo" : "") + "' data-acao='ag-cor' data-cor='" + l.cor + "'>" +
          "<span class='swatch' style='background:" + l.cor + "'></span><small>" + esc(l.nome) + "</small></button>").join("") + "</div>";
    const tarefas = r.tarefas.map((t, i) =>
      "<div class='tarefa'><button class='bolinha' data-acao='tarefa-feita' data-i='" + i + "'>" + (t.feita ? ICONE_CHECK : "") + "</button>" +
      "<input data-campo='tarefa-texto' data-i='" + i + "' value='" + esc(t.texto) + "' placeholder='Tarefa'>" +
      "<button class='excluir' data-acao='tarefa-del' data-i='" + i + "' aria-label='Remover tarefa'>×</button></div>"
    ).join("");

    return "<div class='ag-form'>" +
      "<h3>" + (r.id ? "Editar compromisso" : "Novo compromisso") + "</h3>" +
      "<input placeholder='Título do compromisso' data-campo='ag-titulo' value='" + esc(r.titulo) + "'>" +
      "<div class='ag-linha'>" +
        "<input type='date' data-campo='ag-data' value='" + r.dataISO + "'>" +
        "<input type='time' data-campo='ag-inicio' value='" + r.inicio + "'>" +
        "<input type='time' data-campo='ag-fim' value='" + r.fim + "'>" +
      "</div>" +
      "<div class='legenda-cab'><label>Legenda de cores</label><div class='legenda-acoes'>" +
        "<button class='btn-lapis' data-acao='leg-nova' aria-label='Adicionar cor nova'>+</button>" +
        "<button class='btn-lapis' data-acao='leg-editar' aria-label='Editar legenda'>" + ICONES.lapis + "</button></div></div>" +
      legenda +
      htmlSeletorCor("ag", r.cor, null) +
      (G.novaCorAberta && !G.editandoLegenda ?
        "<div class='ag-linha nova-cor'><input placeholder='Nome da nova cor' data-campo='leg-nome' value='" + esc(nova.nome) + "'>" +
        "<button class='secundario' data-acao='leg-salvar'>Adicionar cor</button></div>" +
        htmlSeletorCor("nova", nova.cor, null) : "") +
      (comTarefas ? "<label>Tarefas</label>" + tarefas + "<button class='secundario' data-acao='tarefa-add'>+ Tarefa</button>" : "") +
      "<div id='ag-status' class='status'></div>" +
      "<div class='centro'>" +
        (r.id ? "<button class='excluir' data-acao='ag-excluir' data-id='" + r.id + "'>Excluir</button>" : "") +
        "<button class='secundario' data-acao='ag-cancelar'>Cancelar</button>" +
        "<button class='grande' data-acao='ag-salvar'>Salvar</button>" +
      "</div>" +
    "</div>";
  }

  function abrirFormNovo(dataISO) {
    G.formAberto = true;
    G.editandoLegenda = false;
    G.rascunho = { id: null, titulo: "", dataISO: dataISO, inicio: "08:00", fim: "09:00", cor: (G.legenda[0] || LEGENDA_PADRAO[0]).cor, tarefas: [] };
  }

  function abrirFormEdicao(id) {
    const c = G.compromissos.find(x => x.id === id);
    if (!c) return;
    G.formAberto = true;
    G.editandoLegenda = false;
    G.rascunho = {
      id: c.id, titulo: c.titulo, dataISO: c.dataISO, inicio: c.inicio, fim: c.fim, cor: corDoCompromisso(c),
      tarefas: (c.tarefas || []).map(t => ({ texto: t.texto, feita: !!t.feita, cor: t.cor || null }))
    };
  }

  async function tratarCliqueGeral(e) {
    try {
      const el = e.target.closest("[data-acao]");
      if (!el) return;
      const a = el.dataset.acao;
      const i = Number(el.dataset.i);
      const r = G.rascunho;

      if (a === "agenda-nav") { G.offset += Number(el.dataset.d); renderGeral(); }
      else if (a === "agenda-dia") { MD.dia = el.dataset.iso; MD.vindoDaAgenda = true; irPara("bora"); }
      else if (a === "agenda-novo") { abrirFormNovo(hojeISO()); renderGeral(); }
      else if (a === "agenda-evento") { abrirFormEdicao(el.dataset.id); renderAtual(); }
      else if (a === "md-nav") { MD.dia = somar(MD.dia || hojeISO(), Number(el.dataset.d)); renderMeuDia(); }
      else if (a === "md-novo") { abrirFormNovo(MD.dia || hojeISO()); renderMeuDia(); }
      else if (a === "ag-cancelar") { G.formAberto = false; G.rascunho = null; G.editandoLegenda = false; renderAtual(); }
      else if (a === "ag-cor") { r.cor = el.dataset.cor; renderAtual(); }
      else if (a === "ag-salvar") await salvarCompromisso();
      else if (a === "ag-excluir") await excluirCompromisso(el.dataset.id);
      else if (a === "leg-editar") { G.editandoLegenda = !G.editandoLegenda; renderAtual(); }
      else if (a === "leg-nova") { G.novaCorAberta = !G.novaCorAberta; renderAtual(); }
      else if (a === "leg-salvar") await salvarNovaCor();
      else if (a === "leg-excluir") await excluirCor(el.dataset.id);
      else if (a === "tarefa-add") { r.tarefas.push({ texto: "", feita: false }); renderAtual(); }
      else if (a === "tarefa-del") { r.tarefas.splice(i, 1); renderAtual(); }
      else if (a === "tarefa-feita") { r.tarefas[i].feita = !r.tarefas[i].feita; renderAtual(); }
      else if (a === "tarefa-marcar") await marcarTarefa(el.dataset.cid, i);
      else if (a === "habito-marcar") await marcarHabito(el.dataset.id);
      else if (a === "habito-add") await adicionarHabito();
      else if (a === "habito-editar") { H.adicionando = !H.adicionando; renderMeuDia(); }
      else if (a === "habito-cor") { H.novaCor = el.dataset.cor; renderMeuDia(); }
      else if (a === "ne-editar") { NE.adicionando = !NE.adicionando; renderNaoEsquecer(); }
      else if (a === "ne-add") await neAdicionar();
      else if (a === "ne-feito") await neAlternar(el.dataset.id);
      else if (a === "ne-del") await neExcluir(el.dataset.id);
      else if (a === "cx-nav") { CX.dia = somar(CX.dia || hojeISO(), Number(el.dataset.d)); renderCaixa(); }
      else if (a === "cx-tipo") { CX.tipo = el.dataset.tipo; renderCaixa(); }
      else if (a === "cx-add") await cxAdicionar();
      else if (a === "cx-del") await cxExcluir(el.dataset.id);
      else if (a === "habito-del") await excluirHabito(el.dataset.id);
    } catch (err) {
      mostrarErro(err.message);
    }
  }

  function tratarEntradaGeral(e) {
    const d = e.target.dataset;
    if (d.campo === "habito-nome") { H.novoNome = e.target.value; return; }
    if (d.campo === "ne-texto") { NE.novoTexto = e.target.value; return; }
    if (d.campo === "cx-valor") { CX.valor = e.target.value; return; }
    if (d.campo === "cx-desc") { CX.descricao = e.target.value; return; }
    if (d.campo === "leg-nome") { G.novaLegenda.nome = e.target.value; return; }
    const cor = d.campo ? d.campo.match(/^(nova|habito|ag|tarefa)-(cor|hex)$/) : null;
    if (cor) {
      const valor = cor[2] === "cor" ? e.target.value : e.target.value.trim();
      if (!/^#[0-9a-fA-F]{6}$/.test(valor)) return;
      const v = valor.toLowerCase();
      if (cor[1] === "nova") G.novaLegenda.cor = v;
      else if (cor[1] === "habito") H.novaCor = v;
      else if (cor[1] === "ag" && G.rascunho) G.rascunho.cor = v;
      else if (cor[1] === "tarefa" && G.rascunho) G.rascunho.tarefas[Number(d.i)].cor = v;
      const linha = e.target.closest(".cor-linha");
      if (linha) linha.querySelectorAll("input").forEach(x => { if (x !== e.target) x.value = v; });
      return;
    }
    if (d.campo === "leg-renomear") {
      const cor = G.legenda.find(l => l.id === d.id);
      if (cor) cor.nome = e.target.value;
      if (e.type === "change") persistirNomeCor(d.id, e.target.value);
      return;
    }
    if (!G.rascunho) return;
    const r = G.rascunho;
    if (d.campo === "ag-titulo") r.titulo = e.target.value;
    else if (d.campo === "ag-data") r.dataISO = e.target.value;
    else if (d.campo === "ag-inicio") {
      r.inicio = e.target.value;
      if (/^\d{2}:\d{2}$/.test(r.inicio)) {
        const [h, m] = r.inicio.split(":").map(Number);
        const fimMin = Math.min(h * 60 + m + 60, 1439);
        r.fim = String(Math.floor(fimMin / 60)).padStart(2, "0") + ":" + String(fimMin % 60).padStart(2, "0");
        const campoFim = e.target.closest(".ag-linha").querySelector("[data-campo='ag-fim']");
        if (campoFim) campoFim.value = r.fim;
      }
    }
    else if (d.campo === "ag-fim") r.fim = e.target.value;
    else if (d.campo === "tarefa-texto") r.tarefas[Number(d.i)].texto = e.target.value;
  }

  async function marcarTarefa(cid, i) {
    const c = G.compromissos.find(x => x.id === cid);
    if (!c || !c.tarefas || !c.tarefas[i]) return;
    c.tarefas[i].feita = !c.tarefas[i].feita;
    renderMeuDia();
    try {
      await colecao("compromissos").doc(cid).update({ tarefas: c.tarefas });
    } catch (err) {
      mostrarErro(err.message);
    }
  }

  async function marcarHabito(id) {
    const lista = (H.dias[MD.dia] || []).slice();
    const idx = lista.indexOf(id);
    if (idx >= 0) lista.splice(idx, 1); else lista.push(id);
    H.dias[MD.dia] = lista;
    renderMeuDia();
    try {
      await colecao("habitosDia").doc(MD.dia).set({ feitos: lista });
    } catch (err) {
      mostrarErro(err.message);
    }
  }

  async function adicionarHabito() {
    const nome = (H.novoNome || "").trim();
    if (!nome) return;
    const obj = { nome: nome, cor: H.novaCor };
    try {
      const ref = await colecao("habitos").add(obj);
      H.lista.push({ id: ref.id, ...obj });
      H.novoNome = "";
      H.adicionando = false;
      renderMeuDia();
    } catch (err) {
      mostrarErro(err.message);
    }
  }

  async function excluirHabito(id) {
    if (!confirm("Excluir este hábito?")) return;
    try {
      await colecao("habitos").doc(id).delete();
      H.lista = H.lista.filter(hb => hb.id !== id);
      renderMeuDia();
    } catch (err) {
      mostrarErro(err.message);
    }
  }

  async function persistirNomeCor(id, nome) {
    const nomeLimpo = (nome || "").trim();
    if (!nomeLimpo) return;
    try {
      await colecao("legenda").doc(id).update({ nome: nomeLimpo });
    } catch (err) {
      mostrarErro(err.message);
    }
  }

  async function salvarNovaCor() {
    const nome = (G.novaLegenda.nome || "").trim();
    const cor = G.novaLegenda.cor;
    if (!nome) { mostrarErro("Dê um nome para a nova cor."); return; }
    try {
      const ref = await colecao("legenda").add({ nome: nome, cor: cor });
      G.legenda.push({ id: ref.id, nome: nome, cor: cor });
      if (G.rascunho) G.rascunho.cor = cor;
      G.novaLegenda = { nome: "", cor: "#D81A67" };
      renderAtual();
    } catch (err) {
      mostrarErro(err.message);
    }
  }

  async function excluirCor(id) {
    const cor = G.legenda.find(l => l.id === id);
    if (!cor) return;
    if (!confirm("Excluir a cor \"" + cor.nome + "\"? Os compromissos que já usam essa cor continuam com ela.")) return;
    try {
      await colecao("legenda").doc(id).delete();
      G.legenda = G.legenda.filter(l => l.id !== id);
      if (G.rascunho && G.rascunho.cor === cor.cor) G.rascunho.cor = (G.legenda[0] || LEGENDA_PADRAO[0]).cor;
      renderAtual();
    } catch (err) {
      mostrarErro(err.message);
    }
  }

  async function salvarCompromisso() {
    const r = G.rascunho;
    const st = document.getElementById("ag-status");
    if (!r.titulo.trim()) { if (st) st.textContent = "Dê um título ao compromisso."; return; }
    if (!r.dataISO || !r.inicio || !r.fim || minutosFim(r.fim) <= minutos(r.inicio)) {
      if (st) st.textContent = "Confira o horário: o fim deve ser depois do início.";
      return;
    }
    const obj = {
      titulo: r.titulo.trim(), dataISO: r.dataISO, inicio: r.inicio, fim: r.fim, cor: r.cor,
      tarefas: r.tarefas.filter(t => (t.texto || "").trim() !== "").map(t => ({ texto: t.texto.trim(), feita: !!t.feita, cor: t.cor || null }))
    };
    try {
      if (r.id) {
        await colecao("compromissos").doc(r.id).set(obj);
        const idx = G.compromissos.findIndex(c => c.id === r.id);
        if (idx >= 0) G.compromissos[idx] = { id: r.id, ...obj };
      } else {
        const ref = await colecao("compromissos").add(obj);
        G.compromissos.push({ id: ref.id, ...obj });
      }
      G.formAberto = false;
      G.rascunho = null;
      G.editandoLegenda = false;
      renderAtual();
    } catch (err) {
      if (st) st.textContent = "Erro ao salvar: " + err.message;
    }
  }

  async function excluirCompromisso(id) {
    if (!id) return;
    if (!confirm("Excluir este compromisso?")) return;
    try {
      await colecao("compromissos").doc(id).delete();
      G.compromissos = G.compromissos.filter(c => c.id !== id);
      if (G.rascunho && G.rascunho.id === id) { G.formAberto = false; G.rascunho = null; }
      renderAtual();
    } catch (err) {
      mostrarErro(err.message);
    }
  }

  // Ao clicar fora da agenda semanal, volta para a semana atual
  document.addEventListener("click", e => {
    if (secaoAtual !== "geral" || G.offset === 0) return;
    if (e.target.closest && (e.target.closest("[data-acao='agenda-nav']") || e.target.closest("#agenda"))) return;
    G.offset = 0;
    renderGeral();
  });

  window.addEventListener("orientationchange", () => {
    const ativo = document.activeElement;
    if (ativo && (ativo.tagName === "INPUT" || ativo.tagName === "TEXTAREA")) return;
    if (secaoAtual === "geral" || secaoAtual === "bora") renderAtual();
  });

  // ---------- Não esquecer ----------
  const NE = { lista: [], novoTexto: "", adicionando: false };

  async function carregarNaoEsquecer() {
    try {
      const snap = await colecao("naoEsquecer").get();
      NE.lista = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    } catch (e) { mostrarErro(e.message); }
  }

  function renderNaoEsquecer() {
    const el = document.getElementById("nao");
    if (!el) return;
    let h = NE.lista.length
      ? NE.lista.map(it =>
          "<div class='ne-item'><button class='bolinha" + (it.feito ? " feita" : "") + "' data-acao='ne-feito' data-id='" + it.id + "' aria-label='Marcar'>" +
          (it.feito ? ICONE_CHECK : "") + "</button><span class='" + (it.feito ? "riscado" : "") + "'>" + esc(it.texto) + "</span>" +
          (NE.adicionando ? "<button class='excluir' data-acao='ne-del' data-id='" + it.id + "' aria-label='Excluir'>×</button>" : "") +
          "</div>"
        ).join("")
      : "<p class='vazio'>Nada anotado ainda.</p>";
    if (NE.adicionando) {
      h += "<div class='ne-add'><input placeholder='O que você não pode esquecer?' data-campo='ne-texto' value='" + esc(NE.novoTexto) + "'>" +
        "<button class='secundario' data-acao='ne-add'>Adicionar</button></div>";
    }
    el.innerHTML = h;
  }

  async function neAdicionar() {
    const texto = (NE.novoTexto || "").trim();
    if (!texto) return;
    const obj = { texto: texto, feito: false };
    try {
      const ref = await colecao("naoEsquecer").add(obj);
      NE.lista.push({ id: ref.id, ...obj });
      NE.novoTexto = "";
      renderNaoEsquecer();
    } catch (err) { mostrarErro(err.message); }
  }

  async function neAlternar(id) {
    const it = NE.lista.find(x => x.id === id);
    if (!it) return;
    it.feito = !it.feito;
    renderNaoEsquecer();
    try { await colecao("naoEsquecer").doc(id).update({ feito: it.feito }); }
    catch (err) { mostrarErro(err.message); }
  }

  async function neExcluir(id) {
    if (!confirm("Excluir este item?")) return;
    try {
      await colecao("naoEsquecer").doc(id).delete();
      NE.lista = NE.lista.filter(x => x.id !== id);
      renderNaoEsquecer();
    } catch (err) { mostrarErro(err.message); }
  }

  // ---------- Caixa do dia ----------
  const CX = { dia: null, lista: [], tipo: "gasto", valor: "", descricao: "" };

  async function carregarCaixa() {
    try {
      const snap = await colecao("caixa").get();
      CX.lista = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    } catch (e) { mostrarErro(e.message); }
  }

  function renderCaixa() {
    const el = document.getElementById("caixa");
    if (!el) return;
    if (!CX.dia) CX.dia = hojeISO();
    const dia = CX.lista.filter(x => x.dataISO === CX.dia);
    const ganhos = dia.filter(x => x.tipo === "ganho").reduce((a, x) => a + Number(x.valor), 0);
    const gastos = dia.filter(x => x.tipo === "gasto").reduce((a, x) => a + Number(x.valor), 0);
    const fmt = v => "R$ " + v.toFixed(2).replace(".", ",");

    el.innerHTML = "<div class='nav'><button class='icone' data-acao='cx-nav' data-d='-1' aria-label='Dia anterior'>‹</button>" +
      "<strong>" + tituloDia(CX.dia) + "</strong>" +
      "<button class='icone' data-acao='cx-nav' data-d='1' aria-label='Próximo dia'>›</button></div>" +
      "<div class='cx-resumo'>" +
        "<div class='cx-card ganho'><small>Ganhos</small><strong>" + fmt(ganhos) + "</strong></div>" +
        "<div class='cx-card gasto'><small>Gastos</small><strong>" + fmt(gastos) + "</strong></div>" +
        "<div class='cx-card'><small>Saldo</small><strong>" + fmt(ganhos - gastos) + "</strong></div>" +
      "</div>" +
      "<div class='cx-form'>" +
        "<div class='cx-tipo'>" +
          "<button class='chip" + (CX.tipo === "gasto" ? " ativo" : "") + "' data-acao='cx-tipo' data-tipo='gasto'>Gasto</button>" +
          "<button class='chip" + (CX.tipo === "ganho" ? " ativo" : "") + "' data-acao='cx-tipo' data-tipo='ganho'>Ganho</button>" +
        "</div>" +
        "<div class='cx-linha'>" +
          "<input type='number' inputmode='decimal' step='0.01' placeholder='Valor' data-campo='cx-valor' value='" + esc(CX.valor) + "'>" +
          "<input placeholder='Descrição' data-campo='cx-desc' value='" + esc(CX.descricao) + "'>" +
          "<button class='secundario' data-acao='cx-add'>Adicionar</button>" +
        "</div>" +
      "</div>" +
      (dia.length
        ? dia.map(x =>
            "<div class='cx-item " + x.tipo + "'><span>" + esc(x.descricao || (x.tipo === "gasto" ? "Gasto" : "Ganho")) + "</span>" +
            "<strong>" + (x.tipo === "gasto" ? "− " : "+ ") + fmt(Number(x.valor)) + "</strong>" +
            "<button class='excluir' data-acao='cx-del' data-id='" + x.id + "' aria-label='Excluir'>×</button></div>"
          ).join("")
        : "<p class='vazio'>Nenhum lançamento neste dia.</p>");
  }

  async function cxAdicionar() {
    const valor = Number(String(CX.valor).replace(",", "."));
    if (!valor || valor <= 0) { mostrarErro("Digite um valor maior que zero."); return; }
    const obj = { dataISO: CX.dia, tipo: CX.tipo, valor: valor, descricao: (CX.descricao || "").trim() };
    try {
      const ref = await colecao("caixa").add(obj);
      CX.lista.push({ id: ref.id, ...obj });
      CX.valor = "";
      CX.descricao = "";
      renderCaixa();
    } catch (err) { mostrarErro(err.message); }
  }

  async function cxExcluir(id) {
    if (!confirm("Excluir este lançamento?")) return;
    try {
      await colecao("caixa").doc(id).delete();
      CX.lista = CX.lista.filter(x => x.id !== id);
      renderCaixa();
    } catch (err) { mostrarErro(err.message); }
  }

  async function tratarCliqueSecoes(e) {
    try {
      const el = e.target.closest("[data-acao]");
      if (!el) return;
      const a = el.dataset.acao;
      if (a === "ne-add") await neAdicionar();
      else if (a === "ne-feito") await neAlternar(el.dataset.id);
      else if (a === "ne-del") await neExcluir(el.dataset.id);
      else if (a === "cx-nav") { CX.dia = somar(CX.dia || hojeISO(), Number(el.dataset.d)); renderCaixa(); }
      else if (a === "cx-tipo") { CX.tipo = el.dataset.tipo; renderCaixa(); }
      else if (a === "cx-add") await cxAdicionar();
      else if (a === "cx-del") await cxExcluir(el.dataset.id);
    } catch (err) { mostrarErro(err.message); }
  }

  function tratarEntradaSecoes(e) {
    const d = e.target.dataset;
    if (d.campo === "ne-texto") NE.novoTexto = e.target.value;
    else if (d.campo === "cx-valor") CX.valor = e.target.value;
    else if (d.campo === "cx-desc") CX.descricao = e.target.value;
  }

  // ---------- treinos: tela ----------
  function renderTreinos() {
    const el = document.getElementById("treinos");
    if (!el) return;
    if (T.editorTipo) { T.centralizar = true; el.innerHTML = htmlEditorAtual(); return; }

    let h = "<h2>Treinos</h2><div class='abas'>" +
      "<button class='aba" + (T.aba === "geral" ? " ativo" : "") + "' data-acao='aba' data-v='geral'>Geral</button>" +
      "<button class='aba" + (T.aba === "historico" ? " ativo" : "") + "' data-acao='aba' data-v='historico'>Histórico</button>" +
    "</div>";
    h += T.aba === "geral" ? htmlAbaDia() : htmlAbaHistorico();
    h += "<div class='fabs'>" +
      "<button class='fab' data-acao='abrir-metas' aria-label='Metas'>" + ICONES.alvo + "</button>" +
      "<button class='fab' data-acao='abrir-lista' aria-label='Editar treinos'>" + ICONES.lapis + "</button>" +
    "</div>";
    const roletaAntes = el.querySelector(".roleta");
    const posAntes = roletaAntes ? roletaAntes.scrollLeft : 0;
    el.innerHTML = h;

    const roleta = el.querySelector(".roleta");
    if (roleta) {
      if (T.centralizar) {
        const inicio = el.querySelector(".roleta .dia[data-iso='" + inicioSemana(hojeISO()) + "']");
        if (inicio) roleta.scrollLeft = inicio.offsetLeft - roleta.offsetLeft;
        T.centralizar = false;
      } else {
        roleta.scrollLeft = posAntes;
      }
    }
    atualizarTempos();
  }

  function celula(iso) {
    const h = hojeISO();
    const tem = sessoesDoDia(iso).length > 0;
    return "<button class='dia" + (iso === h ? " hoje" : "") + (iso === T.selecionado ? " sel" : "") +
      "' data-acao='dia' data-iso='" + iso + "'>" +
      "<small>" + NOMES[diaSemana(iso)] + "</small><b>" + dePara(iso).getDate() + "</b>" +
      (tem ? ICONE_CHECK : "<i></i>") +
    "</button>";
  }

  function htmlAbaDia() {
    const h = hojeISO();
    const ini = inicioSemana(h);
    let semana = "";
    for (let k = 0; k < 7; k++) semana += celula(somar(ini, k));
    let roleta = "";
    for (let k = -30; k <= 30; k++) roleta += celula(somar(h, k));
    const n = diasTreinados(ini, somar(ini, 6));
    const meta = T.metas.semanal ? " de " + T.metas.semanal : "";

    return "<div class='roleta'>" + roleta + "</div>" +
      "<p class='resumo'>Esta semana: <strong>" + n + "</strong> dia" + (n === 1 ? "" : "s") + " treinado" + (n === 1 ? "" : "s") + meta + "</p>" +
      "<div id='treino-status' class='status'></div>" +
      "<div class='painel-dia'>" + htmlPainelDia() + "</div>";
  }

  function htmlPainelDia() {
    const iso = T.selecionado;
    const h = hojeISO();
    let html = "<h2>" + tituloDia(iso) + "</h2>";

    if (iso === h && T.sessao) return html + htmlSessaoAtiva();

    const sess = sessoesDoDia(iso);
    sess.forEach(s => { html += htmlSessaoFeita(s); });

    if (iso < h) {
      if (sess.length === 0) {
        html += T.registrando
          ? htmlRegistro()
          : "<p class='vazio'>Sem treino registrado.</p>" +
            "<div class='centro'><button class='secundario' data-acao='registrar-abrir'>Registrar o que fiz</button></div>";
      }
      return html;
    }
    return html + htmlProgramado(iso);
  }

  function htmlProgramado(iso) {
    if (T.trocando) return htmlEscolherTreino();
    const prog = treinoDoDia(iso);
    let h = "<div class='prog'>" + (prog
        ? "<span>Treino programado: <strong>" + esc(prog.nome) + "</strong></span>"
        : "<span>Nenhum treino programado para este dia.</span>") +
      "<button class='icone' data-acao='trocar' aria-label='Trocar treino'>⇄</button></div>";
    if (iso === hojeISO()) {
      h += prog
        ? "<div class='centro'><button class='grande' data-acao='iniciar'>Começar treino</button></div>"
        : "<p class='vazio'>Toque em ⇄ para escolher um treino, ou cadastre um com dia sugerido pelo ✎.</p>";
    }
    return h;
  }

  function htmlEscolherTreino() {
    if (T.treinos.length === 0) {
      return "<p class='vazio'>Cadastre seus treinos primeiro, pelo botão ✎.</p>" +
        "<div class='centro'><button class='secundario' data-acao='cancelar-troca'>Voltar</button></div>";
    }
    return "<p class='sub'>Escolha o treino para este dia:</p>" +
      T.treinos.map(t => "<button class='treino-item' data-acao='escolher' data-id='" + t.id + "'><span>" + esc(t.nome) + "</span></button>").join("") +
      "<div class='centro'><button class='secundario' data-acao='cancelar-troca'>Cancelar</button></div>";
  }

  function htmlRegistro() {
    const lista = T.treinos.length
      ? "<p class='sub'>Escolha um treino salvo:</p>" +
        T.treinos.map(t => "<button class='treino-item' data-acao='registrar-treino' data-id='" + t.id + "'><span>" + esc(t.nome) + "</span></button>").join("")
      : "<p class='vazio'>Você ainda não tem treinos salvos.</p>";
    return lista +
      "<p class='sub'>Ou descreva o que você fez:</p>" +
      "<textarea data-campo='descricao' placeholder='Ex.: Costas: puxada 40 kg, remada 30 kg, 3 séries de 10'>" + esc(T.descricao) + "</textarea>" +
      "<div class='centro'>" +
        "<button class='secundario' data-acao='registrar-cancelar'>Cancelar</button>" +
        "<button class='grande' data-acao='registrar-salvar'>Salvar registro</button>" +
      "</div>";
  }

  async function registrarTreinoAntigo(id) {
    const t = T.treinos.find(x => x.id === id);
    if (!t) return;
    const obj = {
      dataISO: T.selecionado, nome: t.nome, treinoId: t.id, manual: false, duracaoSeg: null,
      exercicios: t.exercicios.map(ex => ({ nome: ex.nome, tipo: ex.tipo, carga: null, feito: true, series: Array.from({ length: Number(ex.series) || 0 }, (_, k) => ({ n: k + 1, peso: null, reps: Number(ex.reps) || null })) }))
    };
    try {
      const ref = await colecao("sessoes").add({ ...obj, data: firebase.firestore.FieldValue.serverTimestamp() });
      T.sessoes.push({ id: ref.id, ...obj });
      T.registrando = false;
      renderTreinos();
    } catch (err) {
      mostrarErro(err.message);
    }
  }

  function htmlSessaoFeita(s) {
    let h = "<div class='feito-card'><div class='ex-topo'><span>" + (s.manual ? "Registro manual" : "<span class='etiqueta'>" + ICONE_CHECK + " Concluído</span>") + "</span><span>" +
      (s.manual || !s.duracaoSeg ? "" : formatar(s.duracaoSeg)) + "</span></div>";
    if (s.manual) {
      h += "<p class='texto'>" + esc(s.descricao) + "</p>";
    } else {
      h += "<p class='nome-feito'>" + esc(s.nome) + "</p>";
      (s.exercicios || []).forEach(ex => {
        let detalhe;
        if (ex.series && ex.series.length) {
          detalhe = ex.series.map(x =>
            (x.peso !== null && x.peso !== undefined ? x.peso + " kg" : "–") + " × " +
            (x.reps !== null && x.reps !== undefined ? x.reps : "–")
          ).join(" · ");
        } else {
          detalhe = ex.carga === null || ex.carga === undefined ? "sem carga" : ex.carga + " kg";
        }
        h += "<div class='linha-ex'><span>" + esc(ex.nome) + (ex.feito ? "" : " (pulado)") + "</span><span>" + detalhe + "</span></div>";
      });
    }
    if (s.id) h += "<button class='excluir-sessao' data-acao='excluir-sessao' data-id='" + s.id + "'>Excluir treino</button>";
    return h + "</div>";
  }

  function htmlSessaoAtiva() {
    const t = T.treinoHoje;
    let h = "<h2>" + esc(t.nome) + "</h2><div class='cronometro'><small>tempo de treino</small><strong id='tempo'></strong></div>";
    if (T.descanso) {
      h += "<div class='descanso'>Descanso<strong id='descanso'></strong><div class='ajuste'><button data-acao='descanso-menos'>−15 s</button><button data-acao='descanso-mais'>+15 s</button><button data-acao='pular'>Pular</button></div></div>";
    }
    h += t.exercicios.map((ex, i) => cardExercicio(ex, i)).join("");
    h += "<div class='centro'><button class='grande' data-acao='finalizar'>Finalizar treino</button></div>";
    return h;
  }

  function descansoPadrao() {
    const v = Number(T.metas.descanso);
    return v > 0 ? v : 60;
  }

  function numSeries(ex, i) {
    return T.numSeries[i] || Number(ex.series) || 1;
  }

  function obterSerie(i, j, ex, ultima) {
    if (!T.series[i]) T.series[i] = [];
    if (!T.series[i][j]) {
      T.series[i][j] = { peso: ultima ? ultima.carga : "", reps: Number(ex.reps) || "", feito: false };
    }
    return T.series[i][j];
  }

  function cardExercicio(ex, i) {
    const ultima = T.ultimas[slug(ex.nome)];
    const qtd = numSeries(ex, i);
    let h = "<div class='ex'>" +
      "<div class='ex-topo'><span>" + esc(ex.nome) + "</span><span>" + esc(ex.series) + " × " + esc(ex.reps) + (ex.tipo === "lado" ? " por lado" : "") + "</span></div>" +
      (ultima ? "<small>Última vez: " + ultima.carga + " kg" + (ex.tipo === "lado" ? " por lado" : "") + "</small>" : "") +
      "<div class='series'>" +
        "<div class='serie cab'><span></span><span>kg</span><span>repetições</span><span></span></div>";
    for (let j = 0; j < qtd; j++) {
      const s = obterSerie(i, j, ex, ultima);
      h += "<div class='serie" + (s.feito ? " feita" : "") + "'>" +
        "<span class='serie-n'>" + (j + 1) + "</span>" +
        "<input type='number' inputmode='decimal' step='0.5' placeholder='kg' value='" + (s.peso ?? "") + "' data-campo='peso' data-i='" + i + "' data-s='" + j + "'>" +
        "<input type='number' inputmode='numeric' placeholder='reps' value='" + (s.reps ?? "") + "' data-campo='reps' data-i='" + i + "' data-s='" + j + "'>" +
        "<button class='bolinha' data-acao='serie-feito' data-i='" + i + "' data-s='" + j + "' aria-label='Marcar série'>" + (s.feito ? ICONE_CHECK : "") + "</button>" +
      "</div>";
    }
    h += "</div><button class='secundario' data-acao='serie-add' data-i='" + i + "'>+ Série</button></div>";
    return h;
  }

  // ---------- histórico ----------
  function diasTreinados(ini, fim) {
    const dias = new Set(T.sessoes.filter(x => x.dataISO >= ini && x.dataISO <= fim).map(x => x.dataISO));
    return dias.size;
  }

  function navegacao(titulo, tipo) {
    return "<div class='nav'>" +
      "<button class='icone' data-acao='nav' data-d='-1' data-tipo='" + tipo + "' aria-label='Anterior'>‹</button>" +
      "<strong>" + titulo + "</strong>" +
      "<button class='icone' data-acao='nav' data-d='1' data-tipo='" + tipo + "' aria-label='Próximo'>›</button>" +
    "</div>";
  }

  function anel(feitos, meta, rotulo) {
    const C = 2 * Math.PI * 50;
    const pct = meta ? Math.min(1, feitos / meta) : 0;
    const centro = meta ? feitos + "/" + meta : String(feitos);
    return "<svg viewBox='0 0 120 120' width='150' height='150' style='display:block;margin:0 auto' role='img' aria-label='Progresso: " + centro + " " + rotulo + "'>" +
      "<circle cx='60' cy='60' r='50' fill='none' stroke='#EFECE6' stroke-width='12'/>" +
      "<circle cx='60' cy='60' r='50' fill='none' stroke='#D81A67' stroke-width='12' stroke-linecap='round' stroke-dasharray='" + (pct * C) + " " + C + "' transform='rotate(-90 60 60)'/>" +
      "<text x='60' y='62' text-anchor='middle' font-size='20' font-weight='600' fill='#2B2420'>" + centro + "</text>" +
      "<text x='60' y='80' text-anchor='middle' font-size='10' fill='#6B6259'>" + rotulo + "</text>" +
    "</svg>";
  }

  function anelSemana(feitos, meta) {
    return anel(feitos, meta, "treinos");
  }

  function htmlCalendario(ano, mes) {
    const primeiro = new Date(ano, mes, 1).getDay();
    const diasNoMes = new Date(ano, mes + 1, 0).getDate();
    let grade = NOMES.map(d => "<div class='cal-cab'>" + d + "</div>").join("");
    for (let k = 0; k < primeiro; k++) grade += "<div></div>";
    for (let d = 1; d <= diasNoMes; d++) {
      const iso = isoDe(new Date(ano, mes, d));
      const treinou = sessoesDoDia(iso).length > 0;
      grade += "<div class='cal-dia" + (treinou ? " treinado" : "") + (iso === hojeISO() ? " hoje" : "") + "'><span>" + d + "</span>" +
        (treinou ? ICONE_CHECK : "") + "</div>";
    }
    return "<div class='calendario'>" + grade + "</div>";
  }

  function htmlAbaHistorico() {
    const agora = new Date();
    const ref = somar(hojeISO(), T.offsetSemana * 7);
    const ini = inicioSemana(ref);
    const fim = somar(ini, 6);
    const dias = diasTreinados(ini, fim);
    const meta = T.metas.semanal;
    const mref = new Date(agora.getFullYear(), agora.getMonth() + T.offsetMes, 1);
    const anoAtual = agora.getFullYear();

    let h = "<section class='bloco'><h3>Semana</h3>" +
      navegacao(dataCurta(ini) + " a " + dataCurta(fim), "semana") +
      anelSemana(dias, meta) +
      (meta ? "" : "<p class='vazio'>Defina sua meta semanal no botão de alvo.</p>") +
    "</section>";

    h += "<section class='bloco'><h3>Mês</h3>" +
      navegacao(capitalizar(MESES[mref.getMonth()]) + " de " + mref.getFullYear(), "mes") +
      htmlCalendario(mref.getFullYear(), mref.getMonth()) +
    "</section>";

    const diasAno = diasTreinados(anoAtual + "-01-01", anoAtual + "-12-31");
    h += "<section class='bloco'><h3>Total de " + anoAtual + "</h3>" +
      anel(diasAno, T.metas.anual, "dias") +
      (T.metas.anual ? "" : "<p class='vazio'>Defina sua meta anual no botão de alvo.</p>") +
      "<p class='resumo'>Total desde o início: <strong>" + diasTreinados("0000-01-01", "9999-12-31") + "</strong> dias</p>" +
    "</section>";
    return h;
  }

  // ---------- editores ----------
  function htmlEditorAtual() {
    if (T.editorTipo === "lista") return htmlListaEditor();
    if (T.editorTipo === "treino") return htmlEditorTreino();
    if (T.editorTipo === "metas") return htmlMetas();
    return "";
  }

  function htmlListaEditor() {
    return "<h2>Seus treinos</h2><p class='sub'>Toque em um treino para editar, ou crie um novo.</p>" +
      (T.treinos.length
        ? T.treinos.map(t =>
            "<div class='linha-treino'><button class='treino-item' data-acao='editar-treino' data-id='" + t.id + "'><span>" + esc(t.nome) + "</span><small>" +
            ((t.diasSugeridos || []).length ? t.diasSugeridos.map(d => NOMES[d]).join(", ") : "Sem dia") +
            "</small></button><button class='excluir' data-acao='excluir-lista' data-id='" + t.id + "' aria-label='Excluir treino'>" + ICONES.lixeira + "</button></div>").join("")
        : "<p class='vazio'>Nenhum treino cadastrado ainda.</p>") +
      "<button data-acao='novo-treino'>+ Novo treino</button>" +
      "<div class='centro'><button class='secundario' data-acao='fechar-editor'>Fechar</button></div>";
  }

  function htmlEditorTreino() {
    const e = T.editor;
    let h = "<h2>" + (e.id ? "Editar treino" : "Novo treino") + "</h2>" +
      "<input placeholder='Nome do treino (ex.: Costas e bíceps)' data-campo='nome' value='" + esc(e.nome) + "'>" +
      "<label>Quais dias você pretende fazer?</label>" +
      "<div class='chips'>" +
        NOMES.map((n, i) => "<button class='chip" + ((e.diasSugeridos || []).includes(i) ? " ativo" : "") + "' data-acao='dia-treino' data-i='" + i + "'>" + n + "</button>").join("") +
      "</div>" +
      "<label>Exercícios</label>";

    e.exercicios.forEach((ex, i) => {
      h += "<div class='lin-edit'>" +
        "<input placeholder='Exercício' data-campo='exNome' data-i='" + i + "' value='" + esc(ex.nome) + "'>" +
        "<input type='number' placeholder='Séries' data-campo='exSeries' data-i='" + i + "' value='" + esc(ex.series) + "'>" +
        "<input type='number' placeholder='Reps' data-campo='exReps' data-i='" + i + "' value='" + esc(ex.reps) + "'>" +
        "<button class='excluir' data-acao='ex-del' data-i='" + i + "'>×</button>" +

  function htmlMetas() {
    const r = T.metaRascunho;
    return "<h2>Metas</h2><p class='sub'>Defina quantos treinos você quer fazer.</p>" +
      "<label>Treinos por semana</label>" +
      "<input type='number' inputmode='numeric' placeholder='Ex.: 4' data-campo='meta' data-chave='semanal' value='" + (r.semanal ?? "") + "'>" +
      "<label>Treinos no ano</label>" +
      "<input type='number' inputmode='numeric' placeholder='Ex.: 150' data-campo='meta' data-chave='anual' value='" + (r.anual ?? "") + "'>" +
      "<label>Descanso padrão (segundos)</label>" +
      "<input type='number' inputmode='numeric' placeholder='60' data-campo='meta' data-chave='descanso' value='" + (r.descanso ?? "") + "'>" +
      "<div id='treino-status' class='status'></div>" +
      "<div class='centro'>" +
        "<button class='secundario' data-acao='fechar-editor'>Cancelar</button>" +
        "<button class='grande' data-acao='metas-salvar'>Salvar</button>" +
      "</div>";

  // ---------- eventos ----------
  async function tratarCliqueInterno(e) {
    const el = e.target.closest("[data-acao]");
    if (!el) return;
    const a = el.dataset.acao;
    const i = Number(el.dataset.i);

    switch (a) {
      case "aba": T.aba = el.dataset.v; T.centralizar = true; renderTreinos(); break;
      case "hist": T.hist = el.dataset.v; renderTreinos(); break;
      case "nav": {
        const d = Number(el.dataset.d);
        if (el.dataset.tipo === "semana") T.offsetSemana += d; else T.offsetMes += d;
        renderTreinos();
        break;
      }
      case "dia":
        T.selecionado = el.dataset.iso;
        T.registrando = false;
        T.trocando = false;
        renderTreinos();
        break;
      case "trocar": T.trocando = true; renderTreinos(); break;
      case "cancelar-troca": T.trocando = false; renderTreinos(); break;
      case "escolher": {
        const iso = T.selecionado;
        T.trocas[iso] = el.dataset.id;
        T.trocando = false;
        try { await colecao("trocas").doc(iso).set({ treinoId: el.dataset.id }); } catch (err) { /* mantém localmente */ }
        renderTreinos();
        break;
      }
      case "iniciar": {
        const prog = treinoDoDia(hojeISO());
        if (!prog) return;
        T.treinoHoje = prog;
        T.sessao = { inicio: Date.now() };
        T.feitos = {};
        T.cargas = {};
        T.series = {};
        T.numSeries = {};
        T.descanso = null;
        manterTela();
        renderTreinos();
        break;
      }
      case "serie-feito": {
        const j = Number(el.dataset.s);
        const serie = T.series[i] && T.series[i][j];
        if (!serie) break;
        serie.feito = !serie.feito;
        if (serie.feito) T.descanso = { fim: Date.now() + descansoPadrao() * 1000 };
        renderTreinos();
        break;
      }
      case "serie-add": {
        const ex = T.treinoHoje.exercicios[i];
        T.numSeries[i] = numSeries(ex, i) + 1;
        renderTreinos();
        break;
      }
      case "pular": T.descanso = null; renderTreinos(); break;
      case "descanso-mais": if (T.descanso) { T.descanso.fim += 15000; renderTreinos(); } break;
      case "descanso-menos": if (T.descanso) { T.descanso.fim = Math.max(Date.now() + 1000, T.descanso.fim - 15000); renderTreinos(); } break;
      case "finalizar": await finalizarTreino(); break;
      case "registrar-abrir": T.registrando = true; renderTreinos(); break;
      case "registrar-cancelar": T.registrando = false; renderTreinos(); break;
      case "registrar-salvar": await salvarRegistro(); break;
      case "registrar-treino": await registrarTreinoAntigo(el.dataset.id); break;
      case "abrir-lista": T.editorTipo = "lista"; T.editor = null; renderTreinos(); break;
      case "abrir-metas": T.metaRascunho = { ...T.metas }; T.editorTipo = "metas"; renderTreinos(); break;
      case "fechar-editor": T.editorTipo = null; T.editor = null; renderTreinos(); break;
      case "voltar-lista": T.editorTipo = "lista"; T.editor = null; renderTreinos(); break;
      case "novo-treino":
        T.editor = { id: null, nome: "", diasSugeridos: [], exercicios: [] };
        T.editorTipo = "treino";
        renderTreinos();
        break;
      case "editar-treino": {
        const t = T.treinos.find(x => x.id === el.dataset.id);
        if (!t) break;
        T.editor = JSON.parse(JSON.stringify(t));
        T.editorTipo = "treino";
        renderTreinos();
        break;
      }
      case "dia-treino": {
        const lista = T.editor.diasSugeridos || [];
        T.editor.diasSugeridos = lista.includes(i) ? lista.filter(x => x !== i) : lista.concat([i]);
        renderTreinos();
        break;
      }
      case "ex-add":
        T.editor.exercicios.push({ nome: "", series: "", reps: "", tipo: "total" });
        renderTreinos();
        break;
      case "ex-del":
        T.editor.exercicios.splice(i, 1);
        renderTreinos();
        break;
      case "treino-salvar": await salvarTreino(); break;
      case "treino-excluir": await excluirTreino(); break;
      case "excluir-sessao": await excluirSessao(el.dataset.id); break;
      case "excluir-lista": await excluirTreinoPorId(el.dataset.id); break;
      case "metas-salvar": await salvarMetas(); break;
    }
  }

  async function tratarClique(e) {
    try {
      await tratarCliqueInterno(e);
    } catch (err) {
      mostrarErro(err.message);
    }
  }

  async function excluirSessao(id) {
    if (!id) return;
    if (!confirm("Excluir este treino concluído? Essa ação não pode ser desfeita.")) return;
    try {
      await colecao("sessoes").doc(id).delete();
      T.sessoes = T.sessoes.filter(x => x.id !== id);
      renderTreinos();
    } catch (err) {
      mostrarErro(err.message);
    }
  }

  function tratarEntrada(e) {
    const d = e.target.dataset;
    if (d.carga !== undefined) {
      const i = Number(d.carga);
      T.cargas[i] = e.target.value;
      const ex = T.treinoHoje && T.treinoHoje.exercicios[i];
      const span = document.querySelector("[data-total='" + i + "']");
      if (span && ex) {
        span.textContent = ex.tipo === "lado" && e.target.value !== "" ? "= " + (Number(e.target.value) * 2) + " kg no total" : "";
      }
      return;
    }
    if (d.campo === undefined) return;
    const i = Number(d.i);
    if (d.campo === "peso" || d.campo === "reps") {
      const serie = T.series[i] && T.series[i][Number(d.s)];
      if (serie) serie[d.campo] = e.target.value;
      return;
    }
    switch (d.campo) {
      case "descricao": T.descricao = e.target.value; break;
      case "nome": if (T.editor) T.editor.nome = e.target.value; break;
      case "exNome": if (T.editor) T.editor.exercicios[i].nome = e.target.value; break;
      case "exSeries": if (T.editor) T.editor.exercicios[i].series = e.target.value; break;
      case "exReps": if (T.editor) T.editor.exercicios[i].reps = e.target.value; break;
      case "exTipo": if (T.editor) T.editor.exercicios[i].tipo = e.target.value; break;
      case "meta": T.metaRascunho[d.chave] = e.target.value; break;
    }
  }

  // ---------- salvar ----------
  async function salvarRegistro() {
    const txt = (T.descricao || "").trim();
    const st = document.getElementById("treino-status");
    if (!txt) { if (st) st.textContent = "Escreva o que você treinou."; return; }
    const obj = { dataISO: T.selecionado, nome: "Registro manual", manual: true, descricao: txt };
    try {
      const ref = await colecao("sessoes").add({ ...obj, data: firebase.firestore.FieldValue.serverTimestamp() });
      T.sessoes.push({ id: ref.id, ...obj });
      T.registrando = false;
      T.descricao = "";
      renderTreinos();
    } catch (err) {
      if (st) st.textContent = "Erro ao salvar: " + err.message;
    }
  }

  async function finalizarTreino() {
    const t = T.treinoHoje;
    if (!t || !T.sessao) return;
    const duracao = Math.round((Date.now() - T.sessao.inicio) / 1000);
    const exercicios = t.exercicios.map((ex, i) => {
      const feitas = (T.series[i] || []).filter(x => x && x.feito);
      const series = feitas.map((x, k) => ({
        n: k + 1,
        peso: x.peso === "" || x.peso === null || x.peso === undefined ? null : Number(x.peso),
        reps: x.reps === "" || x.reps === null || x.reps === undefined ? null : Number(x.reps)
      }));
      const pesos = series.map(x => x.peso).filter(x => x !== null);
      return { nome: ex.nome, tipo: ex.tipo, feito: feitas.length > 0, series: series, carga: pesos.length ? Math.max(...pesos) : null };
    });
    const obj = { dataISO: hojeISO(), nome: t.nome, treinoId: t.id, manual: false, duracaoSeg: duracao, exercicios: exercicios };

    try {
      const promessas = [];
      exercicios.forEach(ex => {
        if (ex.carga !== null) {
          const id = slug(ex.nome);
          promessas.push(colecao("ultimas").doc(id).set({
            nome: ex.nome, carga: ex.carga, tipo: ex.tipo,
            data: firebase.firestore.FieldValue.serverTimestamp()
          }));
          T.ultimas[id] = { nome: ex.nome, carga: ex.carga, tipo: ex.tipo };
        }
      });
      promessas.push(colecao("sessoes").add({ ...obj, data: firebase.firestore.FieldValue.serverTimestamp() }));
      const resultados = await Promise.all(promessas);
      const sessaoRef = resultados[resultados.length - 1];
      T.sessoes.push({ id: sessaoRef.id, ...obj });

      T.sessao = null;
      T.treinoHoje = null;
      T.feitos = {};
      T.cargas = {};
      T.series = {};
      T.numSeries = {};
      T.descanso = null;
      soltarTela();
      renderTreinos();
      const st = document.getElementById("treino-status");
      if (st) st.textContent = "Treino salvo. Duração: " + formatar(duracao);
    } catch (err) {
      const st = document.getElementById("treino-status");
      if (st) st.textContent = "Erro ao salvar o treino: " + err.message;
    }
  }

  async function salvarTreino() {
    const e = T.editor;
    const st = document.getElementById("treino-status");
    const nome = (e.nome || "").trim();
    if (!nome) { if (st) st.textContent = "Dê um nome ao treino."; return; }
    const limpo = {
      nome: nome,
      diasSugeridos: (e.diasSugeridos || []).slice().sort((a, b) => a - b),
      exercicios: e.exercicios
        .filter(x => (x.nome || "").trim() !== "")
        .map(x => ({ nome: x.nome.trim(), series: x.series || "", reps: x.reps || "", tipo: "total" }))
    };
    try {
      let id = e.id;
      if (id) {
        await colecao("treinos").doc(id).set(limpo);
      } else {
        const ref = await colecao("treinos").add(limpo);
        id = ref.id;
      }
      const novo = { id: id, ...limpo };
      const idx = T.treinos.findIndex(x => x.id === id);
      if (idx >= 0) T.treinos[idx] = novo; else T.treinos.push(novo);
      T.editorTipo = "lista";
      T.editor = null;
      renderTreinos();
    } catch (err) {
      if (st) st.textContent = "Erro ao salvar: " + err.message;
    }
  }

  async function excluirTreinoPorId(id) {
    if (!id) return;
    if (!confirm("Excluir este treino? Os treinos já feitos com ele continuam no histórico.")) return;
    try {
      await colecao("treinos").doc(id).delete();
      T.treinos = T.treinos.filter(x => x.id !== id);
      if (T.editorTipo === "treino" && T.editor && T.editor.id === id) {
        T.editorTipo = "lista";
        T.editor = null;
      }
      renderTreinos();
    } catch (err) {
      const st = document.getElementById("treino-status");
      if (st) st.textContent = "Erro ao excluir: " + err.message;
    }
  }

  async function excluirTreino() {
    const id = T.editor && T.editor.id;
    if (id) await excluirTreinoPorId(id);
  }

  async function salvarMetas() {
    const r = T.metaRascunho;
    const st = document.getElementById("treino-status");
    const num = v => (v === "" || v === null || v === undefined) ? null : Number(v);
    const obj = { semanal: num(r.semanal), anual: num(r.anual), ano: new Date().getFullYear(), descanso: num(r.descanso) || 60 };
    try {
      await colecao("config").doc("metas").set(obj);
      T.metas = obj;
      T.editorTipo = null;
      T.metaRascunho = {};
      renderTreinos();
    } catch (err) {
      if (st) st.textContent = "Erro ao salvar: " + err.message;
    }
  }

  // ---------- descanso e cronômetro ----------
  function atualizarTempos() {
    if (T.sessao) {
      const t = document.getElementById("tempo");
      if (t) t.textContent = formatar((Date.now() - T.sessao.inicio) / 1000);
    }
    if (T.descanso) {
      const restante = (T.descanso.fim - Date.now()) / 1000;
      if (restante <= 0) {
        T.descanso = null;
        vibrar();
        renderTreinos();
      } else {
        const d = document.getElementById("descanso");
        if (d) d.textContent = formatar(restante);
      }
    }
  }
  setInterval(atualizarTempos, 1000);

  telaGrande.addEventListener("change", () => {
    if (!usuario) return;
    if (!secaoAtual) secaoAtual = "geral";
    desenharMenu();
    desenharMain();
  });

  auth.onAuthStateChanged(user => user ? mostrarApp(user) : mostrarFormulario());
</script>
</body>
</html>
