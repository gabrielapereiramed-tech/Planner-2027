  async function tratarCliqueCrochet(e) {
    try {
      const el = e.target.closest("[data-acao]");
      if (!el) return;
      const a = el.dataset.acao;
      if (a === "cr-aba") { CR.aba = el.dataset.v; CR.form = null; renderCrochet(); }
      else if (a === "cr-novo-enc") { CR.form = { kind: "encomenda", itens: [{ produtoId: "", qtd: 1 }], clienteId: "", dataEntrega: hojeISO(), frete: false, valorFrete: "", endereco: "", extras: [], custo: "", sinalPago: false, valorSinal: "", obs: "" }; renderCrochet(); }
      else if (a === "cr-enc-edit") { const x = CR.encomendas.find(y => y.id === el.dataset.id); if (x) { CR.form = formDeEncomenda(x); renderCrochet(); } }
      else if (a === "cr-prod-edit") { const p = CR.produtos.find(y => y.id === el.dataset.id); if (p) { CR.form = { kind: "produto", id: p.id, nome: p.nome, preco: p.preco || "", custo: p.custo || "", tempo: p.tempo || "", itens: (p.itens || []).join(", ") }; renderCrochet(); } }
      else if (a === "cr-cli-edit") { const c = CR.clientes.find(y => y.id === el.dataset.id); if (c) { CR.form = { kind: "cliente", id: c.id, nome: c.nome, telefone: c.telefone || "", instagram: c.instagram || "", cidade: c.cidade || "", obs: c.obs || "" }; CR.cliSel = null; renderCrochet(); } }
      else if (a === "cr-item-add") { CR.form.itens.push({ produtoId: "", qtd: 1 }); renderCrochet(); }
      else if (a === "cr-item-del") { CR.form.itens.splice(Number(el.dataset.i), 1); renderCrochet(); }
      else if (a === "cr-extra-add") { CR.form.extras.push({ nome: "", valor: "" }); renderCrochet(); }
      else if (a === "cr-extra-del") { CR.form.extras.splice(Number(el.dataset.i), 1); renderCrochet(); }
      else if (a === "cr-novo-prod") { CR.form = { kind: "produto", nome: "", preco: "", custo: "" , tempo: "", itens: ""}; renderCrochet(); }
      else if (a === "cr-novo-cli") { CR.form = { kind: "cliente", nome: "", telefone: "", obs: "" , instagram: "", cidade: ""}; renderCrochet(); }
      else if (a === "cr-cancelar") { CR.form = null; renderCrochet(); }
      else if (a === "cr-aba") { CR.aba = el.dataset.v; CR.cliSel = null; CR.encSel = null; CR.form = null; renderCrochet(); }
      else if (a === "cr-cli-sel") { CR.cliSel = el.dataset.id; CR.encSel = null; renderCrochet(); }
      else if (a === "cr-cli-voltar") { CR.cliSel = null; CR.encSel = null; renderCrochet(); }
      else if (a === "cr-enc-sel") { CR.encSel = CR.encSel === el.dataset.id ? null : el.dataset.id; renderCrochet(); }
      else if (a === "cr-salvar") await salvarCrochet();
      else if (a === "cr-entregue" || a === "cr-paga") {
        const campo = a === "cr-entregue" ? "entregue" : "paga";
        const x = CR.encomendas.find(y => y.id === el.dataset.id);
        if (!x) return;
        x[campo] = !x[campo];
        renderCrochet();
        await colecao("crochetEncomendas").doc(x.id).update({ [campo]: x[campo] });
      }
      else if (a === "cr-del-enc" || a === "cr-del-prod" || a === "cr-del-cli") {
        const colec = a === "cr-del-enc" ? "crochetEncomendas" : (a === "cr-del-prod" ? "crochetProdutos" : "crochetClientes");
        if (!(await confirmar("Excluir este item?"))) return;
        await colecao(colec).doc(el.dataset.id).delete();
        if (a === "cr-del-enc") CR.encomendas = CR.encomendas.filter(x => x.id !== el.dataset.id);
        if (a === "cr-del-prod") CR.produtos = CR.produtos.filter(x => x.id !== el.dataset.id);
        if (a === "cr-del-cli") CR.clientes = CR.clientes.filter(x => x.id !== el.dataset.id);
        renderCrochet();
      }
    } catch (err) { mostrarErro(err.message); }
  }

  function tratarEntradaCrochet(e) {
    const c = e.target.dataset.campo;
    if (c === "cr-busca") { CR.busca = e.target.value; renderCrochet(); const b = document.querySelector("[data-campo='cr-busca']"); if (b) { b.focus(); b.setSelectionRange(b.value.length, b.value.length); } return; }
    const f = CR.form;
    if (!c || !f) return;
    const muda = e.type === "change";
    if (c === "cr-item-prod" || c === "cr-item-qtd") {
      const it = f.itens[Number(e.target.dataset.i)];
      if (c === "cr-item-prod") it.produtoId = e.target.value; else it.qtd = e.target.value;
      if (muda) { f.custo = String(crCustoItens(f.itens)); renderCrochet(); }
      return;
    }
    else if (c === "cr-cliente") { f.clienteId = e.target.value; }
    else if (c === "cr-frete") { f.frete = e.target.checked; renderCrochet(); }
    else if (c === "cr-valor-frete") { f.valorFrete = e.target.value; if (muda) renderCrochet(); }
    else if (c === "cr-endereco") f.endereco = e.target.value;
    else if (c === "cr-sinal") { f.sinalPago = e.target.checked; renderCrochet(); }
    else if (c === "cr-valor-sinal") f.valorSinal = e.target.value;
    else if (c === "cr-extra-nome") f.extras[Number(e.target.dataset.i)].nome = e.target.value;
    else if (c === "cr-extra-valor") f.extras[Number(e.target.dataset.i)].valor = e.target.value;
    else if (c === "cr-desc") f.descricao = e.target.value;
    else if (c === "cr-data") f.dataEntrega = e.target.value;
    else if (c === "cr-valor") f.valor = e.target.value;
    else if (c === "cr-custo") f.custo = e.target.value;
    else if (c === "cr-obs") f.obs = e.target.value;
    else if (c === "cr-prod-nome") f.nome = e.target.value;
    else if (c === "cr-prod-preco") f.preco = e.target.value;
    else if (c === "cr-prod-custo") f.custo = e.target.value;
    else if (c === "cr-cli-nome") f.nome = e.target.value;
    else if (c === "cr-cli-tel") f.telefone = e.target.value;
    else if (c === "cr-cli-obs") f.obs = e.target.value;
    else if (c === "cr-cli-insta") f.instagram = e.target.value;
    else if (c === "cr-cli-cidade") f.cidade = e.target.value;
    else if (c === "cr-prod-tempo") f.tempo = e.target.value;
    else if (c === "cr-prod-itens") f.itens = e.target.value;
    if (muda && c === "cr-cliente") renderCrochet();
  }

  function proximoNumeroEncomenda() {
    return CR.encomendas.reduce((m, e) => Math.max(m, Number(e.numero) || 0), 0) + 1;
  }

  async function salvarCrochet() {
    const f = CR.form;
    if (!f) return;
    try {
      if (f.kind === "encomenda") {
        const itens = (f.itens || []).filter(i => i.produtoId).map(i => ({ produtoId: i.produtoId, qtd: Math.max(1, Number(i.qtd) || 1) }));
        if (!itens.length) { mostrarErro("Adicione pelo menos um produto."); return; }
        const base = {
          itens: itens, clienteId: f.clienteId || null, dataEntrega: f.dataEntrega || null,
          frete: !!f.frete, valorFrete: f.frete ? crNum(f.valorFrete) : 0,
          endereco: f.frete ? ((f.endereco || "").trim() || null) : null,
          extras: (f.extras || []).filter(x => x.nome || x.valor).map(x => ({ nome: (x.nome || "").trim(), valor: crNum(x.valor) })),
          custo: crNum(f.custo), valor: crValorItens(itens) + (f.frete ? crNum(f.valorFrete) : 0),
          sinalPago: !!f.sinalPago, valorSinal: f.sinalPago ? crNum(f.valorSinal) : 0, obs: (f.obs || "").trim() || null
        };
        if (f.id) {
          await colecao("crochetEncomendas").doc(f.id).update(base);
          const x = CR.encomendas.find(y => y.id === f.id);
          if (x) Object.assign(x, base);
        } else {
          const obj = { ...base, numero: proximoNumeroEncomenda(), entregue: false, paga: false };
          const ref = await colecao("crochetEncomendas").add(obj);
          CR.encomendas.push({ id: ref.id, ...obj });
        }
      } else if (f.kind === "produto") {
        if (!f.nome.trim()) { mostrarErro("Dê um nome ao produto."); return; }
        const itens = String(f.itens || "").split(/[,;\n]+/).map(x => x.trim()).filter(Boolean);
        if (f.id) {
          const base = { nome: f.nome.trim(), preco: crNum(f.preco), custo: crNum(f.custo), tempo: Number(f.tempo) || 0, itens: itens };
          await colecao("crochetProdutos").doc(f.id).update(base);
          const x = CR.produtos.find(y => y.id === f.id);
          if (x) Object.assign(x, base);
        } else {
          const obj = { codigo: gerarCodigoProduto(f.nome), nome: f.nome.trim(), preco: crNum(f.preco), custo: crNum(f.custo), tempo: Number(f.tempo) || 0, itens: itens };
          const ref = await colecao("crochetProdutos").add(obj);
          CR.produtos.push({ id: ref.id, ...obj });
        }
      } else if (f.kind === "cliente") {
        if (!f.nome.trim()) { mostrarErro("Dê um nome ao cliente."); return; }
        const base = { nome: f.nome.trim(), telefone: (f.telefone || "").trim() || null, instagram: (f.instagram || "").trim() || null, cidade: (f.cidade || "").trim() || null, obs: (f.obs || "").trim() || null };
        if (f.id) {
          await colecao("crochetClientes").doc(f.id).update(base);
          const x = CR.clientes.find(y => y.id === f.id);
          if (x) Object.assign(x, base);
        } else {
          const ref = await colecao("crochetClientes").add(base);
          CR.clientes.push({ id: ref.id, ...base });
        }
      }
      CR.form = null;
      renderCrochet();
    } catch (err) { mostrarErro(err.message); }
  }


  // ---------- Temporizador de estudo (Meu Dia e Revisões) ----------
  const TM = { metodo: "pomodoro", rodando: false, base: 0, inicio: 0, fase: "estudo", minutos: 50, ciclo: 1, reg: 0 };
  const ES = { lista: [], editId: null };
  const TM_METODOS = {
    pomodoro: { nome: "Pomodoro 25/5", estudo: 25, pausa: 5 },
    longo: { nome: "50/10", estudo: 50, pausa: 10 },
    cronometro: { nome: "Cronômetro" },
    contagem: { nome: "Contagem regressiva" }
  };
  function tmEhCiclo() { return TM.metodo === "pomodoro" || TM.metodo === "longo"; }
  function tmDuracaoMs() {
    if (tmEhCiclo()) return (TM.fase === "estudo" ? TM_METODOS[TM.metodo].estudo : TM_METODOS[TM.metodo].pausa) * 60000;
    if (TM.metodo === "contagem") return (Number(TM.minutos) || 0) * 60000;
    return 0;
  }
  function tmDecorridoMs() { return TM.base + (TM.rodando ? Date.now() - TM.inicio : 0); }
  function tmFormat(ms) {
    const t = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), sg = t % 60;
    return (h ? h + ":" : "") + String(m).padStart(2, "0") + ":" + String(sg).padStart(2, "0");
  }
  function tmTexto() {
    const dec = tmDecorridoMs();
    return TM.metodo === "cronometro" ? tmFormat(dec) : tmFormat(tmDuracaoMs() - dec);
  }
  function tmRotulo() {
    if (tmEhCiclo()) return (TM.fase === "estudo" ? "Estudo" : "Pausa") + " · ciclo " + TM.ciclo;
    return TM.metodo === "cronometro" ? "Tempo livre" : "Contagem regressiva";
  }
  function htmlTmInner() {
    const chips = Object.keys(TM_METODOS).map(k =>
      "<button class='chip-acao" + (TM.metodo === k ? " ruim" : "") + "' data-acao='tm-metodo' data-v='" + k + "'>" + TM_METODOS[k].nome + "</button>").join("");
    return "<div class='es-chips' style='justify-content:center'>" + chips + "</div>" +
      (TM.metodo === "contagem" ? "<div class='ag-linha' style='margin-top:8px'><input type='number' inputmode='numeric' placeholder='Minutos' data-campo='tm-min' value='" + TM.minutos + "'></div>" : "") +
      "<div class='tm-visor'><small class='tm-fase'>" + tmRotulo() + "</small><strong class='tm-tempo'>" + tmTexto() + "</strong></div>" +
      "<div class='es-chips' style='justify-content:center'><button class='chip-acao ruim' data-acao='tm-toggle'>" + (TM.rodando ? "Pausar" : "Iniciar") + "</button>" +
      "<button class='chip-acao' data-acao='tm-reset'>Reiniciar</button></div>";
  }
  function tmHumano(ms) {
    const min = Math.round((Number(ms) || 0) / 60000);
    const h = Math.floor(min / 60), m = min % 60;
    return h ? h + "h" + (m ? " " + m + "min" : "") : m + "min";
  }
  // Registra o tempo que passou desde o último registro (pausa, fim de fase ou reinício).
  function tmRegistrarDelta() {
    const dec = tmDecorridoMs();
    const delta = dec - (TM.reg || 0);
    TM.reg = dec;
    if (delta < 30000) return;
    const obj = { dataISO: hojeEstudo(), ms: Math.round(delta), metodo: TM.metodo, metodoNome: TM_METODOS[TM.metodo].nome, fase: tmRotulo() };
    colecao("sessoesEstudo").add(obj).then(ref => { ES.lista.push({ id: ref.id, ...obj }); atualizarSessoes(); }).catch(err => mostrarErro(err.message));
  }
  async function carregarSessoes() {
    const snap = await colecao("sessoesEstudo").get();
    ES.lista = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }
  function htmlSessoesInner(dia) {
    const lista = ES.lista.filter(x => x.dataISO === dia);
    const total = lista.reduce((a, x) => a + Number(x.ms || 0), 0);
    return "<p class='ses-total'><strong>" + tmHumano(total) + "</strong> estudados</p>" +
      (lista.map(x => "<div class='es-linha'>" +
        (ES.editId === x.id
          ? "<input type='number' inputmode='numeric' data-campo='ses-min' data-id='" + x.id + "' value='" + Math.round(x.ms / 60000) + "' style='width:90px'><button class='chip-acao ok' data-acao='ses-save' data-id='" + x.id + "'>Salvar</button>"
          : "<span class='es-texto'><strong>" + tmHumano(x.ms) + "</strong><small>" + esc(x.metodoNome || x.metodo) + " · " + esc(x.fase || "") + "</small></span>" +
            "<button class='excluir' data-acao='ses-edit' data-id='" + x.id + "' aria-label='Editar tempo'>✎</button>") +
        "<button class='excluir' data-acao='ses-del' data-id='" + x.id + "' aria-label='Excluir tempo'>×</button></div>").join("") ||
        "<p class='vazio'>Nenhum tempo registrado neste dia.</p>");
  }
  function htmlSessoesDia(dia) {
    return "<div class='bloco faixa faixa-tempo'><h3>Tempo de estudo do dia</h3><div class='ses-box' data-dia='" + dia + "'>" + htmlSessoesInner(dia) + "</div></div>";
  }
  function msDoDia(iso) {
    return ES.lista.filter(x => x.dataISO === iso).reduce((a, x) => a + Number(x.ms || 0), 0);
  }
  function inicioSemanaISO(iso) {
    const [y, m, d] = iso.split("-").map(Number);
    const dow = (new Date(y, m - 1, d).getDay() + 6) % 7;
    return addDiasISO(iso, -dow);
  }
  function htmlResumoSemana(ref) {
    const ini = inicioSemanaISO(ref);
    const dias = [0, 1, 2, 3, 4, 5, 6].map(i => addDiasISO(ini, i));
    const nomes = ["Seg", "Ter", "Qua", "Qui", "Sex", "Sáb", "Dom"];
    const tempos = dias.map(msDoDia);
    const max = Math.max(...tempos, 1);
    const total = tempos.reduce((a, b) => a + b, 0);
    const barras = dias.map((d, i) => {
      const alt = tempos[i] ? Math.max(6, Math.round(tempos[i] / max * 64)) : 4;
      return "<div class='sem-barra' title='" + tmHumano(tempos[i]) + "'><i class='" + (tempos[i] ? "" : "zero") + "' style='height:" + alt + "px'></i>" + nomes[i] + "</div>";
    }).join("");
    return "<div class='bloco'><div class='habitos-topo'><h3>Semana de " + dataCurta(ini) + " a " + dataCurta(addDiasISO(ini, 6)) + "</h3>" +
      "<small class='ses-total' style='margin:0'>" + tmHumano(total) + " estudados</small></div>" +
      "<div class='sem-barras'>" + barras + "</div></div>";
  }
  function resumoMes(ano, mes) {
    const ym = ano + "-" + pad(mes + 1);
    const total = ES.lista.filter(x => x.dataISO.slice(0, 7) === ym).reduce((a, x) => a + Number(x.ms || 0), 0);
    const diasUteis = new Date(ano, mes + 1, 0).getDate();
    let uteis = 0;
    for (let d = 1; d <= diasUteis; d++) { const w = new Date(ano, mes, d).getDay(); if (w !== 0 && w !== 6) uteis++; }
    return { total: total, media: uteis ? total / uteis : 0 };
  }

  function atualizarSessoes() {
    if (document.getElementById("estudos") && typeof renderEstudos === "function") renderEstudos();
    document.querySelectorAll(".ses-box").forEach(b => { b.innerHTML = htmlSessoesInner(b.dataset.dia); });
  }
  function tmRedesenhar() {
    document.querySelectorAll(".tm-box").forEach(b => { b.innerHTML = htmlTmInner(); });
  }
  function tmMostrar() {
    const txt = tmTexto();
    document.querySelectorAll(".tm-tempo").forEach(el => { el.textContent = txt; });
    if (TM.rodando && tmEhCiclo() === false && TM.metodo === "contagem" && tmDecorridoMs() >= tmDuracaoMs()) tmFimDeFase();
    else if (TM.rodando && tmEhCiclo() && tmDecorridoMs() >= tmDuracaoMs()) tmFimDeFase();
  }
  function tmFimDeFase() {
    tmRegistrarDelta();
    TM.rodando = false;
    TM.base = 0;
    TM.reg = 0;
    if (tmEhCiclo()) {
      if (TM.fase === "estudo") TM.fase = "pausa";
      else { TM.fase = "estudo"; TM.ciclo++; }
    }
    try { vibrar(); } catch (e) {}
    tmRedesenhar();
  }
  setInterval(() => { if (TM.rodando) tmMostrar(); }, 1000);
  document.addEventListener("click", e => {
    const el = e.target.closest("[data-acao^='tm-']");
    if (!el) return;
    const a = el.dataset.acao;
    if (a === "tm-metodo") {
      if (TM.rodando) return;
      TM.metodo = el.dataset.v; TM.base = 0; TM.reg = 0; TM.fase = "estudo"; TM.ciclo = 1;
      tmRedesenhar();
    } else if (a === "tm-toggle") {
      if (TM.rodando) { tmRegistrarDelta(); TM.base = tmDecorridoMs(); TM.rodando = false; }
      else { TM.inicio = Date.now(); TM.rodando = true; }
      tmRedesenhar();
    } else if (a === "tm-reset") {
      tmRegistrarDelta();
      TM.rodando = false; TM.base = 0; TM.reg = 0; TM.fase = "estudo"; TM.ciclo = 1;
      tmRedesenhar();
    }
  });
  document.addEventListener("click", e => {
    const el = e.target.closest("[data-acao^='ses-']");
    if (!el) return;
    const a = el.dataset.acao;
    if (a === "ses-edit") { ES.editId = el.dataset.id; atualizarSessoes(); }
    else if (a === "ses-save") {
      const inp = document.querySelector("[data-campo='ses-min'][data-id='" + el.dataset.id + "']");
      const min = Number(inp && inp.value);
      if (!min || min <= 0) { mostrarErro("Digite um tempo maior que zero."); return; }
      const x = ES.lista.find(y => y.id === el.dataset.id);
      if (x) {
        x.ms = min * 60000;
        colecao("sessoesEstudo").doc(el.dataset.id).update({ ms: x.ms }).catch(err => mostrarErro(err.message));
      }
      ES.editId = null;
      atualizarSessoes();
    }
    else if (a === "ses-del") {
      confirmar("Excluir este tempo de estudo?").then(ok => {
        if (!ok) return;
        colecao("sessoesEstudo").doc(el.dataset.id).delete().then(() => {
          ES.lista = ES.lista.filter(y => y.id !== el.dataset.id);
          atualizarSessoes();
        }).catch(err => mostrarErro(err.message));
      });
    }
  });
  document.addEventListener("change", e => {
    const c = e.target.dataset && e.target.dataset.campo;
    if (c === "cp-cor" || c === "cp-hex") {
      const v = e.target.value.trim();
      if (!/^#[0-9a-fA-F]{6}$/.test(v)) { mostrarErro("Use o formato #RRGGBB, por exemplo #770523."); return; }
      aplicarCorPrincipal(v, true);
      document.querySelectorAll("[data-campo='cp-cor'], [data-campo='cp-hex']").forEach(x => { x.value = CP.cor; });
    }
  });
  document.addEventListener("change", e => {
    if (e.target.dataset && e.target.dataset.campo === "tm-min") {
      TM.minutos = Number(e.target.value) || 50;
      if (!TM.rodando) tmRedesenhar();
    }
  });

  // ---------- lembretes de compromissos ----------
  const AVISADOS = new Set();

  function confirmar(mensagem) {
    return new Promise(resolve => {
      const fundo = document.createElement("div");
      fundo.className = "confirm-fundo";
      fundo.innerHTML = "<div class='confirm-caixa'><p>" + esc(mensagem) + "</p><div class='confirm-acoes'>" +
        "<button class='secundario' data-r='0'>Cancelar</button><button class='grande' data-r='1'>Confirmar</button></div></div>";
      fundo.addEventListener("click", e => {
        const b = e.target.closest("button[data-r]");
        if (!b) return;
        fundo.remove();
        resolve(b.dataset.r === "1");
      });
      document.body.appendChild(fundo);
    });
  }

  function mostrarAviso(msg) {
    let b = document.getElementById("aviso-banner");
    if (!b) {
      b = document.createElement("div");
      b.id = "aviso-banner";
      b.style.cssText = "position:fixed;left:8px;right:8px;top:8px;background:var(--burgundy);color:#fff;padding:10px 12px;border-radius:12px;font-size:13px;z-index:99;";
      b.onclick = () => b.remove();
      document.body.appendChild(b);
    }
    b.textContent = msg + " (toque para fechar)";
  }

  function verificarLembretes() {
    if (!usuario) return;
    const hoje = hojeISO();
    const agora = new Date();
    const minAgora = agora.getHours() * 60 + agora.getMinutes();
    G.compromissos.filter(c => c.dataISO === hoje).forEach(c => {
      const falta = minutos(c.inicio) - minAgora;
      const chave = c.id + "|" + hoje;
      if (falta >= 0 && falta <= 10 && !AVISADOS.has(chave)) {
        AVISADOS.add(chave);
        if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
        mostrarAviso("Em " + falta + " min: " + c.titulo);
      }
    });
  }
  setInterval(verificarLembretes, 30000);

  // ---------- treinos: tela ----------
  function renderTreinos() {
    const el = document.getElementById("treinos");
    if (!el) return;
    if (T.editorTipo) { T.centralizar = true; el.innerHTML = htmlEditorAtual(); return; }

    let h = "<h2>Treinos</h2><div class='abas'>" +
      "<button class='aba" + (T.aba === "geral" ? " ativo" : "") + "' data-acao='aba' data-v='geral'>Geral</button>" +
      "<button class='aba" + (T.aba === "historico" ? " ativo" : "") + "' data-acao='aba' data-v='historico'>Histórico</button>" +
    "</div>";
    h += T.aba === "geral" ? htmlAbaDia() : htmlAbaHistorico();
    h += "<div class='fabs'>" +
      "<button class='fab' data-acao='abrir-metas' aria-label='Metas'>" + ICONES.alvo + "</button>" +
      "<button class='fab' data-acao='abrir-lista' aria-label='Editar treinos'>" + ICONES.lapis + "</button>" +
    "</div>";
    const roletaAntes = el.querySelector(".roleta");
    const posAntes = roletaAntes ? roletaAntes.scrollLeft : 0;
    el.innerHTML = h;

    const roleta = el.querySelector(".roleta");
    if (roleta) {
      if (T.centralizar) {
        const inicio = el.querySelector(".roleta .dia[data-iso='" + inicioSemana(hojeISO()) + "']");
        if (inicio) roleta.scrollLeft = inicio.offsetLeft - roleta.offsetLeft;
        T.centralizar = false;
      } else {
        roleta.scrollLeft = posAntes;
      }
    }
    atualizarTempos();
  }

  function celula(iso) {
    const h = hojeISO();
    const tem = sessoesDoDia(iso).length > 0;
    return "<button class='dia" + (iso === h ? " hoje" : "") + (iso === T.selecionado ? " sel" : "") +
      "' data-acao='dia' data-iso='" + iso + "'>" +
      "<small>" + NOMES[diaSemana(iso)] + "</small><b>" + dePara(iso).getDate() + "</b>" +
      (tem ? ICONE_CHECK : "<i></i>") +
    "</button>";
  }

  function htmlAbaDia() {
    const h = hojeISO();
    const ini = inicioSemana(h);
    let semana = "";
    for (let k = 0; k < 7; k++) semana += celula(somar(ini, k));
    let roleta = "";
    for (let k = -30; k <= 30; k++) roleta += celula(somar(h, k));
    const n = diasTreinados(ini, somar(ini, 6));
    const meta = T.metas.semanal ? " de " + T.metas.semanal : "";

    return "<div class='roleta'>" + roleta + "</div>" +
      "<p class='resumo'>Esta semana: <strong>" + n + "</strong> dia" + (n === 1 ? "" : "s") + " treinado" + (n === 1 ? "" : "s") + meta + "</p>" +
      "<div id='treino-status' class='status'></div>" +
      "<div class='painel-dia'>" + htmlPainelDia() + "</div>" + htmlCardioDia();
  }

  function htmlPainelDia() {
    const iso = T.selecionado;
    const h = hojeISO();
    let html = "<h2>" + tituloDia(iso) + "</h2>";

    if (iso === h && T.sessao) return html + htmlSessaoAtiva();

    const sess = sessoesDoDia(iso);
    sess.forEach(s => { html += htmlSessaoFeita(s); });
    CARDIO.lista.filter(c => c.dataISO === iso).forEach(c => { html += htmlCardioFeito(c); });

    if (iso < h) {
      if (sess.length === 0) {
        html += T.registrando
          ? htmlRegistro()
          : "<p class='vazio'>Sem treino registrado.</p>" +
            "<div class='centro'><button class='secundario' data-acao='registrar-abrir'>Registrar o que fiz</button></div>";
      }
      return html;
    }
    return html + htmlProgramado(iso);
  }

  function htmlProgramado(iso) {
    if (T.trocando) return htmlEscolherTreino();
    const prog = treinoDoDia(iso);
    let h = "<div class='prog'>" + (prog
        ? "<span>Treino programado: <strong>" + esc(prog.nome) + "</strong></span>"
        : "<span>Nenhum treino programado para este dia.</span>") +
      "<button class='icone' data-acao='trocar' aria-label='Trocar treino'>⇄</button></div>";
    if (iso === hojeISO()) {
      h += prog
        ? "<div class='centro'><button class='grande' data-acao='iniciar'>Começar treino</button></div>"
        : "<p class='vazio'>Toque em ⇄ para escolher um treino, ou cadastre um com dia sugerido pelo ✎.</p>";
    }
    return h;
  }

  function htmlEscolherTreino() {
    if (T.treinos.length === 0) {
      return "<p class='vazio'>Cadastre seus treinos primeiro, pelo botão ✎.</p>" +
        "<div class='centro'><button class='secundario' data-acao='cancelar-troca'>Voltar</button></div>";
    }
    return "<p class='sub'>Escolha o treino para este dia:</p>" +
      T.treinos.map(t => "<button class='treino-item' data-acao='escolher' data-id='" + t.id + "'><span>" + esc(t.nome) + "</span></button>").join("") +
      "<div class='centro'><button class='secundario' data-acao='cancelar-troca'>Cancelar</button></div>";
  }

  function htmlRegistro() {
    const lista = T.treinos.length
      ? "<p class='sub'>Escolha um treino salvo:</p>" +
        T.treinos.map(t => "<button class='treino-item' data-acao='registrar-treino' data-id='" + t.id + "'><span>" + esc(t.nome) + "</span></button>").join("")
      : "<p class='vazio'>Você ainda não tem treinos salvos.</p>";
    return lista +
      "<p class='sub'>Ou descreva o que você fez:</p>" +
      "<textarea data-campo='descricao' placeholder='Ex.: Costas: puxada 40 kg, remada 30 kg, 3 séries de 10'>" + esc(T.descricao) + "</textarea>" +
      "<div class='centro'>" +
        "<button class='secundario' data-acao='registrar-cancelar'>Cancelar</button>" +
        "<button class='grande' data-acao='registrar-salvar'>Salvar registro</button>" +
      "</div>";
  }

  async function registrarTreinoAntigo(id) {
    const t = T.treinos.find(x => x.id === id);
    if (!t) return;
    const obj = {
      dataISO: T.selecionado, nome: t.nome, treinoId: t.id, manual: false, duracaoSeg: null,
      exercicios: t.exercicios.map(ex => ({ nome: ex.nome, tipo: ex.tipo, carga: null, feito: true, series: Array.from({ length: Number(ex.series) || 0 }, (_, k) => ({ n: k + 1, peso: null, reps: Number(ex.reps) || null })) }))
    };
    try {
      const ref = await colecao("sessoes").add({ ...obj, data: firebase.firestore.FieldValue.serverTimestamp() });
      T.sessoes.push({ id: ref.id, ...obj });
      T.registrando = false;
      renderTreinos();
    } catch (err) {
      mostrarErro(err.message);
    }
  }

  function htmlSessaoFeita(s) {
    let h = "<div class='feito-card'><div class='ex-topo'><span>" + (s.manual ? "Registro manual" : "<span class='etiqueta'>" + ICONE_CHECK + " Treino concluído</span>") + "</span><span>" +
      (s.manual || !s.duracaoSeg ? "" : formatar(s.duracaoSeg)) + "</span></div>";
    if (s.manual) {
      h += "<p class='texto'>" + esc(s.descricao) + "</p>";
    } else {
      h += "<p class='nome-feito'>" + esc(s.nome) + "</p>";
      (s.exercicios || []).forEach(ex => {
        let detalhe;
        if (ex.series && ex.series.length) {
          detalhe = ex.series.map(x =>
            (x.peso !== null && x.peso !== undefined ? x.peso + " kg" : "–") + " × " +
            (x.reps !== null && x.reps !== undefined ? x.reps : "–")
          ).join(" · ");
        } else {
          detalhe = ex.carga === null || ex.carga === undefined ? "sem carga" : ex.carga + " kg";
        }
        h += "<div class='linha-ex'><span>" + esc(ex.nome) + (ex.feito ? "" : " (pulado)") + "</span><span>" + detalhe + "</span></div>";
      });
    }
    if (s.id) h += "<button class='excluir-sessao' data-acao='excluir-sessao' data-id='" + s.id + "'>Excluir treino</button>";
    return h + "</div>";
  }

  function htmlSessaoAtiva() {
    const t = T.treinoHoje;
    let h = "<h2>" + esc(t.nome) + "</h2><div class='cronometro'><small>tempo de treino</small><strong id='tempo'></strong></div>";
    if (T.descanso) {
      h += "<div class='descanso'>Descanso<strong id='descanso'></strong><div class='ajuste'><button data-acao='descanso-menos'>−15 s</button><button data-acao='descanso-mais'>+15 s</button><button data-acao='pular'>Pular</button></div></div>";
    }
    h += t.exercicios.map((ex, i) => cardExercicio(ex, i)).join("");
    h += "<div class='centro'><button class='grande' data-acao='finalizar'>Finalizar treino</button></div>";
    return h;
  }

  function descansoPadrao() {
    const v = Number(T.metas.descanso);
    return v > 0 ? v : 60;
  }

  function numSeries(ex, i) {
    return T.numSeries[i] || Number(ex.series) || 1;
  }

  function obterSerie(i, j, ex, ultima) {
    if (!T.series[i]) T.series[i] = [];
    if (!T.series[i][j]) {
      T.series[i][j] = { peso: ultima ? ultima.carga : "", reps: Number(ex.reps) || "", feito: false };
    }
    return T.series[i][j];
  }

  function cardExercicio(ex, i) {
    const ultima = T.ultimas[slug(ex.nome)];
    const qtd = numSeries(ex, i);
    let h = "<div class='ex'>" +
      "<div class='ex-topo'><span>" + esc(ex.nome) + "</span><span>" + esc(ex.series) + " × " + esc(ex.reps) + (ex.tipo === "lado" ? " por lado" : "") + "</span></div>" +
      (ultima ? "<small>Última vez: " + ultima.carga + " kg" + (ex.tipo === "lado" ? " por lado" : "") + "</small>" : "") +
      "<div class='series'>" +
        "<div class='serie cab'><span></span><span>kg</span><span>repetições</span><span></span></div>";
    for (let j = 0; j < qtd; j++) {
      const s = obterSerie(i, j, ex, ultima);
      h += "<div class='serie" + (s.feito ? " feita" : "") + "'>" +
        "<span class='serie-n'>" + (j + 1) + "</span>" +
        "<input type='number' inputmode='decimal' step='0.5' placeholder='kg' value='" + (s.peso ?? "") + "' data-campo='peso' data-i='" + i + "' data-s='" + j + "'>" +
        "<input type='number' inputmode='numeric' placeholder='reps' value='" + (s.reps ?? "") + "' data-campo='reps' data-i='" + i + "' data-s='" + j + "'>" +
        "<button class='bolinha' data-acao='serie-feito' data-i='" + i + "' data-s='" + j + "' aria-label='Marcar série'>" + (s.feito ? ICONE_CHECK : "") + "</button>" +
      "</div>";
    }
    h += "</div><button class='secundario' data-acao='serie-add' data-i='" + i + "'>+ Série</button></div>";
    return h;
  }

  // ---------- histórico ----------
  function diasTreinados(ini, fim) {
    const dias = new Set(T.sessoes.filter(x => x.dataISO >= ini && x.dataISO <= fim).map(x => x.dataISO));
    return dias.size;
  }

  function navegacao(titulo, tipo) {
    return "<div class='nav'>" +
      "<button class='icone' data-acao='nav' data-d='-1' data-tipo='" + tipo + "' aria-label='Anterior'>‹</button>" +
      "<strong>" + titulo + "</strong>" +
      "<button class='icone' data-acao='nav' data-d='1' data-tipo='" + tipo + "' aria-label='Próximo'>›</button>" +
    "</div>";
  }

  function anel(feitos, meta, rotulo) {
    const C = 2 * Math.PI * 50;
    const pct = meta ? Math.min(1, feitos / meta) : 0;
    const centro = meta ? feitos + "/" + meta : String(feitos);
    const linhas = String(rotulo).split("|");
    const textos = linhas.map((t, i) => "<text x='60' y='" + (72 + i * 11) + "' text-anchor='middle' font-size='8.5' fill='#6B6259'>" + t + "</text>").join("");
    return "<svg viewBox='0 0 120 120' width='150' height='150' style='display:block;margin:0 auto' role='img' aria-label='Progresso: " + centro + "'>" +
      "<circle cx='60' cy='60' r='50' fill='none' stroke='#EFECE6' stroke-width='12'/>" +
      "<circle cx='60' cy='60' r='50' fill='none' style='stroke:var(--burgundy)' stroke-width='12' stroke-linecap='round' stroke-dasharray='" + (pct * C) + " " + C + "' transform='rotate(-90 60 60)'/>" +
      "<text x='60' y='" + (linhas.length > 1 ? 54 : 58) + "' text-anchor='middle' font-size='18' font-weight='600' fill='#2B2420'>" + centro + "</text>" + textos + "</svg>";
  }


  function anelSemana(feitos, meta) {
    return anel(feitos, meta, "treinos");
  }

  function htmlCalendario(ano, mes) {
    const primeiro = new Date(ano, mes, 1).getDay();
    const diasNoMes = new Date(ano, mes + 1, 0).getDate();
    let grade = NOMES.map(d => "<div class='cal-cab'>" + d + "</div>").join("");
    for (let k = 0; k < primeiro; k++) grade += "<div></div>";
    for (let d = 1; d <= diasNoMes; d++) {
      const iso = isoDe(new Date(ano, mes, d));
      const treinou = sessoesDoDia(iso).length > 0;
      grade += "<div class='cal-dia" + (treinou ? " treinado" : "") + (iso === hojeISO() ? " hoje" : "") + "'><span>" + d + "</span>" +
        (treinou ? ICONE_CHECK : "") + "</div>";
    }
    return "<div class='calendario'>" + grade + "</div>";
  }

  function SESSOES_ANO(ano) {
    return T.sessoes.filter(x => String(x.dataISO || "").startsWith(String(ano))).length;
  }

  function htmlAbaHistorico() {
    const agora = new Date();
    const ref = somar(hojeISO(), T.offsetSemana * 7);
    const ini = inicioSemana(ref);
    const fim = somar(ini, 6);
    const dias = diasTreinados(ini, fim);
    const meta = T.metas.semanal;
    const cardioMin = cardioMinutos(ini, fim);
    const metaCardio = T.metas.cardio;
    const mref = new Date(agora.getFullYear(), agora.getMonth() + T.offsetMes, 1);
    const anoAtual = agora.getFullYear();

    let h = "<section class='bloco'><h3>Semana</h3>" + navegacao(dataCurta(ini) + " a " + dataCurta(fim), "semana") +
      "<div class='aneis'>" + anelSemana(dias, meta) + anel(cardioMin, metaCardio, "minutos de cardio") + "</div>" +
      (meta || metaCardio ? "" : "<p class='vazio'>Defina suas metas no botão de alvo.</p>") + "</section>";

    h += "<section class='bloco'><h3>Mês</h3>" + navegacao(capitalizar(MESES[mref.getMonth()]) + " de " + mref.getFullYear(), "mes") +
      htmlCalendario(mref.getFullYear(), mref.getMonth()) + "</section>";

    const cardioAno = Math.round(CARDIO.lista.filter(x => x.dataISO.startsWith(String(anoAtual))).reduce((a, x) => a + Number(x.minutos || 0), 0) / 6) / 10;
    const treinosAno = SESSOES_ANO(anoAtual);
    h += "<section class='bloco'><h3>Ano: " + anoAtual + "</h3>" +
      "<div class='aneis'>" + anel(treinosAno, T.metas.anual, "treinos") + anel(cardioAno, T.metas.cardioAno || null, "horas de|cardio") + "</div></section>";
    return h;
  }

  // ---------- editores ----------
  function htmlEditorAtual() {
    if (T.editorTipo === "lista") return htmlListaEditor();
    if (T.editorTipo === "treino") return htmlEditorTreino();
    if (T.editorTipo === "metas") return htmlMetas();
    return "";
  }

  function htmlListaEditor() {
    return "<h2>Seus treinos</h2><p class='sub'>Toque em um treino para editar, ou crie um novo.</p>" +
      (T.treinos.length
        ? T.treinos.map(t =>
            "<div class='linha-treino'><button class='treino-item' data-acao='editar-treino' data-id='" + t.id + "'><span>" + esc(t.nome) + "</span><small>" +
            ((t.diasSugeridos || []).length ? t.diasSugeridos.map(d => NOMES[d]).join(", ") : "Sem dia") +
            "</small></button><button class='excluir' data-acao='excluir-lista' data-id='" + t.id + "' aria-label='Excluir treino'>" + ICONES.lixeira + "</button></div>").join("")
        : "<p class='vazio'>Nenhum treino cadastrado ainda.</p>") +
      "<button data-acao='novo-treino'>+ Novo treino</button>" +
      "<div class='centro'><button class='secundario' data-acao='fechar-editor'>Fechar</button></div>";
  }

  function htmlEditorTreino() {
    const e = T.editor;
    let h = "<h2>" + (e.id ? "Editar treino" : "Novo treino") + "</h2>" +
      "<input placeholder='Nome do treino (ex.: Costas e bíceps)' data-campo='nome' value='" + esc(e.nome) + "'>" +
      "<label>Quais dias você pretende fazer?</label>" +
      "<div class='chips'>" +
        NOMES.map((n, i) => "<button class='chip" + ((e.diasSugeridos || []).includes(i) ? " ativo" : "") + "' data-acao='dia-treino' data-i='" + i + "'>" + n + "</button>").join("") +
      "</div>" +
      "<label>Exercícios</label>";

    e.exercicios.forEach((ex, i) => {
      h += "<div class='lin-edit'>" +
        "<input placeholder='Exercício' data-campo='exNome' data-i='" + i + "' value='" + esc(ex.nome) + "'>" +
        "<input type='number' placeholder='Séries' data-campo='exSeries' data-i='" + i + "' value='" + esc(ex.series) + "'>" +
        "<input type='number' placeholder='Reps' data-campo='exReps' data-i='" + i + "' value='" + esc(ex.reps) + "'>" +
        "<button class='excluir' data-acao='ex-del' data-i='" + i + "'>×</button>" +
      "</div>";
    });

    h += "<button class='secundario' data-acao='ex-add'>+ Exercício</button>" +
      "<div id='treino-status' class='status'></div>" +
      "<div class='centro'>" +
        (e.id ? "<button class='excluir' data-acao='treino-excluir'>Excluir</button>" : "") +
        "<button class='secundario' data-acao='voltar-lista'>Cancelar</button>" +
        "<button class='grande' data-acao='treino-salvar'>Salvar</button>" +
      "</div>";
    return h;
  }

  function htmlMetas() {
    const r = T.metaRascunho;
    return "<h2>Metas</h2><p class='sub'>Defina quantos treinos você quer fazer.</p>" +
      "<label>Treinos por semana</label>" +
      "<input type='number' inputmode='numeric' placeholder='Ex.: 4' data-campo='meta' data-chave='semanal' value='" + (r.semanal ?? "") + "'>" +
      "<label>Treinos no ano</label>" +
      "<input type='number' inputmode='numeric' placeholder='Ex.: 150' data-campo='meta' data-chave='anual' value='" + (r.anual ?? "") + "'>" +
      "<label>Cardio por semana (minutos)</label>" +
      "<input type='number' inputmode='numeric' placeholder='Ex.: 3' data-campo='meta' data-chave='cardio' value='" + (r.cardio ?? "") + "'>" +
      "<label>Descanso padrão (segundos)</label>" +
      "<input type='number' inputmode='numeric' placeholder='60' data-campo='meta' data-chave='descanso' value='" + (r.descanso ?? "") + "'>" +
      "<div id='treino-status' class='status'></div>" +
      "<div class='centro'>" +
        "<button class='secundario' data-acao='fechar-editor'>Cancelar</button>" +
        "<button class='grande' data-acao='metas-salvar'>Salvar</button>" +
      "</div>";
  }

  // ---------- eventos ----------
  async function tratarCliqueInterno(e) {
    const el = e.target.closest("[data-acao]");
    if (!el) return;
    const a = el.dataset.acao;
    const i = Number(el.dataset.i);

    switch (a) {
      case "aba": T.aba = el.dataset.v; T.centralizar = true; renderTreinos(); break;
      case "hist": T.hist = el.dataset.v; renderTreinos(); break;
      case "nav": {
        const d = Number(el.dataset.d);
        if (el.dataset.tipo === "semana") T.offsetSemana += d; else T.offsetMes += d;
        renderTreinos();
        break;
      }
      case "dia":
        T.selecionado = el.dataset.iso;
        T.registrando = false;
        T.trocando = false;
        renderTreinos();
        break;
      case "trocar": T.trocando = true; renderTreinos(); break;
      case "cancelar-troca": T.trocando = false; renderTreinos(); break;
      case "escolher": {
        const iso = T.selecionado;
        T.trocas[iso] = el.dataset.id;
        T.trocando = false;
        try { await colecao("trocas").doc(iso).set({ treinoId: el.dataset.id }); } catch (err) { /* mantém localmente */ }
        renderTreinos();
        break;
      }
      case "iniciar": {
        const prog = treinoDoDia(hojeISO());
        if (!prog) return;
        T.treinoHoje = prog;
        T.sessao = { inicio: Date.now() };
        T.feitos = {};
        T.cargas = {};
        T.series = {};
        T.numSeries = {};
        T.descanso = null;
        manterTela();
        renderTreinos();
        break;
      }
      case "serie-feito": {
        const j = Number(el.dataset.s);
        const serie = T.series[i] && T.series[i][j];
        if (!serie) break;
        serie.feito = !serie.feito;
        if (serie.feito) T.descanso = { fim: Date.now() + descansoPadrao() * 1000 };
        renderTreinos();
        break;
      }
      case "serie-add": {
        const ex = T.treinoHoje.exercicios[i];
        T.numSeries[i] = numSeries(ex, i) + 1;
        renderTreinos();
        break;
      }
      case "pular": T.descanso = null; renderTreinos(); break;
      case "descanso-mais": if (T.descanso) { T.descanso.fim += 15000; renderTreinos(); } break;
      case "descanso-menos": if (T.descanso) { T.descanso.fim = Math.max(Date.now() + 1000, T.descanso.fim - 15000); renderTreinos(); } break;
      case "finalizar": await finalizarTreino(); break;
      case "registrar-abrir": T.registrando = true; renderTreinos(); break;
      case "registrar-cancelar": T.registrando = false; renderTreinos(); break;
      case "registrar-salvar": await salvarRegistro(); break;
      case "registrar-treino": await registrarTreinoAntigo(el.dataset.id); break;
      case "abrir-lista": T.editorTipo = "lista"; T.editor = null; renderTreinos(); break;
      case "abrir-metas": T.metaRascunho = { ...T.metas }; T.editorTipo = "metas"; renderTreinos(); break;
      case "fechar-editor": T.editorTipo = null; T.editor = null; renderTreinos(); break;
      case "voltar-lista": T.editorTipo = "lista"; T.editor = null; renderTreinos(); break;
      case "novo-treino":
        T.editor = { id: null, nome: "", diasSugeridos: [], exercicios: [] };
        T.editorTipo = "treino";
        renderTreinos();
        break;
      case "editar-treino": {
        const t = T.treinos.find(x => x.id === el.dataset.id);
        if (!t) break;
        T.editor = JSON.parse(JSON.stringify(t));
        T.editorTipo = "treino";
        renderTreinos();
        break;
      }
      case "dia-treino": {
        const lista = T.editor.diasSugeridos || [];
        T.editor.diasSugeridos = lista.includes(i) ? lista.filter(x => x !== i) : lista.concat([i]);
        renderTreinos();
        break;
      }
      case "ex-add":
        T.editor.exercicios.push({ nome: "", series: "", reps: "", tipo: "total" });
        renderTreinos();
        break;
      case "ex-del":
        T.editor.exercicios.splice(i, 1);
        renderTreinos();
        break;
      case "treino-salvar": await salvarTreino(); break;
      case "treino-excluir": await excluirTreino(); break;
      case "excluir-sessao": await excluirSessao(el.dataset.id); break;
      case "cardio-add": await cardioAdicionar(); break;
      case "cardio-tipo": CARDIO.novoTipo = el.dataset.tipo; renderTreinos(); break;
      case "cardio-del": await cardioExcluir(el.dataset.id); break;
      case "hist-total": T.histTotal = el.dataset.v; renderTreinos(); break;
      case "excluir-lista": await excluirTreinoPorId(el.dataset.id); break;
      case "metas-salvar": await salvarMetas(); break;
    }
  }

  async function tratarClique(e) {
    try {
      await tratarCliqueInterno(e);
    } catch (err) {
      mostrarErro(err.message);
    }
  }

  async function excluirSessao(id) {
    if (!id) return;
    if (!(await confirmar("Excluir este treino concluído? Essa ação não pode ser desfeita."))) return;
    try {
      await colecao("sessoes").doc(id).delete();
      T.sessoes = T.sessoes.filter(x => x.id !== id);
      renderTreinos();
    } catch (err) {
      mostrarErro(err.message);
    }
  }

  function tratarEntrada(e) {
    const d = e.target.dataset;
    if (d.campo === "cardio-min") { CARDIO.novoMin = e.target.value; return; }
    if (d.carga !== undefined) {
      const i = Number(d.carga);
      T.cargas[i] = e.target.value;
      const ex = T.treinoHoje && T.treinoHoje.exercicios[i];
      const span = document.querySelector("[data-total='" + i + "']");
      if (span && ex) {
        span.textContent = ex.tipo === "lado" && e.target.value !== "" ? "= " + (Number(e.target.value) * 2) + " kg no total" : "";
      }
      return;
    }
    if (d.campo === undefined) return;
    const i = Number(d.i);
    if (d.campo === "peso" || d.campo === "reps") {
      const serie = T.series[i] && T.series[i][Number(d.s)];
      if (serie) serie[d.campo] = e.target.value;
      return;
    }
    switch (d.campo) {
      case "descricao": T.descricao = e.target.value; break;
      case "nome": if (T.editor) T.editor.nome = e.target.value; break;
      case "exNome": if (T.editor) T.editor.exercicios[i].nome = e.target.value; break;
      case "exSeries": if (T.editor) T.editor.exercicios[i].series = e.target.value; break;
      case "exReps": if (T.editor) T.editor.exercicios[i].reps = e.target.value; break;
      case "exTipo": if (T.editor) T.editor.exercicios[i].tipo = e.target.value; break;
      case "meta": T.metaRascunho[d.chave] = e.target.value; break;
    }
  }

  // ---------- salvar ----------
  async function salvarRegistro() {
    const txt = (T.descricao || "").trim();
    const st = document.getElementById("treino-status");
    if (!txt) { if (st) st.textContent = "Escreva o que você treinou."; return; }
    const obj = { dataISO: T.selecionado, nome: "Registro manual", manual: true, descricao: txt };
    try {
      const ref = await colecao("sessoes").add({ ...obj, data: firebase.firestore.FieldValue.serverTimestamp() });
      T.sessoes.push({ id: ref.id, ...obj });
      T.registrando = false;
      T.descricao = "";
      renderTreinos();
    } catch (err) {
      if (st) st.textContent = "Erro ao salvar: " + err.message;
    }
  }

  async function finalizarTreino() {
    const t = T.treinoHoje;
    if (!t || !T.sessao) return;
    const duracao = Math.round((Date.now() - T.sessao.inicio) / 1000);
    const exercicios = t.exercicios.map((ex, i) => {
      const feitas = (T.series[i] || []).filter(x => x && x.feito);
      const series = feitas.map((x, k) => ({
        n: k + 1,
        peso: x.peso === "" || x.peso === null || x.peso === undefined ? null : Number(x.peso),
        reps: x.reps === "" || x.reps === null || x.reps === undefined ? null : Number(x.reps)
      }));
      const pesos = series.map(x => x.peso).filter(x => x !== null);
      return { nome: ex.nome, tipo: ex.tipo, feito: feitas.length > 0, series: series, carga: pesos.length ? Math.max(...pesos) : null };
    });
    const obj = { dataISO: hojeISO(), nome: t.nome, treinoId: t.id, manual: false, duracaoSeg: duracao, exercicios: exercicios };

    try {
      const promessas = [];
      exercicios.forEach(ex => {
        if (ex.carga !== null) {
          const id = slug(ex.nome);
          promessas.push(colecao("ultimas").doc(id).set({
            nome: ex.nome, carga: ex.carga, tipo: ex.tipo,
            data: firebase.firestore.FieldValue.serverTimestamp()
          }));
          T.ultimas[id] = { nome: ex.nome, carga: ex.carga, tipo: ex.tipo };
        }
      });
      promessas.push(colecao("sessoes").add({ ...obj, data: firebase.firestore.FieldValue.serverTimestamp() }));
      const resultados = await Promise.all(promessas);
      const sessaoRef = resultados[resultados.length - 1];
      T.sessoes.push({ id: sessaoRef.id, ...obj });

      T.sessao = null;
      T.treinoHoje = null;
      T.feitos = {};
      T.cargas = {};
      T.series = {};
      T.numSeries = {};
      T.descanso = null;
      soltarTela();
      renderTreinos();
      const st = document.getElementById("treino-status");
      if (st) st.textContent = "Treino salvo. Duração: " + formatar(duracao);
    } catch (err) {
      const st = document.getElementById("treino-status");
      if (st) st.textContent = "Erro ao salvar o treino: " + err.message;
    }
  }

  async function salvarTreino() {
    const e = T.editor;
    const st = document.getElementById("treino-status");
    const nome = (e.nome || "").trim();
    if (!nome) { if (st) st.textContent = "Dê um nome ao treino."; return; }
    const limpo = {
      nome: nome,
      diasSugeridos: (e.diasSugeridos || []).slice().sort((a, b) => a - b),
      exercicios: e.exercicios
        .filter(x => (x.nome || "").trim() !== "")
        .map(x => ({ nome: x.nome.trim(), series: x.series || "", reps: x.reps || "", tipo: "total" }))
    };
    try {
      let id = e.id;
      if (id) {
        await colecao("treinos").doc(id).set(limpo);
      } else {
        const ref = await colecao("treinos").add(limpo);
        id = ref.id;
      }
      const novo = { id: id, ...limpo };
      const idx = T.treinos.findIndex(x => x.id === id);
      if (idx >= 0) T.treinos[idx] = novo; else T.treinos.push(novo);
      T.editorTipo = "lista";
      T.editor = null;
      renderTreinos();
    } catch (err) {
      if (st) st.textContent = "Erro ao salvar: " + err.message;
    }
  }

  async function excluirTreinoPorId(id) {
    if (!id) return;
    if (!(await confirmar("Excluir este treino? Os treinos já feitos com ele continuam no histórico."))) return;
    try {
      await colecao("treinos").doc(id).delete();
      T.treinos = T.treinos.filter(x => x.id !== id);
      if (T.editorTipo === "treino" && T.editor && T.editor.id === id) {
        T.editorTipo = "lista";
        T.editor = null;
      }
      renderTreinos();
    } catch (err) {
      const st = document.getElementById("treino-status");
      if (st) st.textContent = "Erro ao excluir: " + err.message;
    }
  }

  async function excluirTreino() {
    const id = T.editor && T.editor.id;
    if (id) await excluirTreinoPorId(id);
  }

  async function salvarMetas() {
    const r = T.metaRascunho;
    const st = document.getElementById("treino-status");
    const num = v => (v === "" || v === null || v === undefined) ? null : Number(v);
    const obj = { semanal: num(r.semanal), anual: num(r.anual), ano: new Date().getFullYear(), descanso: num(r.descanso) || 60, cardio: num(r.cardio) };
    try {
      await colecao("config").doc("metas").set(obj);
      T.metas = obj;
      T.editorTipo = null;
      T.metaRascunho = {};
      renderTreinos();
    } catch (err) {
      if (st) st.textContent = "Erro ao salvar: " + err.message;
    }
  }

  // ---------- descanso e cronômetro ----------
  function atualizarTempos() {
    if (T.sessao) {
      const t = document.getElementById("tempo");
      if (t) t.textContent = formatar((Date.now() - T.sessao.inicio) / 1000);
    }
    if (T.descanso) {
      const restante = (T.descanso.fim - Date.now()) / 1000;
      if (restante <= 0) {
        T.descanso = null;
        vibrar();
        renderTreinos();
      } else {
        const d = document.getElementById("descanso");
        if (d) d.textContent = formatar(restante);
      }
    }
  }
  setInterval(atualizarTempos, 1000);

  telaGrande.addEventListener("change", () => {
    if (!usuario) return;
    if (!secaoAtual) secaoAtual = "geral";
    desenharMenu();
    desenharMain();
  });

  auth.onAuthStateChanged(user => user ? mostrarApp(user) : mostrarFormulario());
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
</script>
